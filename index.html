<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>DG Scorecard - Jeffery & Jack</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --sat: env(safe-area-inset-top, 20px);
      --sab: env(safe-area-inset-bottom, 20px);
    }
    body {
      padding-top: max(var(--sat), 16px);
      padding-bottom: max(var(--sab), 20px);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .custom-scroll::-webkit-scrollbar { display: none; }
    .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* Theme 1: Royal Blue Background with White Cards */
    body.theme-blue {
      background-color: #1e3a8a;
      color: #0f172a;
    }
    body.theme-blue .app-card {
      background-color: #ffffff;
      color: #0f172a;
      border: 1px solid #bfdbfe;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }
    body.theme-blue .app-header {
      background-color: rgba(30, 58, 138, 0.98);
      border-color: #2563eb;
      color: #ffffff;
    }
    body.theme-blue .app-footer {
      background-color: rgba(30, 58, 138, 0.98);
      border-color: #2563eb;
    }
    body.theme-blue .card-title { color: #0f172a; }
    body.theme-blue .card-subtext { color: #475569; }
    body.theme-blue .counter-box {
      background-color: #eff6ff;
      border-color: #bfdbfe;
    }
    body.theme-blue .counter-number { color: #1e3a8a; }

    /* Theme 2: White Background with Royal Blue Cards */
    body.theme-white {
      background-color: #f8fafc;
      color: #0f172a;
    }
    body.theme-white .app-card {
      background-color: #1d4ed8;
      color: #ffffff;
      border: 1px solid #1e40af;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.25);
    }
    body.theme-white .app-header {
      background-color: rgba(248, 250, 252, 0.98);
      border-color: #cbd5e1;
      color: #0f172a;
    }
    body.theme-white .app-footer {
      background-color: rgba(248, 250, 252, 0.98);
      border-color: #cbd5e1;
    }
    body.theme-white .card-title { color: #ffffff; }
    body.theme-white .card-subtext { color: #bfdbfe; }
    body.theme-white .counter-box {
      background-color: #1e40af;
      border-color: #3b82f6;
    }
    body.theme-white .counter-number { color: #ffffff; }
  </style>
</head>
<body id="appBody" class="theme-blue min-h-screen flex flex-col font-sans antialiased overflow-x-hidden pb-28">

  <!-- TOP HEADER -->
  <header id="appHeader" class="app-header sticky top-0 z-40 backdrop-blur-md border-b px-3.5 pt-2 pb-2.5 shadow-lg">
    <div class="max-w-lg mx-auto flex flex-col gap-2">

      <div class="flex items-center justify-between gap-2">
        <button onclick="openCourseModal()" class="flex items-center gap-2 text-left truncate flex-1">
          <div class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center shrink-0 shadow-md">
            <i class="fa-solid fa-location-dot text-sm"></i>
          </div>
          <div class="truncate">
            <div class="flex items-center gap-1.5">
              <span id="headerCourseName" class="font-black text-sm tracking-tight truncate">The Art Nine @ SMP</span>
              <span id="headerHoleCountBadge" class="text-[10px] bg-white text-blue-900 px-1.5 py-0.2 rounded font-black shadow-sm shrink-0">9H</span>
            </div>
            <div class="text-[11px] opacity-75 font-semibold">Tap to switch course</div>
          </div>
        </button>

        <div class="flex items-center gap-1.5 shrink-0">
          <!-- Roster Manager -->
          <button onclick="openRosterModal()" title="Manage Players" class="w-8 h-8 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/20 flex items-center justify-center active:scale-90 shadow-sm">
            <i class="fa-solid fa-user-group text-xs"></i>
          </button>

          <!-- History Modal Button -->
          <button onclick="openHistoryModal()" id="btnOpenHistory" title="View Saved Rounds" class="px-2.5 py-1.5 rounded-xl bg-amber-400 text-slate-950 font-black text-xs flex items-center gap-1.5 active:scale-95 shadow-md border border-amber-300">
            <i class="fa-solid fa-clock-rotate-left text-xs"></i>
            <span>Rounds</span>
            <span id="historyCountBadge" class="px-1.5 py-0.2 rounded-full bg-slate-950 text-amber-300 text-[10px] font-black">3</span>
          </button>

          <!-- Palette Toggle -->
          <button onclick="toggleTheme()" id="btnPalette" title="Switch Theme" class="w-8 h-8 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/20 flex items-center justify-center active:scale-90 shadow-sm">
            <i class="fa-solid fa-palette text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Stopwatch & Match Ticker -->
      <div class="flex items-center justify-between gap-2 pt-1 border-t border-white/15">
        
        <!-- Timer Box with Start/Pause + Independent Reset Button -->
        <div class="flex items-center gap-1.5 bg-slate-950/40 border border-white/20 px-2 py-1 rounded-xl shadow-inner">
          <div class="flex items-center gap-1">
            <span class="inline-block w-2 h-2 rounded-full bg-slate-400" id="timerPulseDot"></span>
            <span id="timerDisplay" class="text-xs font-mono font-black tracking-wider text-white">00:00:00</span>
          </div>
          <button onclick="toggleTimer()" id="btnTimerControl" class="px-2 py-0.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-white text-[11px] font-black flex items-center gap-1 active:scale-95 shadow">
            <i id="btnTimerIcon" class="fa-solid fa-play text-[9px]"></i>
            <span id="btnTimerLabel">Start</span>
          </button>
          <!-- Dedicated Reset Button -->
          <button onclick="confirmResetTimerOnly()" title="Reset Timer to 00:00:00" class="w-6 h-6 rounded-lg bg-white/10 hover:bg-white/25 text-slate-200 flex items-center justify-center active:scale-90">
            <i class="fa-solid fa-rotate-right text-[10px]"></i>
          </button>
        </div>

        <!-- Leaderboard Summary Ticker -->
        <div id="tickerSummaryContainer" class="flex items-center gap-2 font-bold text-xs shrink-0 overflow-x-auto max-w-[50%]"></div>
      </div>

    </div>
  </header>

  <!-- MAIN SCORING CARD -->
  <main class="flex-1 px-3.5 py-3 max-w-lg mx-auto w-full flex flex-col gap-3">
    <!-- Hole Navigator Bar -->
    <div class="app-card rounded-2xl p-2.5 flex items-center justify-between shadow-md">
      <button onclick="prevHole()" id="btnPrevHoleTop" class="w-10 h-10 rounded-xl bg-blue-900 text-white active:scale-90 flex items-center justify-center font-bold text-base disabled:opacity-30 disabled:pointer-events-none transition shadow">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <div class="text-center">
        <div class="text-[10px] uppercase tracking-wider font-extrabold text-blue-600">HOLE</div>
        <div class="flex items-baseline justify-center gap-1">
          <span id="currentHoleLabel" class="text-2xl font-black card-title">1</span>
          <span id="totalHolesMaxLabel" class="text-xs card-subtext font-semibold">/ 9</span>
        </div>
      </div>

      <button onclick="nextHole()" id="btnNextHoleTop" class="w-10 h-10 rounded-xl bg-blue-600 text-white active:scale-90 flex items-center justify-center font-bold text-base transition shadow">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- Par & Distance Info -->
    <div class="grid grid-cols-2 gap-2.5">
      <div class="app-card rounded-xl p-2.5 flex items-center justify-between shadow-sm">
        <div>
          <span class="text-[10px] font-bold uppercase card-subtext block tracking-wide">PAR</span>
          <span id="parDisplay" class="text-xl font-black card-title leading-tight">3</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="adjustPar(-1)" class="w-8 h-8 rounded-lg bg-blue-900 text-white font-bold active:scale-90 text-sm flex items-center justify-center">-</button>
          <button onclick="adjustPar(1)" class="w-8 h-8 rounded-lg bg-blue-900 text-white font-bold active:scale-90 text-sm flex items-center justify-center">+</button>
        </div>
      </div>

      <div class="app-card rounded-xl p-2.5 flex items-center justify-between shadow-sm">
        <div>
          <span class="text-[10px] font-bold uppercase card-subtext block tracking-wide">DISTANCE</span>
          <div class="flex items-baseline gap-1">
            <span id="distanceDisplay" class="text-xl font-black card-title leading-tight">132</span>
            <span class="text-[10px] card-subtext font-semibold">ft</span>
          </div>
        </div>
        <button onclick="editDistance()" class="w-8 h-8 rounded-lg bg-blue-600 text-white active:scale-90 flex items-center justify-center shadow">
          <i class="fa-solid fa-pen-to-square text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Dynamic Player Cards -->
    <div id="playerFairwayCards" class="flex flex-col gap-3"></div>
  </main>

  <!-- BOTTOM DOCK -->
  <footer id="appFooter" class="app-footer fixed bottom-0 left-0 right-0 z-40 backdrop-blur-md border-t px-4 py-2.5 pb-[max(0.6rem,env(safe-area-inset-bottom))] shadow-2xl">
    <div class="max-w-lg mx-auto flex items-center gap-2">
      <button onclick="prevHole()" id="btnBottomPrev" class="flex-1 py-3 px-3 rounded-xl bg-blue-900 text-white font-bold text-sm active:scale-95 border border-blue-700 flex items-center justify-center gap-2 disabled:opacity-30">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        <span>Prev</span>
      </button>

      <button onclick="openCurrentScorecardModal()" class="w-12 h-12 rounded-xl bg-white text-blue-900 border border-blue-200 flex flex-col items-center justify-center active:scale-95 shrink-0 shadow">
        <i class="fa-solid fa-table-cells text-base"></i>
        <span class="text-[9px] font-black uppercase mt-0.5">Card</span>
      </button>

      <button onclick="nextHole()" id="btnBottomNext" class="flex-1 py-3 px-3 rounded-xl bg-blue-600 text-white font-black text-sm active:scale-95 border border-blue-400 flex items-center justify-center gap-2 shadow-md">
        <span id="nextHoleText">Next</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </div>
  </footer>

  <!-- FULL SCORECARD MODAL -->
  <div id="modalScorecard" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex-col justify-end">
    <div class="bg-white text-slate-900 border-t border-slate-200 rounded-t-3xl max-w-lg mx-auto w-full max-h-[94vh] flex flex-col overflow-hidden">
      
      <div class="px-5 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div>
          <h3 class="font-black text-lg text-slate-900" id="modalCardTitle">Scorecard</h3>
          <p class="text-xs text-slate-500 font-semibold" id="modalCardSubtitle">Match Overview</p>
        </div>
        <button onclick="closeScorecardModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center font-bold">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="overflow-y-auto p-4 flex-1 custom-scroll space-y-4">
        <!-- SCORECARD TRADING CARD CONTAINER -->
        <div id="scorecardCardElement" class="p-3 bg-white rounded-2xl border-2 border-blue-200 shadow-sm">
          <div class="flex items-center justify-between border-b border-slate-200 pb-2 mb-2">
            <div>
              <div class="font-black text-slate-900 text-sm" id="captureCardTitle">The Art Nine @ SMP</div>
              <div class="text-[11px] text-slate-500 font-bold" id="captureCardMeta">Today · ⏱ 00:00:00</div>
            </div>
            <div class="px-2 py-1 rounded-lg bg-blue-100 text-blue-900 text-xs font-black" id="captureCardWinner">
              Match In Progress
            </div>
          </div>

          <div class="overflow-x-auto rounded-xl border border-blue-900 shadow-sm">
            <table class="w-full text-center text-xs">
              <thead class="bg-blue-900 text-white font-bold uppercase text-[10px]" id="scorecardTableHead"></thead>
              <tbody id="scorecardTableBody" class="divide-y divide-slate-100 font-semibold text-slate-800"></tbody>
              <tfoot class="bg-blue-950 font-black text-white divide-y divide-blue-900" id="scorecardTableFoot"></tfoot>
            </table>
          </div>
        </div>

        <div id="modalScorecardActions" class="flex flex-col gap-2 pt-1"></div>
      </div>
    </div>
  </div>

  <!-- PLAYER ROSTER MANAGEMENT MODAL -->
  <div id="modalRoster" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white text-slate-900 border border-slate-200 rounded-3xl max-w-sm w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto custom-scroll shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <h3 class="font-black text-slate-900 text-base">Match Players</h3>
        <button onclick="closeRosterModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="space-y-2" id="rosterList"></div>

      <div class="pt-2 border-t border-slate-200">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Add New Player</label>
        <div class="flex gap-2">
          <input type="text" id="inputNewPlayerName" placeholder="Player name (e.g. Zack)" class="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-900 font-bold text-xs focus:outline-none">
          <button onclick="addNewPlayer()" class="px-3 py-2 rounded-xl bg-blue-600 text-white font-black text-xs active:scale-95 shadow">Add</button>
        </div>
      </div>

      <div class="pt-1">
        <button onclick="closeRosterModal()" class="w-full py-2.5 rounded-xl bg-slate-100 text-slate-800 font-black text-xs active:scale-95 border border-slate-300">Done</button>
      </div>
    </div>
  </div>

  <!-- COURSE CATALOG MODAL -->
  <div id="modalCourse" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white text-slate-900 border border-slate-200 rounded-3xl max-w-sm w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto custom-scroll shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <h3 class="font-black text-slate-900 text-base">Select Course</h3>
        <button onclick="closeCourseModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Preset Courses</label>
        <select id="selectPresetCourse" onchange="loadSelectedPresetCourse(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-slate-900 font-bold text-xs focus:outline-none focus:border-blue-500">
          <option value="smp_art9">The Art Nine @ SMP (9H · Par 27)</option>
          <option value="sarko">Sar-Ko-Par Trails (9H · Par 27)</option>
          <option value="jacks_backyard">Jack's Backyard Course (9H · Par 27)</option>
          <option value="mize">Mize Elementary (9H · Par 27)</option>
          <option value="lakeside">Lakeside Hills (19H · Par 57)</option>
          <option value="blackhoof_18">Black Hoof Championship (18H · Par 58)</option>
          <option value="blackhoof_9">Black Hoof Flying Disc (9H · Par 27)</option>
          <option value="smp_wooded">Shawnee Mission Wooded (18H · Par 54)</option>
          <option value="california_trail">California Trail MS (9H · Par 29)</option>
          <option value="prairie_center">Prairie Center Park (18H · Par 55)</option>
          <option value="wolf_den">Wolf Den @ Mission Trail (18H · Par 54)</option>
          <option value="harmon">Harmon & Santa Fe Parks (9H · Par 27)</option>
          <option value="indian_woods">Indian Woods MS (9H · Par 27)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Custom Name</label>
        <input type="text" id="inputCourseName" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-900 font-bold text-xs focus:outline-none" value="The Art Nine @ SMP">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Date</label>
        <input type="date" id="inputRoundDate" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-2 text-slate-900 text-xs font-bold focus:outline-none">
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="resetCurrentRound()" class="flex-1 py-2.5 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold active:scale-95">Reset Scores</button>
        <button onclick="saveCourseSettings()" class="flex-1 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-extrabold active:scale-95 shadow">Apply</button>
      </div>
    </div>
  </div>

  <!-- SAVED HISTORY MODAL -->
  <div id="modalHistory" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex-col justify-end">
    <div class="bg-white text-slate-900 border-t border-slate-200 rounded-t-3xl max-w-lg mx-auto w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="px-5 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div>
          <h3 class="font-black text-lg text-slate-900">Saved Rounds</h3>
          <p class="text-[11px] text-slate-500 font-medium">Tap any round to view full card or save as image</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="clearAllHistory()" title="Clear all rounds" class="px-2 py-1 rounded-lg bg-rose-100 text-rose-700 hover:bg-rose-200 text-xs font-bold flex items-center gap-1 active:scale-95">
            <i class="fa-solid fa-trash-can text-[10px]"></i>
            <span>Clear All</span>
          </button>
          <button onclick="closeHistoryModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
      <div id="historyList" class="p-4 overflow-y-auto space-y-3 custom-scroll flex-1"></div>
    </div>
  </div>

    function loadPresetData(key) {
      const course = COURSE_DATABASE[key] || COURSE_DATABASE.smp_art9;
      roundState.courseKey = key;
      roundState.courseName = course.name;
      roundState.totalHoles = course.totalHoles;
      roundState.currentHoleIndex = 0;
      roundState.holes = course.holes.map(h => {
        const scores = {};
        roster.forEach(p => scores[p.id] = 0);
        return {
          number: h.number,
          par: h.par,
          distance: h.dist,
          scores: scores
        };
      });
      saveState();
      renderHeader();
      renderCurrentHole();
    }

    function addNewPlayer() {
      const input = document.getElementById('inputNewPlayerName');
      const name = input.value.trim();
      if (!name) return;

      const id = name.toLowerCase().replace(/[^a-z0-9]/g, '') + '_' + Date.now().toString().slice(-4);
      const tag = name.slice(0, 2).toUpperCase();

      roster.push({ id, name, tag, color: 'blue-700' });
      localStorage.setItem(ROSTER_KEY, JSON.stringify(roster));

      roundState.holes.forEach(h => {
        if (!h.scores) h.scores = {};
        if (h.scores[id] === undefined) h.scores[id] = 0;
      });
      saveState();

      input.value = '';
      renderRosterList();
      renderCurrentHole();
    }

    function removePlayer(id) {
      if (roster.length <= 1) {
        alert("At least one player is required.");
        return;
      }
      if (confirm("Remove this player from the active round?")) {
        roster = roster.filter(p => p.id !== id);
        localStorage.setItem(ROSTER_KEY, JSON.stringify(roster));
        renderRosterList();
        renderCurrentHole();
      }
    }

            playedPar += hole.par;
          }

        const diff = (playedPar > 0) ? (playedScore - playedPar) : 0;

    function getBadgeHtml(score, par) {
      if (score === 0) return `<span class="px-2.5 py-0.5 rounded-full text-xs font-black bg-slate-200 text-slate-700">-</span>`;
      const diff = score - par;
      if (score === 1) return `<span class="px-2.5 py-0.5 rounded-full text-xs font-black bg-amber-500 text-white shadow">ACE 🎯</span>`;
      if (diff <= -2) return `<span class="px-2.5 py-0.5 rounded-full text-xs font-black bg-emerald-600 text-white shadow">Eagle</span>`;
      if (diff === -1) return `<span class="px-2.5 py-0.5 rounded-full text-xs font-black bg-emerald-500 text-white shadow">Birdie</span>`;
      if (diff === 0) return `<span class="px-2.5 py-0.5 rounded-full text-xs font-black bg-blue-700 text-white shadow">Par</span>`;
      if (diff === 1) return `<span class="px-2.5 py-0.5 rounded-full text-xs font-black bg-orange-600 text-white shadow">Bogey</span>`;
      return `<span class="px-2.5 py-0.5 rounded-full text-xs font-black bg-rose-600 text-white shadow">+${diff} Bogey</span>`;
    }

    function renderHeaderSummaryTicker() {
      const ticker = document.getElementById('tickerSummaryContainer');
      ticker.innerHTML = '';
      roster.forEach(p => {
        let tot = 0, playedPar = 0;
        roundState.holes.forEach(h => {
          const s = (h.scores && h.scores[p.id]) ? h.scores[p.id] : 0;
          if (s > 0) {
            tot += s;
            playedPar += h.par;
          }
        });
        const diff = (playedPar > 0) ? (tot - playedPar) : 0;
        const fmtDiff = diff === 0 ? 'E' : (diff > 0 ? `+${diff}` : `${diff}`);

        const span = document.createElement('span');
        span.className = "flex items-center gap-1 shrink-0";
        span.innerHTML = `<span class="opacity-75 font-normal text-[11px]">${p.name.slice(0, 1)}:</span><span class="bg-white text-blue-900 px-1.5 py-0.5 rounded text-[11px] font-black shadow-sm">${tot} (${fmtDiff})</span>`;
        ticker.appendChild(span);
      });
    }

    function adjustPlayerScore(playerId, delta) {
      const h = roundState.holes[roundState.currentHoleIndex];
      if (!h.scores) h.scores = {};
      h.scores[playerId] = Math.max(0, (h.scores[playerId] || 0) + delta);
      saveState();
      renderCurrentHole();
    }

    function setPlayerScorePreset(playerId, type) {
      const h = roundState.holes[roundState.currentHoleIndex];
      if (!h.scores) h.scores = {};
      if (type === 1) h.scores[playerId] = 1;
      else if (type === 'birdie') h.scores[playerId] = Math.max(1, h.par - 1);
      else if (type === 'par') h.scores[playerId] = h.par;
      else if (type === 'bogey') h.scores[playerId] = h.par + 1;
      saveState();
      renderCurrentHole();
    }

    function adjustPar(delta) {
      const h = roundState.holes[roundState.currentHoleIndex];
      h.par = Math.max(2, Math.min(6, h.par + delta));
      saveState();
      renderCurrentHole();
    }

    function editDistance() {
      const h = roundState.holes[roundState.currentHoleIndex];
      const input = prompt("Hole distance (ft):", h.distance);
      if (input !== null && !isNaN(parseInt(input))) {
        h.distance = parseInt(input);
        saveState();
        renderCurrentHole();
      }
    }

    function prevHole() {
      if (roundState.currentHoleIndex > 0) {
        roundState.currentHoleIndex--;
        saveState();
        renderCurrentHole();
      }
    }

    function nextHole() {
      if (roundState.currentHoleIndex < roundState.totalHoles - 1) {
        roundState.currentHoleIndex++;
        saveState();
        renderCurrentHole();
      } else {
        openCurrentScorecardModal();
      }

      roundState.courseName = document.getElementById('inputCourseName').value || 'Course';

      saveState();

      if (confirm("Reset current scores and stopwatch timer?")) {
        roundState.currentHoleIndex = 0;

          if (!h.scores) h.scores = {};

        closeCourseModal();

      document.getElementById('modalCardSubtitle').innerText = `${roundState.courseName} · ${roundState.totalHoles} Holes · Time: ${elapsed}`;

      document.getElementById('modalScorecardActions').innerHTML = `
        <button onclick="downloadScorecardCardImage()" class="py-3 px-4 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs flex items-center justify-center gap-2 border border-amber-300 shadow active:scale-95">
          <i class="fa-solid fa-camera text-base"></i>
          <span>Save as Card Image (PNG)</span>
        </button>
        <button onclick="finishAndSaveRound()" class="py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black text-xs flex items-center justify-center gap-2 border border-blue-400 shadow active:scale-95">
          <i class="fa-solid fa-floppy-disk text-base"></i>
          <span>Save to Rounds</span>
        </button>
      `;

      document.getElementById('modalScorecard').classList.remove('hidden');
      document.getElementById('modalScorecard').classList.add('flex');
    }

    function viewSavedRoundDetails(id) {
      const history = getHistory();
      const record = history.find(r => r.id === id);
      if (!record) return;

      closeHistoryModal();

      let activePlayers = record.players;
      if (!activePlayers && record.holes) {
        activePlayers = [
          { id: 'jeffery', name: 'Jeffery', tag: 'J1' },
          { id: 'jack', name: 'Jack', tag: 'J2' }
        ];
      }

      renderScorecardTableDynamic(activePlayers, record.holes, -1);

      document.getElementById('captureCardTitle').innerText = record.courseName;
      document.getElementById('captureCardMeta').innerText = `${record.date} · ⏱ ${record.duration || 'N/A'}`;
      document.getElementById('captureCardWinner').innerText = record.winner ? `${record.winner} Won` : 'Completed';

      document.getElementById('modalCardTitle').innerText = "Saved Round Review";
      document.getElementById('modalCardSubtitle').innerText = `${record.courseName} · ${record.date} · ⏱ ${record.duration || 'N/A'}`;

      document.getElementById('modalScorecardActions').innerHTML = `
        <button onclick="downloadScorecardCardImage()" class="py-3 px-4 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs flex items-center justify-center gap-2 border border-amber-300 shadow active:scale-95">
          <i class="fa-solid fa-camera text-base"></i>
          <span>Save as Card Image (PNG)</span>
        </button>
        <button onclick="closeScorecardModal(); openHistoryModal();" class="py-2.5 px-3 rounded-xl bg-slate-800 text-white font-bold text-xs flex items-center justify-center gap-1.5 border border-slate-700 active:scale-95">
          <i class="fa-solid fa-arrow-left text-xs"></i>
          <span>Back to Rounds</span>
        </button>
      `;

      document.getElementById('modalScorecard').classList.remove('hidden');
      document.getElementById('modalScorecard').classList.add('flex');
    }

    function closeScorecardModal() {
      document.getElementById('modalScorecard').classList.add('hidden');
      document.getElementById('modalScorecard').classList.remove('flex');
    }

    function renderScorecardTableDynamic(players, holes, activeIdx) {
      const thead = document.getElementById('scorecardTableHead');
      const tbody = document.getElementById('scorecardTableBody');
      const tfoot = document.getElementById('scorecardTableFoot');

      let thHtml = `<tr><th class="py-2.5 px-2 text-left pl-3">Hole</th><th class="py-2.5 px-1">Dist</th><th class="py-2.5 px-1">Par</th>`;
      players.forEach(p => {
        thHtml += `<th class="py-2.5 px-1.5 text-blue-200 truncate">${p.name}</th>`;
      });
      thHtml += `</tr>`;
      thead.innerHTML = thHtml;

      tbody.innerHTML = '';
      let totPar = 0;
      const playerTotals = {};
      players.forEach(p => playerTotals[p.id] = 0);

      holes.forEach((h, idx) => {
        totPar += h.par;
        const tr = document.createElement('tr');
        tr.className = (idx === activeIdx) ? 'bg-blue-100 font-black' : '';

        let rowHtml = `<td class="py-2 px-2 text-left pl-3 text-slate-800">#${h.number}</td><td class="py-2 px-1 text-slate-500">${h.distance}'</td><td class="py-2 px-1 text-slate-500">${h.par}</td>`;
        
        players.forEach(p => {
          let s = 0;
          if (h.scores && h.scores[p.id] !== undefined) s = h.scores[p.id];
          else if (h[p.id] !== undefined) s = h[p.id];
          
          playerTotals[p.id] += s;
          rowHtml += `<td class="py-2 px-1.5 font-black text-slate-800">${s > 0 ? s : '-'}</td>`;
        });

        rowHtml += `</tr>`;
        tr.innerHTML = rowHtml;
        tbody.appendChild(tr);
      });

      let tfHtml = `<tr class="text-sm bg-blue-950 font-black text-white"><td class="py-2.5 px-2 text-left pl-3">TOTAL</td><td></td><td class="py-2.5 px-1">${totPar}</td>`;
      players.forEach(p => {
        tfHtml += `<td class="py-2.5 px-1.5 text-blue-300 font-black">${playerTotals[p.id]}</td>`;
      });
      tfHtml += `</tr>`;
      tfoot.innerHTML = tfHtml;
    }

    function getLeaderString(players, holes) {
      let lowest = 9999;
      let leader = "In Progress";
      players.forEach(p => {
        let tot = 0;
        holes.forEach(h => {
          const s = (h.scores && h.scores[p.id]) ? h.scores[p.id] : (h[p.id] || 0);
          tot += s;
        });
        if (tot > 0 && tot < lowest) {
          lowest = tot;
          leader = `${p.name} Leading`;
        }
      });
      return leader;
    }

    // --- INSTANT PNG TRADING CARD EXPORT ---
    async function downloadScorecardCardImage() {
      const cardEl = document.getElementById('scorecardCardElement');
      if (!cardEl) return;

      try {
        const canvas = await html2canvas(cardEl, {
          scale: 3,
          backgroundColor: '#ffffff',
          useCORS: true
        });

        const courseName = (document.getElementById('captureCardTitle').innerText || 'Round').replace(/\s+/g, '_');
        const fileName = `DG_Card_${courseName}_${roundState.date}.png`;

        canvas.toBlob(async (blob) => {
          if (!blob) {
            alert("Failed to process image.");
            return;
          }

          const file = new File([blob], fileName, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: `${courseName} Scorecard`,
                text: `Disc Golf Round - ${roundState.date}`
              });
            } catch (shareErr) {
              if (shareErr.name !== 'AbortError') {
                fallbackImagePopup(canvas.toDataURL('image/png'));
              }
            }
          } else {
            fallbackImagePopup(canvas.toDataURL('image/png'));
          }
        }, 'image/png');
      } catch (err) {
        alert("Image export error: " + err.message);
      }
    }

    function fallbackImagePopup(dataUrl) {
      const w = window.open('');
      if (w) {
        w.document.write(`
          <body style="margin:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:white;padding:16px;text-align:center;">
            <p style="font-weight:bold;font-size:14px;margin-bottom:12px;">Press and hold the card below, then tap <strong>"Save to Photos"</strong></p>
            <img src="${dataUrl}" style="max-width:100%;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.5);"/>
          </body>
        `);
      } else {
        const link = document.createElement('a');
        link.download = `Scorecard_${roundState.date}.png`;
        link.href = dataUrl;
        link.click();
      }
    }

    function finishAndSaveRound() {
      let history = getHistory();
      let playedPar = 0;
      roundState.holes.forEach(h => {
        let scored = false;
        roster.forEach(p => { if (h.scores && h.scores[p.id] > 0) scored = true; });
        if (scored) playedPar += h.par;
      });

      const elapsed = document.getElementById('timerDisplay').innerText;
      const holeSnapshot = JSON.parse(JSON.stringify(roundState.holes));

      const playerSummaries = roster.map(p => {
        let tot = 0;
        roundState.holes.forEach(h => {
          tot += (h.scores && h.scores[p.id]) ? h.scores[p.id] : 0;
        });
        return { id: p.id, name: p.name, tag: p.tag, total: tot };
      });

      let winner = "Tie";
      let minScore = 9999;
      playerSummaries.forEach(ps => {
        if (ps.total > 0 && ps.total < minScore) {
          minScore = ps.total;
          winner = ps.name;
        }
      });

      const record = {
        id: Date.now(),
        courseName: roundState.courseName,
        totalHoles: roundState.totalHoles,
        date: roundState.date,
        duration: elapsed,
        par: playedPar,
        players: playerSummaries,
        winner: winner,
        holes: holeSnapshot
      };

      history.unshift(record);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      updateHistoryCountBadge();
      renderHistory();
      resetTimer();
      alert(`Round saved! Time: ${elapsed}`);
      closeScorecardModal();
    }

    function updateHistoryCountBadge() {
      const history = getHistory();
      const badge = document.getElementById('historyCountBadge');
      if (badge) badge.innerText = history.length;
    }

    function openHistoryModal() {
      renderHistory();
      document.getElementById('modalHistory').classList.remove('hidden');
      document.getElementById('modalHistory').classList.add('flex');
    }

    function closeHistoryModal() {
      document.getElementById('modalHistory').classList.add('hidden');
      document.getElementById('modalHistory').classList.remove('flex');
    }

    function deleteRound(id, event) {
      if (event) event.stopPropagation();
      if (confirm("Delete this saved round?")) {
        let history = getHistory().filter(r => r.id !== id);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        updateHistoryCountBadge();
        renderHistory();
      }
    }

    function clearAllHistory() {
      if (confirm("Are you sure you want to delete ALL saved rounds? This cannot be undone.")) {
        localStorage.setItem(HISTORY_KEY, JSON.stringify([]));
        updateHistoryCountBadge();
        renderHistory();
      }
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      if (!container) return;
      container.innerHTML = '';
      
      const history = getHistory();

      if (history.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">No saved rounds yet.</div>`;
        return;
      }

      history.forEach(r => {
        let playerSummaryStr = '';
        if (r.players && Array.isArray(r.players)) {
          playerSummaryStr = r.players.map(p => `${p.name}: <span class="text-blue-700 font-black">${p.total}</span>`).join(' | ');
        } else {
          playerSummaryStr = `Jeffery: <span class="text-blue-700 font-black">${r.jeffery}</span> | Jack: <span class="text-blue-900 font-black">${r.jack}</span>`;
        }

        const item = document.createElement('div');
        item.className = "bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center justify-between shadow-sm active:bg-blue-50 cursor-pointer transition";
        item.onclick = () => viewSavedRoundDetails(r.id);
        item.innerHTML = `
          <div class="truncate mr-2">
            <div class="flex items-center gap-1.5">
              <h4 class="font-black text-slate-900 text-sm truncate">${r.courseName}</h4>
              <span class="text-[10px] text-blue-600 bg-blue-100 px-1 rounded font-bold">${r.totalHoles}H</span>
            </div>
            <span class="text-[11px] text-slate-500 font-semibold">${r.date} · ⏱ ${r.duration || 'N/A'} · Par ${r.par}</span>
            <div class="text-xs mt-1 font-bold text-slate-700 truncate">
              ${playerSummaryStr}
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="px-2.5 py-1 rounded-lg text-xs font-black bg-blue-100 text-blue-800 border border-blue-200">
              ${r.winner ? (r.winner === 'Tie' ? 'TIE' : r.winner + ' Won') : 'Saved'}
            </span>
            <button onclick="deleteRound(${r.id}, event)" title="Delete Round" class="w-8 h-8 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 flex items-center justify-center active:scale-90">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // --- STOPWATCH LOGIC ---
    function initTimerUI() {
      if (timerState.running) {
        startTimerInterval();
        updateTimerButton(true);
      } else {
        updateTimerButton(false);
        renderTimerDisplay();
      }
    }

    function toggleTimer() {
      if (timerState.running) {
        timerState.accumulatedMs += Date.now() - timerState.startTime;
        timerState.running = false;
        timerState.startTime = null;
        clearInterval(timerInterval);
        updateTimerButton(false);
      } else {
        timerState.startTime = Date.now();
        timerState.running = true;
        startTimerInterval();
        updateTimerButton(true);
      }
      saveTimerState();
    }

    function confirmResetTimerOnly() {
      if (confirm("Reset stopwatch timer to 00:00:00?")) {
        resetTimer();
      }
    }

    function startTimerInterval() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        renderTimerDisplay();
      }, 500);
    }

    function getElapsedMs() {
      if (!timerState.running) return timerState.accumulatedMs;
      return timerState.accumulatedMs + (Date.now() - timerState.startTime);
    }

    function renderTimerDisplay() {
      const ms = getElapsedMs();
      const totalSec = Math.floor(ms / 1000);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;

      const pad = n => String(n).padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;

      const dot = document.getElementById('timerPulseDot');
      if (timerState.running) {
        dot.className = "inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse shadow";
      } else {
        dot.className = "inline-block w-2 h-2 rounded-full bg-slate-400";
      }
    }

    function updateTimerButton(isRunning) {
      const btn = document.getElementById('btnTimerControl');
      const icon = document.getElementById('btnTimerIcon');
      const label = document.getElementById('btnTimerLabel');

      if (isRunning) {
        btn.className = "px-2 py-0.5 rounded-lg bg-amber-400 hover:bg-amber-300 text-slate-950 text-[11px] font-black flex items-center gap-1 active:scale-95 shadow transition";
        icon.className = "fa-solid fa-pause text-[9px]";
        label.innerText = "Pause";
      } else {
        btn.className = "px-2 py-0.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-white text-[11px] font-black flex items-center gap-1 active:scale-95 shadow transition";
        icon.className = "fa-solid fa-play text-[9px]";
        label.innerText = "Start";
      }
      renderTimerDisplay();
    }

    function saveTimerState() {
      localStorage.setItem(TIMER_KEY, JSON.stringify(timerState));
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerState = { running: false, startTime: null, accumulatedMs: 0 };
      saveTimerState();
      updateTimerButton(false);
      renderTimerDisplay();
    }

    function toggleTheme() {
      const current = document.body.classList.contains('theme-blue') ? 'theme-blue' : 'theme-white';
      const nextTheme = current === 'theme-blue' ? 'theme-white' : 'theme-blue';
      applyTheme(nextTheme);
      localStorage.setItem(THEME_KEY, nextTheme);
    }

    function applyTheme(themeName) {
      document.body.classList.remove('theme-blue', 'theme-white');
      document.body.classList.add(themeName);
    }

    window.onload = init;
  </script>
</body>
</html>
