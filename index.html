    /* iOS Safari Fixed-Nav Immunity: Dedicated Scroll Container */
    .app-shell {
      height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .app-scroll-main {
      flex: 1 1 0%;
      overflow-y: auto;
      overflow-x: hidden;

    .font-display { font-family: var(--font-display); letter-spacing: -0.01em; }
    .font-mono-tabular { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }

    /* 3D FLIPPABLE TRADING CARD ENGINE */
    .card-3d-scene {
      perspective: 1200px;
      -webkit-perspective: 1200px;
    }
    .card-3d-inner {
      position: relative;
      width: 100%;
      aspect-ratio: 2.5 / 3.5;
      transition: transform 0.65s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      cursor: pointer;
    }
    .card-3d-inner.is-flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }
    .card-3d-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1rem;
      overflow: hidden;
    }
    .card-3d-front {
      transform: rotateY(0deg);
      -webkit-transform: rotateY(0deg);
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);

    .card-3d-back {
      transform: rotateY(180deg);

    function formatRelativePar(diff) {
      if (diff === 0) return 'E';
      return diff > 0 ? `+${diff}` : `${diff}`;
    }

    function formatRoundScoresForClipboard(round) {
      const totalDist = (round.holes || []).reduce((s, h) => s + (h.distance || 0), 0);
      const playerLine = (round.players || [])
        .map((p) => `${p.name}: ${p.total} (${formatRelativePar(p.total - round.par)})`)
        .join(' | ');
      const holeLines = (round.holes || [])
        .map((h) => {
          const pScores = (round.players || [])
            .map((p) => `${p.name} ${(h.scores && h.scores[p.id]) || '-'}`)
            .join(', ');
          return `H${h.number} (${h.distance}ft, Par ${h.par}): ${pScores}`;
        })
        .join('\n');
      return `🥏 DISC GOLF ROUND SCORECARD — ${round.courseName}\nDate: ${round.date} | Duration: ${round.duration} | ${round.totalHoles} Holes (Par ${round.par}, ${totalDist.toLocaleString()} ft)\nFinal Totals: ${playerLine}\n\n${holeLines}`;
    }

    function getScoreTerm(score, par) {
      if (!score || score <= 0) return { label: 'Unscored', shortLabel: '—', textColor: 'text-slate-400', bgColor: 'sub-control', borderColor: 'border-slate-700' };
      if (score === 1) return { label: 'Ace', shortLabel: 'ACE', textColor: 'accent-gold text-[#FACC15]', bgColor: 'bg-[#FACC15]/15', borderColor: 'border-[#FACC15]' };
      const diff = score - par;
      if (diff <= -2) return { label: 'Eagle', shortLabel: 'EAG', textColor: 'accent-lime text-[#39FF14]', bgColor: 'bg-[#39FF14]/20', borderColor: 'border-[#39FF14]' };
      if (diff === -1) return { label: 'Birdie', shortLabel: 'BIR', textColor: 'accent-lime text-[#39FF14]', bgColor: 'bg-[#39FF14]/15', borderColor: 'border-[#39FF14]/80' };
      if (diff === 0) return { label: 'Par', shortLabel: 'PAR', textColor: 'accent-cyan text-[#00F0FF]', bgColor: 'bg-[#00F0FF]/10', borderColor: 'border-[#00F0FF]/60' };
      if (diff === 1) return { label: 'Bogey', shortLabel: 'BOG', textColor: 'text-[#FF9E00]', bgColor: 'bg-[#FF9E00]/15', borderColor: 'border-[#FF9E00]/70' };
      if (diff === 2) return { label: 'Double Bogey', shortLabel: 'DBL', textColor: 'accent-pink text-[#FF2E93]', bgColor: 'bg-[#FF2E93]/15', borderColor: 'border-[#FF2E93]/80' };
      return { label: `+${diff}`, shortLabel: `+${diff}`, textColor: 'accent-pink text-[#FF2E93]', bgColor: 'bg-[#FF2E93]/25', borderColor: 'border-[#FF2E93]' };
    }

    const DISC_PHONETIC_ALIASES = {
      'innova-aviar': ['aviar', 'avr', '80r', 'evr', 'abr'],
      'innova-sync': ['sync', 'sink'],
      'innova-pig': ['pig', 'bigot'],

      'innova-mako3': ['mako', 'make go', 'make coat', 'makeo', 'nico', 'neco', 'make 03'],
      'innova-roc3': ['roc3', 'roc'],
      'innova-it': ['halo it', 'the it', 'star it'],
      'innova-firebird': ['firebird', 'firewood'],
      'innova-mamba': ['mamba', 'mama', 'mumba', 'bamba', 'tombstone', 'tomahawk'],
      'discraft-roach': ['roach'],
      'discraft-buzzz-ss': ['buzzz', 'very purple'],
      'discraft-cicada': ['cicada', 'tree-high']
    };

    function scanTranscriptMentionsForDisc(disc, history) {
      let mentions = 0;
      const aliases = DISC_PHONETIC_ALIASES[disc.id] || [disc.name.toLowerCase()];
      const matchesAny = (text) => {
        if (!text) return false;
        const lower = text.toLowerCase();
        return aliases.some((alias) => lower.includes(alias));
      };
      for (const r of history) {
        if (matchesAny(r.roundTranscript)) mentions++;
        for (const h of r.holes || []) {
          if (matchesAny(h.voiceTranscript)) mentions++;
        }
      }
      return mentions;
    }

    function recommendJackDisc(distanceFeet, bag) {
      const jackDiscs = bag.filter((d) => d.ownerId === 'jack');
      const byId = (id) => jackDiscs.find((d) => d.id === id) || null;
      if (distanceFeet < 175) return byId('discraft-roach') || jackDiscs[0] || null;
      if (distanceFeet <= 240) return byId('discraft-buzzz-ss') || jackDiscs[0] || null;
      return byId('discraft-cicada') || jackDiscs[0] || null;
    }

    function getHoleCaddyInsights(courseName, holeNumber, history, playerIds) {
      const courseRounds = history.filter((r) => r.courseName.toLowerCase() === courseName.toLowerCase());
      const playerStats = {};
      for (const pid of playerIds) {
        const scores = [];
        for (const r of courseRounds) {
          const h = (r.holes || []).find((hole) => hole.number === holeNumber);
          if (h && h.scores && h.scores[pid] && h.scores[pid] > 0) scores.push({ score: h.scores[pid], par: h.par });
        }
        if (scores.length === 0) {
          playerStats[pid] = { avgScore: 0, bestScore: null, worstScore: null, lastScore: null };
        } else {
          const sum = scores.reduce((acc, s) => acc + s.score, 0);
          playerStats[pid] = {
            avgScore: Number((sum / scores.length).toFixed(1)),
            bestScore: Math.min(...scores.map((s) => s.score)),
            worstScore: Math.max(...scores.map((s) => s.score)),
            lastScore: scores[0]?.score || null
          };
        }
      }
      return { holeNumber, roundsPlayed: courseRounds.length, playerStats };
    }

    function getCoursePersonalBest(courseName, playerId, history) {
      const matching = history.filter(
        (r) => r.courseName.toLowerCase() === courseName.toLowerCase() && r.players.some((p) => p.id === playerId && p.total > 0)
      );
      if (matching.length === 0) return { bestTotal: null, bestRelPar: null, avgTotal: null, roundsCount: 0, strokeDrop: null, firstScore: null, latestScore: null };
      let bestTotal = Infinity, bestRelPar = Infinity, sumTotal = 0;
      for (const r of matching) {
        const p = r.players.find((pl) => pl.id === playerId);
        sumTotal += p.total;
        if (p.total < bestTotal) { bestTotal = p.total; bestRelPar = p.total - r.par; }
      }
      const firstScore = matching[matching.length - 1].players.find((pl) => pl.id === playerId)?.total ?? null;
      const latestScore = matching[0].players.find((pl) => pl.id === playerId)?.total ?? null;
      const strokeDrop = matching.length >= 2 && firstScore !== null && latestScore !== null ? latestScore - firstScore : null;
      return {
        bestTotal, bestRelPar, avgTotal: Number((sumTotal / matching.length).toFixed(1)),
        roundsCount: matching.length, strokeDrop, firstScore, latestScore
      };
    }

    function computePlayerCareerProfile(playerId, history) {
      let roundsPlayed = 0, holesPlayed = 0, totalStrokes = 0, totalPar = 0, aces = 0, birdies = 0, pars = 0, bogeys = 0, doubleOrWorse = 0;
      let bestRoundRelPar = null;
      const brackets = [
        { label: 'Putters & Touch (< 185 ft)', min: 0, max: 184, count: 0, diffSum: 0 },
        { label: 'Mid-Range Slot (185–239 ft)', min: 185, max: 239, count: 0, diffSum: 0 },
        { label: 'Fairway Driver (240–299 ft)', min: 240, max: 299, count: 0, diffSum: 0 },
        { label: 'Distance Driver (300+ ft)', min: 300, max: 9999, count: 0, diffSum: 0 }
      ];

      for (const round of history) {
        const pSummary = round.players.find((p) => p.id === playerId);
        if (!pSummary) continue;
        roundsPlayed++;
        const roundDiff = pSummary.total - round.par;
        if (!bestRoundRelPar || roundDiff < bestRoundRelPar.diff) {
          bestRoundRelPar = { diff: roundDiff, courseName: round.courseName, date: round.date, score: pSummary.total, par: round.par };
        }
        for (const h of round.holes || []) {
          const s = h.scores ? h.scores[playerId] : 0;
          if (!s || s <= 0) continue;
          holesPlayed++; totalStrokes += s; totalPar += h.par;
          if (s === 1) aces++;
          const d = s - h.par;
          if (d <= -1) birdies++; else if (d === 0) pars++; else if (d === 1) bogeys++; else doubleOrWorse++;
          const b = brackets.find((br) => h.distance >= br.min && h.distance <= br.max);
          if (b) { b.count++; b.diffSum += d; }
        }
      }
      const overallRelPar = totalStrokes - totalPar;
      const avgRelParPer9 = holesPlayed > 0 ? Number(((overallRelPar / holesPlayed) * 9).toFixed(1)) : 0;
      const parOrBetterPct = holesPlayed > 0 ? Math.round(((birdies + pars) / holesPlayed) * 100) : 0;
      return {
        playerId, roundsPlayed, holesPlayed, totalStrokes, totalPar, overallRelPar,
        avgRelParPer9, parOrBetterPct, aces, birdies, pars, bogeys, doubleOrWorse, bestRoundRelPar,
        distanceBrackets: brackets.map((b) => ({
          label: b.label, holesCount: b.count, avgRelPar: b.count > 0 ? Number((b.diffSum / b.count).toFixed(2)) : 0
        }))
      };
    }

    function computeFlightPathSvg(disc, wind = 'calm', releaseAngle = 'flat') {
      const startX = 130, startY = 295;
      let windDistMod = wind === 'tailwind' ? 1.08 : wind === 'headwind' ? (disc.turn <= -3 ? 0.85 : 0.94) : 1.0;
      const estFeet = Math.round(disc.idealMaxFeet * windDistMod);
      const normDist = Math.min(0.92, Math.max(0.36, estFeet / 410));
      const endY = Math.round(startY - normDist * 255);

      let effTurn = disc.turn + (wind === 'headwind' ? -1.5 : wind === 'tailwind' ? 1.0 : 0) + (releaseAngle === 'hyzer' ? 1.5 : releaseAngle === 'anhyzer' ? -1.8 : 0);
      let effFade = Math.max(0, disc.fade + (wind === 'headwind' ? -0.8 : wind === 'tailwind' ? 0.6 : 0) + (releaseAngle === 'hyzer' ? 0.8 : releaseAngle === 'anhyzer' ? -1.0 : 0));

      const crossDrift = wind === 'cross_lr' ? 20 : wind === 'cross_rl' ? -20 : 0;
      const turnPullX = Math.min(235, Math.max(45, startX + (-effTurn) * 16 + crossDrift * 0.6));
      const netLateral = (-effTurn) * 10 - effFade * 15 + crossDrift;
      const endX = Math.min(235, Math.max(25, Math.round(startX + netLateral)));
      const cp1X = startX + (turnPullX - startX) * 0.45;
      const cp1Y = Math.round(startY - (startY - endY) * 0.35);
      const cp2X = turnPullX;
      const cp2Y = Math.round(startY - (startY - endY) * 0.78);
      return { pathD: `M ${startX} ${startY} C ${Math.round(cp1X)} ${cp1Y}, ${Math.round(cp2X)} ${cp2Y}, ${endX} ${endY}`, endX, endY, estimatedFeet: estFeet };
    }

                <p className="text-xs sm:text-sm text-slate-300 mt-1">Flip any card to see its updated 10/20 Sar-Ko-Par stats (Halo IT H4 Birdie, Rollo H9 Birdie, Mako3 H2 snake escape)!</p>
              </div>
              <div className="flex gap-2">
                <button onClick={() => onNavigateTab('courses', 'jeffery')} className="keep-white flex-1 py-2.5 px-4 rounded-xl bg-[#FF2E93] text-white font-bold text-xs sm:text-sm">Jeffery's 3D Cards ({jefferyDiscs.length})</button>
                <button onClick={() => onNavigateTab('courses', 'jack')} className="flex-1 py-2.5 px-4 rounded-xl bg-[#00F0FF] text-slate-950 font-bold text-xs sm:text-sm">Jack's 3D Cards ({jackDiscs.length})</button>
              </div>
            </div>

            <div className="neon-card rounded-2xl border border-slate-800 p-5 flex flex-col justify-between space-y-3.5">
              <div>
                <span className="text-[11px] font-extrabold uppercase tracking-wider accent-lime text-[#39FF14]">3 · Course-Grouped Round History</span>
                <h2 className="text-base sm:text-lg font-extrabold text-white mt-0.5">Review History by Course ({history.length} Rounds)</h2>
                <p className="text-xs sm:text-sm text-slate-300 mt-1">Expand Sar-Ko-Par Trails, Art Nine, Black Hoof, or Wyandotte to inspect hole-by-hole scorecards & voice notes.</p>
              </div>
              <button onClick={() => onNavigateTab('history')} className="w-full py-2.5 px-4 rounded-xl bg-[#39FF14] text-slate-950 font-bold text-xs sm:text-sm">Open Course History →</button>
            </div>

            <div className="neon-card rounded-2xl border border-slate-800 p-5 flex flex-col justify-between space-y-3.5">
              <div>
                <span className="text-[11px] font-extrabold uppercase tracking-wider accent-gold text-[#FACC15]">4 · Personal Progress & Course Records</span>
                <h2 className="text-base sm:text-lg font-extrabold text-white mt-0.5">You vs. Yourself — Personal Best Telemetry</h2>
                <p className="text-xs sm:text-sm text-slate-300 mt-1">Track how many strokes you and Jack shave off your own Personal Bests without head-to-head pressure.</p>
              </div>
              <div className="flex gap-2">
                <button onClick={() => onNavigateTab('rivalry')} className="flex-1 py-2.5 px-4 rounded-xl bg-[#00F0FF] text-slate-950 font-bold text-xs sm:text-sm">View Personal Progress Stats</button>
                <button onClick={() => onNavigateTab('sync')} className="sub-control py-2.5 px-4 rounded-xl border border-slate-700 text-white font-bold text-xs sm:text-sm">Roster & Backup</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function LiveScorecardView({
      roundState, setRoundState, roster, history, courses, bag,
      timerState, elapsedSeconds, onToggleTimer, onResetTimer,
      onSwitchCourse, onToggleActivePlayer, onSaveFinishedRound, onOpenBagGuide, scrollTop
    }) {
      const [editingHoleSpec, setEditingHoleSpec] = useState(false);
      const [caddieScenario, setCaddieScenario] = useState(roundState.windCondition || 'calm');
      const [confirmResetModal, setConfirmResetModal] = useState(false);
      const [saveConfirmBanner, setSaveConfirmBanner] = useState(null);
      const [copiedNotesConfirm, setCopiedNotesConfirm] = useState(false);
      const [modalCardDisc, setModalCardDisc] = useState(null);

      useEffect(() => {
        if (roundState.windCondition && roundState.windCondition !== caddieScenario) setCaddieScenario(roundState.windCondition);
      }, [roundState.windCondition]);

      const handleSelectWindScenario = (scenario) => {
        setCaddieScenario(scenario);
        setRoundState((prev) => ({ ...prev, windCondition: scenario }));
      };

      const activePlayerIds = roundState.activePlayerIds || roster.map((r) => r.id);
      const activePlayers = roster.filter((r) => activePlayerIds.includes(r.id));
      const isJackPlaying = activePlayerIds.includes('jack');
      const currentHole = (roundState.holes || [])[roundState.currentHoleIndex] || roundState.holes[0];
      const currentCourseTemplate = courses.find((c) => c.key === roundState.courseKey || c.name.toLowerCase() === roundState.courseName.toLowerCase());
      const currentHoleHint = currentCourseTemplate?.holes.find((h) => h.number === currentHole.number)?.hint;
      const caddyInsight = getHoleCaddyInsights(roundState.courseName, currentHole.number, history, activePlayerIds);

      const jefferyBag = bag.filter((d) => d.ownerId !== 'jack');
      const threeDiscLineup = recommendThreeDiscLineup(currentHole.distance, caddieScenario, jefferyBag.length > 0 ? jefferyBag : bag);
      const jackThreeDiscLineup = recommendJackThreeDiscLineup(bag);

      const formatDuration = (secs) => {
        const hrs = Math.floor(secs / 3600), mins = Math.floor((secs % 3600) / 60), s = secs % 60;
        return [hrs, mins, s].map((v) => String(v).padStart(2, '0')).join(':');
      };

      const updateScore = (playerId, newScore) => {
        const clamped = Math.max(0, Math.min(15, newScore));
        setRoundState((prev) => ({
          ...prev,
          holes: prev.holes.map((h, idx) => (idx !== prev.currentHoleIndex ? h : { ...h, scores: { ...h.scores, [playerId]: clamped } }))
        }));
        if (!timerState.running && elapsedSeconds === 0 && clamped > 0) onToggleTimer();
      };

      const handleCopyHeaderForNotes = async () => {
        const lineupNames = threeDiscLineup.map((item) => item.disc.name).join(' → ');
        const playerNames = activePlayers.map((p) => p.name).join(' & ');
        const template = `🎙️ DISC GOLF ROUND VOICE LOG — ${roundState.courseName}\nDate: ${roundState.date} · Wind: ${caddieScenario.toUpperCase()} · Players: ${playerNames}\nHole #${currentHole.number} (${currentHole.distance}ft, Par ${currentHole.par})\nJeffery 3-Disc Lineup: ${lineupNames}${isJackPlaying ? ' | Jack 3-Disc Lineup: Cicada → Buzzz SS → Roach' : ''}\n\n--- RECORD AUDIO IN APPLE NOTES BELOW ---\n`;
        try {
          await navigator.clipboard.writeText(template);
          setCopiedNotesConfirm(true);
          setTimeout(() => setCopiedNotesConfirm(false), 4000);
        } catch {}
        if (navigator.share) {
          try { await navigator.share({ title: `${roundState.courseName} — Round Voice Notes`, text: template }); } catch {}
        }
      };

      const updateCurrentHoleSpec = (field, value) => {
        setRoundState((prev) => ({
          ...prev,
          holes: prev.holes.map((h, idx) => (idx === prev.currentHoleIndex ? { ...h, [field]: Math.max(1, value) } : h))
        }));
      };

      const fillParForUnscored = () => {
        setRoundState((prev) => ({
          ...prev,
          holes: prev.holes.map((h, idx) => {
            if (idx !== prev.currentHoleIndex) return h;
            const nextScores = { ...h.scores };
            for (const pid of activePlayerIds) { if (!nextScores[pid] || nextScores[pid] === 0) nextScores[pid] = h.par; }
            return { ...h, scores: nextScores };
          })
        }));
        if (!timerState.running && elapsedSeconds === 0) onToggleTimer();
      };

      const goToHole = (index, scrollToHoleCard = false) => {
        const safeIdx = Math.max(0, Math.min(roundState.holes.length - 1, index));
        setRoundState((prev) => ({ ...prev, currentHoleIndex: safeIdx }));
        setTimeout(() => {
          if (scrollToHoleCard) {
            const holeHeaderEl = document.getElementById('active-hole-card-top');
            if (holeHeaderEl) {
              holeHeaderEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
              return;
            }
          }
          scrollTop();
        }, 40);
      };

      const clearCurrentRoundScores = () => {
        setRoundState((prev) => ({
          ...prev, currentHoleIndex: 0, date: new Date().toISOString().slice(0, 10), roundTranscript: '',
          holes: prev.holes.map((h) => ({ ...h, scores: Object.fromEntries(activePlayerIds.map((id) => [id, 0])), meta: {}, voiceTranscript: '' }))
        }));
        onResetTimer();
        setConfirmResetModal(false);
        scrollTop();
      };

      const liveStandings = activePlayers.map((player) => {
        let totalStrokes = 0, parThru = 0, holesCompleted = 0, birdiesCount = 0;
        for (const h of roundState.holes || []) {
          const sc = (h.scores && h.scores[player.id]) || 0;
          if (sc > 0) { totalStrokes += sc; parThru += h.par; holesCompleted++; if (sc < h.par) birdiesCount++; }
        }
        return { player, totalStrokes, parThru, holesCompleted, relPar: totalStrokes - parThru, birdiesCount, coursePB: getCoursePersonalBest(roundState.courseName, player.id, history) };
      });

      const totalHolesScoredAllPlayers = (roundState.holes || []).filter((h) => activePlayers.every((p) => ((h.scores && h.scores[p.id]) || 0) > 0)).length;
      const totalCoursePar = (roundState.holes || []).reduce((sum, h) => sum + h.par, 0);
      const totalCourseDistance = (roundState.holes || []).reduce((sum, h) => sum + h.distance, 0);

      const handleSaveRoundClick = async (copyToClipboard) => {
        await onSaveFinishedRound(copyToClipboard);
        setSaveConfirmBanner(
          copyToClipboard
            ? '✓ Round saved to History & scores copied to clipboard! Paste directly into chat or Apple Notes.'
            : '✓ Round saved to History! Scores reset for a fresh loop.'
        );
        scrollTop();
        setTimeout(() => setSaveConfirmBanner(null), 6000);
      };

      const isTimerUnstarted = !timerState.running && elapsedSeconds === 0;

      return (
        <div className="space-y-4">
          {modalCardDisc && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setModalCardDisc(null)}>
              <div className="max-w-sm w-full space-y-3" onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between px-1">
                  <span className="text-xs font-extrabold uppercase tracking-wider cb-gold">🃏 Tap Card to Flip Front / Back</span>
                  <button onClick={() => setModalCardDisc(null)} className="px-3 py-1 rounded-lg bg-white/10 cb-white text-xs font-extrabold">Close ✕</button>
                </div>
                <FlippableTradingCard
                  disc={modalCardDisc}
                  history={history}
                  onSelectForSim={(discId) => {
                    const owner = modalCardDisc.ownerId === 'jack' ? 'jack' : 'jeffery';
                    setModalCardDisc(null);
                    if (onOpenBagGuide) onOpenBagGuide(discId, owner);
                  }}
                />
              </div>
            </div>
          )}

          {isTimerUnstarted && (
            <div className="neon-card rounded-2xl border-2 border-[#FF2E93] p-4 sm:p-5 space-y-3.5 shadow-lg">
              <div className="flex items-center gap-3">
                <span className="keep-white w-11 h-11 rounded-xl bg-[#FF2E93] text-white flex items-center justify-center text-xl font-extrabold shrink-0 animate-pulse">⏱️</span>
                <div>
                  <div className="font-extrabold text-base sm:text-lg text-white">Hole #1 Tee-Off Checklist: Start Timer & Apple Notes Audio!</div>
                  <div className="text-xs sm:text-sm text-slate-400">1. Check who's playing below · 2. Copy header for Apple Notes · 3. Tap <strong>Start Round Timer</strong>!</div>
                </div>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onClick={onToggleTimer} className="keep-white min-h-[52px] px-5 py-3 rounded-xl bg-[#FF2E93] hover:bg-[#FF2E93]/90 text-white font-extrabold text-sm sm:text-base flex items-center justify-center gap-2 neon-border-pink active:scale-95 transition-transform">
                  <span>▶ 1. START ROUND TIMER (00:00:00)</span>
                </button>
                <button onClick={handleCopyHeaderForNotes} className="min-h-[52px] px-5 py-3 rounded-xl bg-[#00F0FF] hover:bg-[#00F0FF]/90 text-slate-950 font-extrabold text-sm sm:text-base flex items-center justify-center gap-2 neon-border-cyan active:scale-95 transition-transform">
                  <span>{copiedNotesConfirm ? '✓ COPIED! OPEN NOTES & RECORD AUDIO' : '🎙️ 2. COPY HEADER FOR NOTES AUDIO'}</span>
                </button>
              </div>
            </div>
          )}

          {/* Top Course, ONE-TAP PLAYER PILLS & Oversized Timer Bar */}
          <div className="neon-card rounded-2xl border border-slate-800 p-4 space-y-3">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3.5">
              <div className="flex flex-col sm:flex-row sm:items-center gap-3 flex-1">
                <div className="flex-1 max-w-xs">
                  <label className="block text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">Active Course Loop ({courses.length} Courses)</label>
                  <select value={roundState.courseKey} onChange={(e) => onSwitchCourse(e.target.value)} className="sub-control w-full h-10 px-3 rounded-xl border border-slate-700 text-white font-bold text-xs sm:text-sm">
                    {courses.map((c) => <option key={c.key} value={c.key}>{c.name} ({c.totalHoles} Holes)</option>)}
                  </select>
                </div>
                <div className="text-xs sm:text-sm font-bold text-slate-300 pt-1 sm:pt-4">
                  Par {totalCoursePar} · {totalCourseDistance.toLocaleString()} ft · Wind: <span className="uppercase font-extrabold accent-cyan text-[#00F0FF]">{caddieScenario.replace('_', ' ')}</span>
                </div>
              </div>

              <div className="sub-tile px-4 py-2 rounded-xl border-2 border-slate-700 flex items-center justify-between sm:justify-start gap-3">
                <span className="font-mono-tabular text-base sm:text-lg font-extrabold text-white">⏱️ {formatDuration(elapsedSeconds)}</span>
                <button
                  onClick={onToggleTimer}
                  className={`min-h-[40px] px-5 py-2 rounded-xl text-xs sm:text-sm font-extrabold active:scale-95 transition-transform ${
                    timerState.running ? 'bg-[#FACC15] text-slate-950' : 'keep-white bg-[#FF2E93] text-white neon-border-pink'
                  }`}
                >
                  {timerState.running ? '⏸ PAUSE TIMER' : '▶ START TIMER'}
                </button>
                <button onClick={() => setConfirmResetModal(true)} title="Reset Round" className="sub-control w-9 h-9 rounded-lg border border-slate-700 text-xs text-slate-400 font-extrabold flex items-center justify-center">↺</button>
              </div>
            </div>

            {/* ONE-TAP WHO'S PLAYING BAR RIGHT ON THE SCORECARD */}
            <div className="sub-tile px-3.5 py-2.5 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-2">
              <span className="text-xs font-extrabold text-white flex items-center gap-1.5">
                <span>👥 Who's Playing This Round?</span>
                <span className="text-[11px] font-normal text-slate-400">(Tap name to add/remove for Solo rounds)</span>
              </span>
              <div className="flex flex-wrap items-center gap-2">
                {roster.map((player) => {
                  const isActive = activePlayerIds.includes(player.id);
                  return (
                    <button
                      key={player.id}
                      onClick={() => onToggleActivePlayer(player.id)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border transition-all flex items-center gap-1.5 active:scale-95 ${
                        isActive
                          ? 'bg-[#39FF14] text-slate-950 border-[#39FF14]'
                          : 'sub-control text-slate-400 border-slate-700 opacity-70'
                      }`}
                    >
                      <span>{isActive ? '✓ Playing:' : '＋ Add'}</span>
                      <span>{player.name}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>

          {saveConfirmBanner && (
            <div className="p-3.5 rounded-2xl bg-[#39FF14]/20 border-2 border-[#39FF14] text-xs sm:text-sm font-bold text-white flex justify-between items-center">
              <span>{saveConfirmBanner}</span>
              <button onClick={() => setSaveConfirmBanner(null)} className="underline ml-4 shrink-0">Dismiss</button>
            </div>
          )}

          {confirmResetModal && (
            <div className="neon-card p-4 rounded-2xl border-2 border-[#FF2E93] flex flex-wrap items-center justify-between gap-3">
              <span className="text-xs sm:text-sm font-bold text-white">Clear all scores on {roundState.courseName} and reset timer to 00:00:00?</span>
              <div className="flex gap-2">
                <button onClick={() => setConfirmResetModal(false)} className="sub-control px-3 py-1.5 text-xs font-bold text-slate-300 border border-slate-700 rounded-lg">Cancel</button>
                <button onClick={clearCurrentRoundScores} className="keep-white px-3 py-1.5 text-xs font-bold bg-[#FF2E93] text-white rounded-lg">Clear Card & Reset</button>
              </div>
            </div>
          )}

          <div id="active-hole-card-top" className="neon-card rounded-2xl border border-slate-800 p-3.5 space-y-2 scroll-mt-4">
            <div className="flex items-center justify-between text-xs font-bold text-slate-400">
              <span>Tap Hole to Jump ({totalHolesScoredAllPlayers}/{roundState.holes.length} Completed)</span>
              <span>{activePlayers.length === 1 ? `Solo Round (${activePlayers[0].name})` : `Duo Card (${activePlayers.map((p) => p.name).join(' & ')})`}</span>
            </div>
            <div className="grid grid-cols-9 sm:grid-cols-9 md:grid-cols-18 gap-1.5">
              {roundState.holes.map((h, idx) => {
                const isCurrent = idx === roundState.currentHoleIndex;
                const p1Score = (h.scores && h.scores[activePlayers[0]?.id]) || 0;
                const p2Score = activePlayers[1] ? ((h.scores && h.scores[activePlayers[1]?.id]) || 0) : 0;
                const isScored = p1Score > 0 || p2Score > 0;
                const scoreBadge = activePlayers.length === 1 ? `${p1Score || '-'}` : `${p1Score || '-'}/${p2Score || '-'}`;
                return (
                  <button
                    key={h.number} onClick={() => goToHole(idx, true)}
                    className={`min-h-[44px] rounded-xl flex flex-col items-center justify-center transition-all border font-mono-tabular ${
                      isCurrent ? 'keep-white bg-[#FF2E93] text-white border-[#FF2E93] neon-border-pink' : isScored ? 'sub-control text-white border-[#00F0FF]' : 'sub-tile text-slate-400 border-slate-800'
                    }`}
                  >
                    <span className={`text-xs font-extrabold ${isCurrent ? 'keep-white text-white' : ''}`}>{h.number}</span>
                    <span className={`text-[10px] font-semibold ${isCurrent ? 'keep-white text-white/90' : ''}`}>{isScored ? scoreBadge : `${h.distance}'`}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <div className="lg:col-span-7 space-y-4">
              <div className="neon-card rounded-2xl border border-slate-800 p-4 space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <div className="flex items-center gap-2">
                      <h2 className="font-display text-xl sm:text-2xl font-extrabold text-white">Hole {currentHole.number}</h2>
                      <span className="px-2.5 py-1 rounded-lg sub-control border border-slate-700 text-xs font-extrabold text-white">Par {currentHole.par} · {currentHole.distance} ft</span>
                    </div>
                    {currentHoleHint && <p className="text-xs text-slate-400 mt-1">💡 {currentHoleHint}</p>}
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setEditingHoleSpec(!editingHoleSpec)} className="sub-control px-3 py-1.5 rounded-xl border border-slate-700 text-xs font-bold text-white">{editingHoleSpec ? 'Done' : 'Edit Pin / Par'}</button>
                    <button onClick={fillParForUnscored} className="px-3 py-1.5 rounded-xl bg-[#00F0FF] text-slate-950 text-xs font-extrabold">Quick Par ({currentHole.par})</button>
                  </div>
                </div>

                {editingHoleSpec && (
                  <div className="sub-tile p-3 rounded-xl border border-slate-800 grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Hole {currentHole.number} Par</label>
                      <div className="flex gap-1.5">
                        {[2, 3, 4, 5].map((pVal) => (
                          <button key={pVal} onClick={() => updateCurrentHoleSpec('par', pVal)} className={`flex-1 py-1.5 rounded-lg font-mono-tabular text-xs font-bold border ${currentHole.par === pVal ? 'keep-white bg-[#FF2E93] text-white border-[#FF2E93]' : 'sub-control text-slate-300 border-slate-700'}`}>Par {pVal}</button>
                        ))}
                      </div>
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold uppercase text-slate-400 mb-1">Pin Distance (ft)</label>
                      <input type="number" value={currentHole.distance} onChange={(e) => updateCurrentHoleSpec('distance', Number(e.target.value) || 100)} className="sub-control w-full h-9 px-3 rounded-lg border border-slate-700 font-mono-tabular text-xs sm:text-sm font-bold text-white" />
                    </div>
                  </div>
                )}

                <div className="sub-tile p-3.5 rounded-xl border border-slate-800 space-y-3.5">
                  <div className="space-y-2">
                    <span className="text-xs font-extrabold uppercase tracking-wider text-white block">
                      🎯 Hole #{currentHole.number} 3-Disc Lineups ({currentHole.distance} ft) — Tap Wind:
                    </span>
                    <div className="sub-control p-1 rounded-xl border border-slate-700 flex flex-wrap gap-1">
                      {WIND_OPTIONS.map((sc) => (
                        <button
                          key={sc.id} onClick={() => handleSelectWindScenario(sc.id)}
                          className={`flex-1 min-w-[92px] px-2 py-1.5 rounded-lg text-[11px] font-extrabold transition-colors ${
                            caddieScenario === sc.id ? 'keep-white bg-[#FF2E93] text-white' : 'text-slate-400'
                          }`}
                        >
                          {sc.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-1.5">
                    <div className="text-[11px] font-extrabold uppercase accent-pink text-[#FF2E93]">Jeffery's 3-Disc Innova Lineup (Driver → Mid-Range → Putter):</div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                      {threeDiscLineup.map((item) => (
                        <div key={item.slotLabel} className="sub-control p-2.5 rounded-xl border border-slate-700 flex flex-col justify-between space-y-2">
                          <div>
                            <span className={`inline-block px-2 py-0.5 rounded text-[9px] font-extrabold uppercase ${item.badgeColor}`}>{item.slotLabel}</span>
                            <div className="flex items-start gap-2 mt-2">
                              {item.disc.cardImage && (
                                <img src={item.disc.cardImage} alt={item.disc.name} onClick={() => setModalCardDisc(item.disc)} onError={(e) => { e.target.style.display = 'none'; }} title="Tap to open 3D Flippable Card" className="w-12 h-16 object-cover rounded-lg border border-amber-400 shadow cursor-pointer shrink-0 hover:scale-105 transition-transform" />
                              )}
                              <div className="min-w-0">
                                <div className="text-xs font-extrabold text-white leading-tight">{item.disc.weightGrams ? `${item.disc.weightGrams}g ` : ''}{item.disc.plastic} {item.disc.name}</div>
                                <div className="font-mono-tabular text-[10px] font-bold accent-cyan text-[#00F0FF] mt-0.5">[{item.disc.speed} | {item.disc.glide} | {item.disc.turn} | {item.disc.fade}]</div>
                              </div>
                            </div>
                            <p className="text-[11px] text-slate-300 mt-1.5 leading-snug">{item.note}</p>
                          </div>
                          <button onClick={() => setModalCardDisc(item.disc)} className="w-full py-1 px-2 rounded-lg sub-tile border border-slate-700 text-[10px] font-extrabold accent-pink text-[#FF2E93] hover:underline text-center">🃏 Flip 3D Card →</button>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Automatically hides Jack's 3-Disc lineup when playing Solo */}
                  {isJackPlaying && jackThreeDiscLineup.length > 0 && (
                    <div className="space-y-1.5 pt-2 border-t border-slate-700/70">

    function RoundHistoryView({ history, onDeleteRound, onReplayCourse }) {
      const courseGroups = [];
      const seenCourses = new Map();
      for (const r of history) {
        if (!seenCourses.has(r.courseName)) {
          const group = { courseName: r.courseName, rounds: [] };
          seenCourses.set(r.courseName, group);
          courseGroups.push(group);
        }
        seenCourses.get(r.courseName).rounds.push(r);
      }

      const [openCourseName, setOpenCourseName] = useState(courseGroups[0]?.courseName || null);
      const [expandedRoundId, setExpandedRoundId] = useState(history[0]?.id ?? null);
      const [copiedId, setCopiedId] = useState(null);

      const handleCopyRoundScores = async (round) => {
        try {
          await navigator.clipboard.writeText(formatRoundScoresForClipboard(round));
          setCopiedId(round.id);
          setTimeout(() => setCopiedId(null), 3000);
        } catch {}
      };

      return (
        <div className="space-y-3.5">
          <div className="neon-card rounded-2xl border border-slate-800 p-4 sm:p-5">
            <h2 className="text-lg sm:text-xl font-extrabold text-white">Course Round Archive ({courseGroups.length} Courses · {history.length} Total Rounds)</h2>
            <p className="text-xs sm:text-sm text-slate-400">Tap any course below to view the rounds played there, or expand a round for hole-by-hole scorecards & voice notes</p>
          </div>

          {courseGroups.map((group) => {
            const isCourseOpen = openCourseName === group.courseName;
            const jPB = getCoursePersonalBest(group.courseName, 'jeffery', history);
            const jackPB = getCoursePersonalBest(group.courseName, 'jack', history);

            return (
              <div key={group.courseName} className="neon-card rounded-2xl border border-slate-800 overflow-hidden">
                <button
                  onClick={() => setOpenCourseName(isCourseOpen ? null : group.courseName)}
                  className="w-full p-4 sm:p-5 text-left flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 hover:opacity-95 transition-opacity"
                >
                  <div>
                    <div className="flex items-center gap-2.5">
                      <span className="keep-white px-2.5 py-0.5 rounded-lg bg-[#FF2E93] text-white text-xs font-extrabold">
                        {group.rounds.length} {group.rounds.length === 1 ? 'Round' : 'Rounds'}
                      </span>
                      <h3 className="font-display font-extrabold text-base sm:text-lg text-white">{group.courseName}</h3>
                    </div>
                    <div className="text-xs text-slate-400 mt-1">
                      Last Played: {group.rounds[0]?.date} · {group.rounds[0]?.totalHoles} Holes (Par {group.rounds[0]?.par})
                    </div>
                  </div>

                  <div className="flex items-center gap-4">
                    <div className="text-xs sm:text-sm font-extrabold text-white">
                      {jPB.bestTotal !== null && (
                        <span className="mr-3">Jeffery PB: <span className="accent-pink text-[#FF2E93]">{jPB.bestTotal} ({formatRelativePar(jPB.bestRelPar || 0)})</span></span>
                      )}
                      {jackPB.bestTotal !== null && (
                        <span>Jack PB: <span className="accent-cyan text-[#00F0FF]">{jackPB.bestTotal} ({formatRelativePar(jackPB.bestRelPar || 0)})</span></span>
                      )}
                    </div>
                    <span className="text-sm font-extrabold text-slate-400">{isCourseOpen ? '▲' : '▼'}</span>
                  </div>
                </button>

                {isCourseOpen && (
                  <div className="p-3.5 sm:p-4 border-t border-slate-800 sub-tile space-y-3">
                    {group.rounds.map((round, rIdx) => {
                      const isExpanded = expandedRoundId === round.id;
                      const totalDistance = (round.holes || []).reduce((acc, h) => acc + (h.distance || 0), 0);
                      const holesWithVoice = (round.holes || []).filter((h) => h.voiceTranscript);

                      return (
                        <div key={round.id} className="sub-control rounded-xl border border-slate-700 overflow-hidden">
                          <div onClick={() => setExpandedRoundId(isExpanded ? null : round.id)} className="p-3.5 cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                              <div className="font-extrabold text-xs sm:text-sm text-white">
                                Round #{group.rounds.length - rIdx} — {round.date} {round.players.length === 1 ? '(Solo)' : ''} {round.roundTranscript ? '🎙️' : ''}
                              </div>
                              <div className="text-[11px] text-slate-400">⏱ {round.duration} · {round.totalHoles}H (Par {round.par}) · {totalDistance.toLocaleString()} ft</div>
                            </div>
                            <div className="flex items-center gap-4">
                              {round.players.map((pl) => (
                                <div key={pl.id} className="text-xs sm:text-sm font-extrabold text-white">
                                  {pl.name}: <span className="accent-cyan text-[#00F0FF]">{pl.total} ({formatRelativePar(pl.total - round.par)})</span>
                                </div>
                              ))}
                              <span className="text-xs font-bold text-slate-400">{isExpanded ? '▲ Hide Card' : '▼ View Card'}</span>
                            </div>
                          </div>

                          {isExpanded && (
                            <div className="p-3.5 border-t border-slate-700 space-y-3 bg-black/5">
                              <div className="overflow-x-auto">
                                <table className="w-full text-center text-xs font-mono-tabular">
                                  <thead>
                                    <tr className="border-b border-slate-700 text-slate-400">
                                      <th className="py-1.5 text-left">Metric</th>
                                      {(round.holes || []).map((h) => <th key={h.number} className="py-1.5">#{h.number}</th>)}
                                      <th className="py-1.5">Total</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-700 text-white font-bold">
                                    <tr>
                                      <td className="py-1.5 text-left text-slate-400">Dist</td>
                                      {(round.holes || []).map((h) => <td key={h.number} className="py-1.5 text-slate-400">{h.distance}</td>)}
                                      <td className="py-1.5">{totalDistance}ft</td>
                                    </tr>
                                    <tr>
                                      <td className="py-1.5 text-left text-slate-400">Par</td>
                                      {(round.holes || []).map((h) => <td key={h.number} className="py-1.5 text-slate-400">{h.par}</td>)}
                                      <td className="py-1.5">{round.par}</td>
                                    </tr>
                                    {round.players.map((pl) => (
                                      <tr key={pl.id}>
                                        <td className="py-1.5 text-left font-extrabold">{pl.name}</td>
                                        {(round.holes || []).map((h) => <td key={h.number} className="py-1.5 font-extrabold">{(h.scores && h.scores[pl.id]) || '—'}</td>)}
                                        <td className="py-1.5 font-extrabold accent-cyan text-[#00F0FF]">{pl.total} ({formatRelativePar(pl.total - round.par)})</td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>

                              {holesWithVoice.length > 0 && (
                                <div className="sub-tile p-3 rounded-xl border border-slate-700 space-y-1.5 text-xs">
                                  <div className="font-extrabold accent-pink text-[#FF2E93]">🎙️ On-Course Voice Log Highlights:</div>
                                  {holesWithVoice.map((h) => (
                                    <div key={h.number} className="text-slate-300">
                                      <strong className="text-white">Hole #{h.number} ({h.distance}ft, Par {h.par}):</strong> {h.voiceTranscript}
                                    </div>
                                  ))}
                                </div>
                              )}

                              <div className="flex flex-wrap items-center gap-2">
                                <button onClick={() => onReplayCourse(round)} className="px-3 py-1.5 rounded-xl bg-[#39FF14] text-slate-950 text-xs font-extrabold">▶ Play This Course Layout</button>
                                <button onClick={() => handleCopyRoundScores(round)} className="px-3 py-1.5 rounded-xl bg-[#00F0FF] text-slate-950 text-xs font-extrabold">{copiedId === round.id ? '✓ Copied Scores!' : '📋 Copy Round Scores'}</button>
                                <button onClick={() => { if (confirm('Delete this round?')) onDeleteRound(round.id); }} className="px-2.5 py-1.5 rounded-xl text-rose-500 text-xs font-bold">🗑 Delete</button>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    function SyncAndRosterView({
      roster, setRoster, activePlayerIds, onToggleActivePlayer,
      onExportJsonPayload, onImportJsonPayload, onResetToFactoryData
    }) {
      const [newPlayerName, setNewPlayerName] = useState('');
      const [newPlayerTag, setNewPlayerTag] = useState('');
      const [statusMessage, setStatusMessage] = useState(null);
      const [copiedClipboard, setCopiedClipboard] = useState(false);

      const handleAddPlayer = (e) => {
        e.preventDefault();
        if (!newPlayerName.trim()) return;
        const id = newPlayerName.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        if (roster.some((r) => r.id === id)) return;
        const created = { id, name: newPlayerName.trim(), tag: newPlayerTag.trim().toUpperCase() || newPlayerName.trim().slice(0, 2).toUpperCase(), color: 'emerald-600' };
        setRoster((prev) => [...prev, created]);
        setNewPlayerName(''); setNewPlayerTag('');
        setStatusMessage({ type: 'success', text: `Added ${created.name} (${created.tag}) to roster.` });
      };

      return (
        <div className="space-y-5">
          {statusMessage && (
            <div className="neon-card p-3.5 rounded-2xl border-2 border-[#39FF14] text-xs sm:text-sm font-bold text-white flex justify-between">
              <span>{statusMessage.text}</span>
              <button onClick={() => setStatusMessage(null)} className="underline">Dismiss</button>
            </div>
          )}

          <div className="neon-card rounded-2xl border border-slate-800 p-4 sm:p-5 space-y-3.5">
            <h2 className="text-base sm:text-lg font-extrabold text-white">Player Roster & Active Card Selection</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              {roster.map((player) => {
                const isActive = activePlayerIds.includes(player.id);
                return (
                  <div key={player.id} className="sub-tile p-3 rounded-xl border border-slate-800 flex items-center justify-between">
                    <div className="font-extrabold text-sm text-white">{player.tag} · {player.name}</div>
                    <button onClick={() => onToggleActivePlayer(player.id)} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${isActive ? 'bg-[#39FF14] text-slate-950' : 'sub-control text-slate-400'}`}>
                      {isActive ? 'Active on Card ✓' : 'Add to Card'}
                    </button>
                  </div>
                );
              })}
            </div>
            <form onSubmit={handleAddPlayer} className="flex flex-wrap gap-2 pt-1">
              <input type="text" value={newPlayerName} onChange={(e) => setNewPlayerName(e.target.value)} placeholder="New player name (e.g. Zack)" className="sub-control h-10 px-3 rounded-xl border border-slate-700 text-white text-xs sm:text-sm font-bold" />
              <input type="text" value={newPlayerTag} onChange={(e) => setNewPlayerTag(e.target.value)} placeholder="Tag (Z1)" className="sub-control w-20 h-10 px-3 rounded-xl border border-slate-700 text-white text-xs sm:text-sm font-bold uppercase" />
              <button type="submit" className="keep-white h-10 px-4 rounded-xl bg-[#FF2E93] text-white text-xs sm:text-sm font-extrabold">+ Add Player</button>
            </form>
          </div>

          <div className="neon-card rounded-2xl border border-slate-800 p-4 sm:p-5 space-y-3.5">
            <h2 className="text-base sm:text-lg font-extrabold text-white">JSON Data Export & Import (Phone ↔ Laptop)</h2>
            <div className="flex flex-wrap gap-2.5">
              <button
                onClick={() => {
                  const payload = onExportJsonPayload();
                  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a'); a.href = url; a.download = `DG_Full_Backup_${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(url);
                }}
                className="px-3.5 py-2 rounded-xl bg-[#00F0FF] text-slate-950 font-extrabold text-xs sm:text-sm"
              >
                ⬇ Download .JSON Backup
              </button>
              <button
                onClick={async () => {
                  await navigator.clipboard.writeText(JSON.stringify(onExportJsonPayload(), null, 2));
                  setCopiedClipboard(true); setTimeout(() => setCopiedClipboard(false), 2500);
                }}
                className="sub-control px-3.5 py-2 rounded-xl border border-slate-700 text-white font-bold text-xs sm:text-sm"
              >
                {copiedClipboard ? '✓ Copied JSON!' : '📋 Copy JSON to Clipboard'}
              </button>
              <label className="px-3.5 py-2 rounded-xl bg-[#39FF14] text-slate-950 font-extrabold text-xs sm:text-sm cursor-pointer">
                ⬆ Upload .JSON File
                <input
                  type="file" accept=".json" className="hidden"
                  onChange={(e) => {
                    const file = e.target.files?.[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                      const result = onImportJsonPayload(String(ev.target?.result || ''));
                      setStatusMessage({ type: result.ok ? 'success' : 'error', text: result.message });
                    };
                    reader.readAsText(file);
                  }}
                />
              </label>
              <button onClick={onResetToFactoryData} className="sub-control px-3.5 py-2 rounded-xl border border-slate-700 text-slate-400 font-bold text-xs sm:text-sm">↺ Restore Baseline Snapshot</button>
            </div>
          </div>
        </div>
      );
    }

    const STORAGE_KEY = 'jj_disc_golf_v46_hub_state';
    const THEME_STORAGE_KEY = 'jj_disc_golf_bg_theme';

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [showStartWizard, setShowStartWizard] = useState(false);
      const [focusedDiscId, setFocusedDiscId] = useState(null);
      const [bagOwnerFilter, setBagOwnerFilter] = useState('jeffery');
      const [bgTheme, setBgTheme] = useState(() => localStorage.getItem(THEME_STORAGE_KEY) || 'white');
      const mainScrollRef = useRef(null);

      useEffect(() => { try { localStorage.setItem(THEME_STORAGE_KEY, bgTheme); } catch {} }, [bgTheme]);

      const scrollTop = () => {
        if (mainScrollRef.current) {
          mainScrollRef.current.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
        }
        window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
      };

      const switchTabAndScrollTop = (tabName) => {
        if (tabName === 'home') setShowStartWizard(false);
        setActiveTab(tabName);
        if (mainScrollRef.current) {
          mainScrollRef.current.scrollTo({ top: 0, left: 0, behavior: 'auto' });
        }
      };

      // Auto-syncs 10/20 Sar-Ko-Par Solo round and removes any accidental 2026-10-20 Jack phantom score
      const [history, setHistory] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.history) && parsed.history.length > 0) {
              // Filter out the accidental 2026-10-20 Sar-Ko-Par round that had Jack at 27
              const cleaned = parsed.history.filter(
                (r) => !(r.courseName === 'Sar-Ko-Par Trails' && r.date === '2026-10-20' && r.duration === '00:22:22')
              );
              const merged = cleaned.map((r) => {
                const matchDefault = INITIAL_USER_EXPORT.history.find((dr) => dr.id === r.id);
                return matchDefault ? { ...r, ...matchDefault } : r;
              });
              for (const defaultRound of INITIAL_USER_EXPORT.history) {
                const alreadyExists = merged.some(
                  (r) => r.id === defaultRound.id || (r.courseName === defaultRound.courseName && r.date === defaultRound.date && r.duration === defaultRound.duration)
                );
                if (!alreadyExists) merged.push(defaultRound);
              }
              merged.sort((a, b) => b.id - a.id);
              return merged;
            }
          }
        } catch {}
        return INITIAL_USER_EXPORT.history;
      });

      const [roster, setRoster] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) { const parsed = JSON.parse(saved); if (Array.isArray(parsed.roster) && parsed.roster.length > 0) return parsed.roster; }
        } catch {}
        return INITIAL_USER_EXPORT.roster;
      });

      const [courses, setCourses] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.courses) && parsed.courses.length > 0) {
              const updatedCourses = parsed.courses.map((c) => {
                const matchDefault = INITIAL_COURSE_TEMPLATES.find((dc) => dc.key === c.key);
                return matchDefault ? matchDefault : c;
              });
              const existingKeys = new Set(updatedCourses.map((c) => c.key));
              const missingDefaults = INITIAL_COURSE_TEMPLATES.filter((c) => !existingKeys.has(c.key));
              return [...missingDefaults, ...updatedCourses];
            }
          }
        } catch {}
        return INITIAL_COURSE_TEMPLATES;
      });

      const [bag, setBag] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.bag) && parsed.bag.length > 0) {
              return parsed.bag.map((d) => {
                const defaultMatch = INITIAL_DISC_BAG.find((initD) => initD.id === d.id);
                return defaultMatch ? { ...d, ...defaultMatch } : d;
              });
            }
          }
        } catch {}
        return INITIAL_DISC_BAG;
      });

      const [roundState, setRoundState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.roundState && Array.isArray(parsed.roundState.holes)) {
              const hasActiveScores = parsed.roundState.holes.some((h) => Object.values(h.scores || {}).some((s) => s > 0));
              if (hasActiveScores) return parsed.roundState;
            }
          }
        } catch {}
        return INITIAL_USER_EXPORT.roundState;
      });

      const [timerState, setTimerState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) { const parsed = JSON.parse(saved); if (parsed.timerState) return parsed.timerState; }
        } catch {}
        return INITIAL_USER_EXPORT.timerState;
      });

      const [elapsedSeconds, setElapsedSeconds] = useState(0);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            app: 'Jeffery & Jack Disc Golf Scorecard', version: 'v65', exportDate: new Date().toISOString(),
            history, roster, roundState, timerState, courses, bag
          }));
        } catch {}
      }, [history, roster, roundState, timerState, courses, bag]);

      useEffect(() => {
        const computeSeconds = () => {
          const extra = timerState.running && timerState.startTime ? Date.now() - timerState.startTime : 0;
          return Math.floor((timerState.accumulatedMs + extra) / 1000);
        };
        setElapsedSeconds(computeSeconds());
        if (!timerState.running) return;
        const interval = setInterval(() => setElapsedSeconds(computeSeconds()), 1000);
        return () => clearInterval(interval);
      }, [timerState]);

      const handleToggleTimer = () => {
        setTimerState((prev) => {
          if (prev.running) return { running: false, startTime: null, accumulatedMs: prev.accumulatedMs + (prev.startTime ? Date.now() - prev.startTime : 0) };
          return { running: true, startTime: Date.now(), accumulatedMs: prev.accumulatedMs };
        });
      };

      const handleResetTimer = () => { setTimerState({ running: false, startTime: null, accumulatedMs: 0 }); setElapsedSeconds(0); };

      const handleSwitchCourse = (courseKey) => {
        const template = courses.find((c) => c.key === courseKey);
        if (!template) return;
        const activeIds = roundState.activePlayerIds || roster.map((r) => r.id);
        setRoundState({
          courseKey: template.key, courseName: template.name, totalHoles: template.totalHoles,
          date: new Date().toISOString().slice(0, 10), currentHoleIndex: 0, activePlayerIds: activeIds,
          gameMode: 'stroke', windCondition: roundState.windCondition || 'calm', roundTranscript: '',
          holes: template.holes.map((h) => ({ number: h.number, par: h.par, distance: h.distance, scores: Object.fromEntries(activeIds.map((id) => [id, 0])) }))
        });
        handleResetTimer();
        scrollTop();
      };

      const handleStartConfiguredRound = (params) => {
        const template = courses.find((c) => c.key === params.courseKey) || courses[0];
        const activeIds = roundState.activePlayerIds || roster.map((r) => r.id);
        setRoundState({
          courseKey: template.key, courseName: template.name, totalHoles: template.totalHoles,
          date: new Date().toISOString().slice(0, 10), currentHoleIndex: 0, activePlayerIds: activeIds,
          gameMode: 'stroke', windCondition: params.windCondition,
          voiceRecordingConfirmed: params.voiceRecordingConfirmed, roundTranscript: '',
          holes: template.holes.map((h) => ({ number: h.number, par: h.par, distance: h.distance, scores: Object.fromEntries(activeIds.map((id) => [id, 0])) }))
        });
        handleResetTimer();
        switchTabAndScrollTop('live');
      };

      const handleReplayHistoricalCourse = (round) => {
        const activeIds = roundState.activePlayerIds || roster.map((r) => r.id);
        const matchedTemplate = courses.find((c) => c.name.toLowerCase() === round.courseName.toLowerCase());
        setRoundState({
          courseKey: matchedTemplate?.key || 'sarko', courseName: round.courseName, totalHoles: round.totalHoles,
          date: new Date().toISOString().slice(0, 10), currentHoleIndex: 0, activePlayerIds: activeIds,
          gameMode: 'stroke', windCondition: round.windCondition || 'calm', roundTranscript: '',
          holes: round.holes.map((h) => ({ number: h.number, par: h.par, distance: h.distance, scores: Object.fromEntries(activeIds.map((id) => [id, 0])) }))
        });
        handleResetTimer();
        switchTabAndScrollTop('live');
      };

      // Smart save: Only saves players who are active (and ignores a player if they have 0 throws on every hole while someone else scored)
      const handleSaveFinishedRound = async (copyScoresToClipboard) => {
        const activeIds = roundState.activePlayerIds || roster.map((r) => r.id);
        const activeRoster = roster.filter((r) => activeIds.includes(r.id));
        const playersWithAnyScore = activeRoster.filter((p) =>
          (roundState.holes || []).some((h) => h.scores && h.scores[p.id] > 0)
        );
        const effectiveRoster = playersWithAnyScore.length > 0 ? playersWithAnyScore : activeRoster;

        const hrs = Math.floor(elapsedSeconds / 3600), mins = Math.floor((elapsedSeconds % 3600) / 60), secs = elapsedSeconds % 60;
        const durationFormatted = elapsedSeconds > 0 ? [hrs, mins, secs].map((v) => String(v).padStart(2, '0')).join(':') : '00:25:00';
        const coursePar = (roundState.holes || []).reduce((acc, h) => acc + h.par, 0);
        const finalizedHoles = roundState.holes.map((h) => {
          const nextScores = {};
          for (const p of effectiveRoster) nextScores[p.id] = h.scores && h.scores[p.id] > 0 ? h.scores[p.id] : h.par;
          return { ...h, scores: nextScores };
        });
        const playersSummary = effectiveRoster.map((p) => ({
          id: p.id, name: p.name, tag: p.tag,
          total: finalizedHoles.reduce((sum, h) => sum + (h.scores[p.id] || h.par), 0)
        }));
        const newHistoricalRound = {
          id: Date.now(), courseName: roundState.courseName, totalHoles: roundState.totalHoles,
          date: roundState.date || new Date().toISOString().slice(0, 10), duration: durationFormatted,
          par: coursePar, players: playersSummary, holes: finalizedHoles,
          gameMode: 'stroke', windCondition: roundState.windCondition || 'calm', roundTranscript: ''
        };
        setHistory((prev) => [newHistoricalRound, ...prev]);
        if (copyScoresToClipboard) {
          try {
            await navigator.clipboard.writeText(formatRoundScoresForClipboard(newHistoricalRound));
          } catch {}
        }
        setRoundState((prev) => ({
          ...prev, currentHoleIndex: 0, date: new Date().toISOString().slice(0, 10), roundTranscript: '',
          holes: prev.holes.map((h) => ({ ...h, scores: Object.fromEntries(activeIds.map((id) => [id, 0])), meta: {}, voiceTranscript: '' }))
        }));
        handleResetTimer();
      };

      const handleToggleActivePlayer = (playerId) => {
        setRoundState((prev) => {
          const currentIds = prev.activePlayerIds || roster.map((r) => r.id);
          const exists = currentIds.includes(playerId);
          if (exists && currentIds.length <= 1) return prev;
          return { ...prev, activePlayerIds: exists ? currentIds.filter((id) => id !== playerId) : [...currentIds, playerId] };
        });
      };

      const handleExportJsonPayload = () => ({
        app: 'Jeffery & Jack Disc Golf Scorecard', version: 'v65', exportDate: new Date().toISOString(),
        history, roster, roundState, timerState, courses, bag
      });

      const handleImportJsonPayload = (rawJson) => {
        try {
          const parsed = JSON.parse(rawJson);
          if (!parsed || !Array.isArray(parsed.history)) return { ok: false, message: 'Invalid JSON: missing "history" array.' };
          setHistory(parsed.history);
          if (Array.isArray(parsed.roster)) setRoster(parsed.roster);
          if (parsed.roundState && Array.isArray(parsed.roundState.holes)) setRoundState(parsed.roundState);
          if (Array.isArray(parsed.courses)) setCourses(parsed.courses);
          return { ok: true, message: `Successfully imported ${parsed.history.length} rounds into your scorecard!` };
        } catch {
          return { ok: false, message: 'Could not parse JSON string.' };
        }
      };

      const handleResetToFactoryData = () => {
        setHistory(INITIAL_USER_EXPORT.history); setRoster(INITIAL_USER_EXPORT.roster);
        setRoundState(INITIAL_USER_EXPORT.roundState);
        setCourses(INITIAL_COURSE_TEMPLATES); setBag(INITIAL_DISC_BAG); handleResetTimer();
      };

      const themeClass = bgTheme === 'white' ? 'theme-white' : bgTheme === 'adventure' ? 'theme-adventure' : bgTheme === 'turf' ? 'theme-turf' : 'theme-midnight';

      return (
        <div className={`${themeClass} app-shell transition-colors duration-200`}>
          {/* TOP HEADER (FIXED IN FLEX SHELL) */}
          <header className="safe-header bg-[#080B14] border-b border-slate-800 px-4 shrink-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-3">
              <a href="#home" onClick={(e) => { e.preventDefault(); switchTabAndScrollTop('home'); }} className="font-display text-base sm:text-lg font-extrabold tracking-normal whitespace-nowrap shrink-0 text-white">
                Jeffery & <span className="text-[#FF2E93]">Jack</span> Disc Golf
              </a>

              <nav className="hidden md:flex items-center gap-6 text-xs sm:text-sm font-bold text-slate-300">
                <button onClick={() => switchTabAndScrollTop('home')} className={`py-1 border-b-2 ${activeTab === 'home' ? 'border-[#39FF14] text-[#39FF14]' : 'border-transparent hover:text-white'}`}>Home Hub</button>
                <button onClick={() => switchTabAndScrollTop('live')} className={`py-1 border-b-2 ${activeTab === 'live' ? 'border-[#FF2E93] text-[#FF2E93]' : 'border-transparent hover:text-white'}`}>Live Scorecard</button>
                <button onClick={() => switchTabAndScrollTop('courses')} className={`py-1 border-b-2 ${activeTab === 'courses' ? 'border-[#00F0FF] text-[#00F0FF]' : 'border-transparent hover:text-white'}`}>3D Cards & Flight Lab</button>
                <button onClick={() => switchTabAndScrollTop('history')} className={`py-1 border-b-2 ${activeTab === 'history' || activeTab === 'rivalry' ? 'border-[#FACC15] text-[#FACC15]' : 'border-transparent hover:text-white'}`}>History & Personal Stats</button>
              </nav>

              <button onClick={() => switchTabAndScrollTop('sync')} className={`px-3.5 py-1.5 text-xs font-extrabold rounded-xl shrink-0 ${activeTab === 'sync' ? 'bg-[#39FF14] text-slate-950' : 'bg-[#FF2E93] text-white'}`}>
                Data & Roster
              </button>
            </div>
          </header>

          {/* DEDICATED SCROLLABLE MAIN CONTENT */}
          <main ref={mainScrollRef} className="app-scroll-main">
            <div className="max-w-7xl mx-auto px-3.5 sm:px-6 py-4 pb-10 space-y-4">
              <div className="neon-card border border-slate-800 rounded-2xl p-2.5 sm:px-4 flex flex-wrap items-center justify-between gap-2">
                <span className="text-xs sm:text-sm font-extrabold text-white flex items-center gap-1.5"><span>🎨 Theme & Backdrop:</span></span>
                <div className="flex flex-wrap gap-1.5">
                  {[
                    { id: 'white', label: 'Indigo + White Tiles' },
                    { id: 'adventure', label: 'Pink/Blue + White Tiles' },
                    { id: 'turf', label: 'Fairway + White Tiles' },
                    { id: 'midnight', label: 'Midnight Dark Tiles' }
                  ].map((mode) => (
                    <button
                      key={mode.id} onClick={() => setBgTheme(mode.id)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border transition-all ${bgTheme === mode.id ? 'keep-white bg-[#FF2E93] text-white border-[#FF2E93] shadow-xs' : 'sub-control text-white border-slate-700'}`}
                    >
                      {mode.label}
                    </button>
                  ))}
                </div>
              </div>

              {activeTab === 'home' && (
                <HomeHubView
                  courses={courses} bag={bag} history={history} roundState={roundState}
                  roster={roster} onToggleActivePlayer={handleToggleActivePlayer}
                  showStartWizard={showStartWizard} setShowStartWizard={setShowStartWizard}
                  onStartConfiguredRound={handleStartConfiguredRound}
                  onResumeLiveRound={() => switchTabAndScrollTop('live')}
                  onNavigateTab={(tab, ownerFilter) => { if (ownerFilter) setBagOwnerFilter(ownerFilter); switchTabAndScrollTop(tab); }}
                  scrollTop={scrollTop}
                />
              )}

              {activeTab === 'live' && (
                <LiveScorecardView
                  roundState={roundState} setRoundState={setRoundState} roster={roster} history={history} courses={courses} bag={bag}
                  timerState={timerState} elapsedSeconds={elapsedSeconds} onToggleTimer={handleToggleTimer} onResetTimer={handleResetTimer}
                  onSwitchCourse={handleSwitchCourse} onToggleActivePlayer={handleToggleActivePlayer}
                  onSaveFinishedRound={handleSaveFinishedRound}
                  onOpenBagGuide={(discId, ownerFilter) => { if (discId) setFocusedDiscId(discId); if (ownerFilter) setBagOwnerFilter(ownerFilter); switchTabAndScrollTop('courses'); }}
                  scrollTop={scrollTop}
                />
              )}

              {activeTab === 'courses' && (
                <CoursesAndBagView
                  courses={courses} setCourses={setCourses} bag={bag} setBag={setBag} history={history} roster={roster}
                  onStartRoundAtCourse={(courseKey) => { handleSwitchCourse(courseKey); switchTabAndScrollTop('live'); }}
                  initialSelectedDiscId={focusedDiscId} initialBagOwnerFilter={bagOwnerFilter}
                />
              )}

              {activeTab === 'rivalry' && (
                <div className="space-y-4">
                  <div className="flex justify-end">
                    <button onClick={() => switchTabAndScrollTop('history')} className="sub-control px-3.5 py-2 rounded-xl border border-slate-700 text-xs font-extrabold text-white">Switch to Course-Grouped Scorecards →</button>
                  </div>
                  <RivalryAnalyticsView history={history} roster={roster} />
                </div>
              )}

              {activeTab === 'history' && (
                <div className="space-y-4">
                  <div className="flex justify-end">
                    <button onClick={() => switchTabAndScrollTop('rivalry')} className="px-3.5 py-2 rounded-xl bg-[#00F0FF] text-slate-950 text-xs font-extrabold">View You vs. Yourself Personal Progress Stats →</button>
                  </div>
                  <RoundHistoryView
                    history={history}
                    onDeleteRound={(id) => setHistory((prev) => prev.filter((item) => item.id !== id))}
                    onReplayCourse={handleReplayHistoricalCourse}
                  />
                </div>
              )}

              {activeTab === 'sync' && (
                <SyncAndRosterView
                  roster={roster} setRoster={setRoster} activePlayerIds={roundState.activePlayerIds || roster.map((r) => r.id)}
                  onToggleActivePlayer={handleToggleActivePlayer}
                  onExportJsonPayload={handleExportJsonPayload} onImportJsonPayload={handleImportJsonPayload} onResetToFactoryData={handleResetToFactoryData}
                />
              )}
            </div>
          </main>

          {/* FLEX-ANCHORED MOBILE BOTTOM NAVIGATION (IMMUNE TO SAFARI FIXED-SCROLL BUG) */}
          <nav className="safe-bottom-nav shrink-0 bg-[#080B14] border-t border-slate-800 grid grid-cols-5 md:hidden z-30 shadow-[0_-8px_20px_rgba(0,0,0,0.6)]">
            {[
              { id: 'home', label: 'Home Hub', icon: '🏠', color: 'text-[#39FF14]' },
              { id: 'live', label: 'Play Round', icon: '📋', color: 'text-[#FF2E93]' },
              { id: 'courses', label: '3D Cards', icon: '🃏', color: 'text-[#00F0FF]' },
              { id: 'history', label: 'History', icon: '🕒', color: 'text-[#FACC15]' },
              { id: 'rivalry', label: 'My Stats', icon: '📈', color: 'text-[#C026D3]' }
            ].map((item) => {
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => switchTabAndScrollTop(item.id)}
                  className={`min-h-[54px] flex flex-col items-center justify-center text-[11px] transition-colors ${
                    isActive ? `${item.color} font-extrabold` : 'text-slate-400'
                  }`}
                >
                  <span className="text-base leading-none mb-0.5">{item.icon}</span>
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
