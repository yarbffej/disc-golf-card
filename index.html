      -webkit-transform-style: preserve-3d;

    .card-3d-inner.is-flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1rem;
      overflow: hidden;
    }

    .card-face-front {
      transform: rotateY(0deg);
      -webkit-transform: rotateY(0deg);
      z-index: 2;
    }

    .card-face-back {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);

        rgba(255, 46, 147, 0.16) 50%,

        rgba(255, 255, 255, 0) 100%

      animation: holoShift 6s ease-in-out infinite;
      mix-blend-mode: screen;
      pointer-events: none;

    function formatToPar(diff) {
      if (diff === 0) return "E";
      return diff > 0 ? `+${diff}` : `${diff}`;
    }

    function formatDurationMs(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
    }

    function getImpelMatrix(disc) {
      const speedBar = Math.min(7, Math.max(2, Math.round((disc.speed / 12) * 7)));
      const glideBar = Math.min(7, Math.max(2, Math.round((disc.glide / 6) * 7)));
      const accuracyBar = disc.speed <= 5 ? 7 : disc.speed <= 7 ? 6 : 5;
      const windResistBar = Math.min(7, Math.max(2, Math.round(((disc.fade * 1.5 - disc.turn * 0.6) + 2))));
      return [
        { label: "VELOCITY", val: speedBar, color: "#00F0FF" },
        { label: "GLIDE LOFT", val: glideBar, color: "#39FF14" },
        { label: "PRECISION", val: accuracyBar, color: "#FACC15" },
        { label: "WIND ARMOR", val: windResistBar, color: "#FF2E93" }
      ];
    }

    function getCaddiePick(bag, ownerId, distance, wind) {
      const myDiscs = bag.filter(d => d.ownerId === ownerId);
      if (!myDiscs.length) return null;

      if (ownerId === "jack") {
        if (distance <= 165) return myDiscs.find(d => d.id === "discraft-roach") || myDiscs[0];
        if (distance <= 245) return myDiscs.find(d => d.id === "discraft-buzzz-ss") || myDiscs[0];
        return myDiscs.find(d => d.id === "discraft-cicada") || myDiscs[0];
      }

      if (distance <= 125) {
        if (wind === "headwind" || wind === "cross_rl") return myDiscs.find(d => d.id === "innova-pig");
        return myDiscs.find(d => d.id === "innova-aviar");
      }
      if (distance <= 175) {
        if (wind === "headwind" || wind === "cross_rl") return myDiscs.find(d => d.id === "innova-pig");
        return myDiscs.find(d => d.id === "innova-sync");
      }
      if (distance <= 235) {
        if (wind === "headwind" || wind === "cross_rl") return myDiscs.find(d => d.id === "innova-roc3");
        if (wind === "tailwind") return myDiscs.find(d => d.id === "innova-rollo");
        return myDiscs.find(d => d.id === "innova-mako3");
      }
      if (distance <= 305) {
        if (wind === "headwind" || wind === "cross_lr") return myDiscs.find(d => d.id === "innova-firebird");
        return myDiscs.find(d => d.id === "innova-it");
      }
      if (wind === "headwind" || wind === "cross_lr") return myDiscs.find(d => d.id === "innova-firebird");
      return myDiscs.find(d => d.id === "innova-mamba");
    }

                  {/* Impel 1-7 Power Matrix */}
                  <div className="grid grid-cols-2 gap-x-2.5 gap-y-1 my-1.5 bg-slate-900/90 border border-slate-700/80 rounded-lg p-1.5">
                    {matrix.map(stat => (

                </div>

                {/* 3 Compact Impel Dossier Boxes */}
                <div className="flex-1 flex flex-col justify-between gap-1.5 my-0.5 overflow-y-auto no-scrollbar">
                  {/* BOX #1: Mold & Flight */}
                  <div className="bg-slate-900/85 border border-cyan-500/30 rounded-lg p-2">

                  <div className="bg-slate-900/85 border border-emerald-500/30 rounded-lg p-2">
                    <div className="text-[9px] font-orbitron font-bold text-emerald-300 uppercase tracking-wider mb-0.5">
                      ② Course Strategy & Wind Role
                    </div>
                    <p className="text-[10.5px] leading-snug text-slate-200">
                      {disc.courseStrategy}
                    </p>
                    {disc.spotterWarning && (
                      <div className="mt-1 text-[9.5px] font-semibold text-amber-300">
                        ⚠️ {disc.spotterWarning}
                      </div>
                    )}
                  </div>

                  {/* BOX #3: 🎙️ Transcript Log Stats (Updated with Full 9-Hole Black Hoof & Art Nine!) */}
                  <div className="bg-amber-950/35 border border-amber-400/50 rounded-lg p-2">
                    <div className="text-[9px] font-orbitron font-bold text-amber-300 uppercase tracking-wider mb-0.5 flex items-center justify-between">
                      <span>③ 🎙️ Transcript Log Stats</span>
                      <span className="text-[8px] font-mono-code text-amber-200/80">10/19 DOUBLEHEADER</span>
                    </div>
                    <p className="text-[10.5px] leading-snug text-amber-100 font-medium">
                      {disc.transcriptStats}
                    </p>
                  </div>
                </div>

                {/* Impel Footer */}
                <div className="pt-1 border-t border-amber-400/30 flex items-center justify-between text-[8.5px] font-mono-code text-slate-400">
                  <span>199X IMPEL • {disc.sku || "DG-199X"}</span>
                  <span className="text-amber-300 font-bold">TAP TO FLIP FRONT ↩</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MAIN APP COMPONENT (v64)
    // =========================================================================
    function App() {
      const [appState, setAppState] = useState(() => {
        try {
          let raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            for (const k of LEGACY_KEYS) {
              const legacy = localStorage.getItem(k);
              if (legacy) {
                raw = legacy;
                break;
              }
            }
          }
          if (raw) {
            const parsed = JSON.parse(raw);
            const historyMap = new Map();
            (INITIAL_USER_EXPORT.history || []).forEach(r => historyMap.set(r.id, r));
            (parsed.history || []).forEach(r => {
              // Ensure the two baked 10/19 rounds always include the latest full 9-hole voice transcripts
              if (r.id === 1792453677372 || r.id === 1792451323316) {
                historyMap.set(r.id, INITIAL_USER_EXPORT.history.find(x => x.id === r.id));
              } else {
                historyMap.set(r.id, r);
              }
            });
            const mergedHistory = Array.from(historyMap.values()).sort((a, b) => {
              if (b.date !== a.date) return b.date.localeCompare(a.date);
              return (b.id || 0) - (a.id || 0);
            });

            return {
              ...INITIAL_USER_EXPORT,
              ...parsed,
              version: "v64",
              history: mergedHistory,
              courses: INITIAL_USER_EXPORT.courses,
              bag: INITIAL_USER_EXPORT.bag
            };
          }
        } catch (err) {
          console.error("State load error, using INITIAL_USER_EXPORT:", err);
        }
        return INITIAL_USER_EXPORT;
      });

      const [activeTab, setActiveTab] = useState("play");
      const [binderOwnerFilter, setBinderOwnerFilter] = useState("all");
      const [binderTierFilter, setBinderTierFilter] = useState("all");
      const [statsPlayerFilter, setStatsPlayerFilter] = useState("both");
      const [toastMsg, setToastMsg] = useState(null);
      const [nowTick, setNowTick] = useState(Date.now());
      const [isListening, setIsListening] = useState(false);
      const [selectedCourseDetail, setSelectedCourseDetail] = useState("blackhoof");
      const [jsonModalOpen, setJsonModalOpen] = useState(false);
      const [importJsonText, setImportJsonText] = useState("");

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        } catch (e) {
          console.error("Failed to save state:", e);
        }
      }, [appState]);

      useEffect(() => {
        if (!appState.timerState?.running) return;
        const id = setInterval(() => setNowTick(Date.now()), 1000);
        return () => clearInterval(id);
      }, [appState.timerState?.running]);

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const handleTabChange = (tab) => {
        setActiveTab(tab);
        scrollToTop();
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      const elapsedMs = useMemo(() => {
        const ts = appState.timerState || { running: false, startTime: null, accumulatedMs: 0 };
        if (ts.running && ts.startTime) {
          return (ts.accumulatedMs || 0) + (nowTick - ts.startTime);
        }
        return ts.accumulatedMs || 0;
      }, [appState.timerState, nowTick]);

      const toggleTimer = () => {
        setAppState(prev => {
          const ts = prev.timerState || { running: false, startTime: null, accumulatedMs: 0 };
          if (ts.running) {
            return {
              ...prev,
              timerState: {
                running: false,
                startTime: null,
                accumulatedMs: (ts.accumulatedMs || 0) + (Date.now() - ts.startTime)
              }
            };
          } else {
            return {
              ...prev,
              timerState: {
                running: true,
                startTime: Date.now(),
                accumulatedMs: ts.accumulatedMs || 0
              }
            };
          }
        });
      };

      const resetTimer = () => {
        setAppState(prev => ({
          ...prev,
          timerState: { running: false, startTime: null, accumulatedMs: 0 }
        }));
        showToast("⏱️ Round timer reset to 00:00:00");
      };

      const { roundState, history, courses, bag, roster } = appState;
      const currentHoleIndex = roundState.currentHoleIndex || 0;
      const currentHole = roundState.holes[currentHoleIndex] || roundState.holes[0];
      const activeCourseObj = useMemo(
        () => courses.find(c => c.key === roundState.courseKey || c.name === roundState.courseName) || courses[0],
        [courses, roundState.courseKey, roundState.courseName]
      );
      const currentHoleCourseMeta = useMemo(
        () => activeCourseObj?.holes?.find(h => h.number === currentHole?.number) || {},
        [activeCourseObj, currentHole]
      );

      const selectHoleIndex = (idx) => {
        const clamped = Math.max(0, Math.min(roundState.holes.length - 1, idx));
        setAppState(prev => ({
          ...prev,
          roundState: { ...prev.roundState, currentHoleIndex: clamped }
        }));
        scrollToTop();
      };

      const handleCourseChange = (newCourseKey) => {
        const course = courses.find(c => c.key === newCourseKey);
        if (!course) return;
        const todayStr = new Date().toISOString().slice(0, 10);
        setAppState(prev => ({
          ...prev,
          roundState: {
            ...prev.roundState,
            courseKey: course.key,
            courseName: course.name,
            totalHoles: course.totalHoles,
            date: todayStr,
            currentHoleIndex: 0,
            roundTranscript: "",
            holes: course.holes.map(h => ({
              number: h.number,
              par: h.par,
              distance: h.distance,
              scores: { jeffery: 0, jack: 0 },
              meta: {},
              voiceTranscript: ""
            }))
          }
        }));
        scrollToTop();
        showToast(`📍 Switched course to ${course.name}`);
      };

      const handleWindChange = (windId) => {
        setAppState(prev => ({
          ...prev,
          roundState: { ...prev.roundState, windCondition: windId }
        }));
      };

      const updatePlayerHoleScore = (playerId, deltaOrExact, isExact = false) => {
        setAppState(prev => {
          const holesCopy = prev.roundState.holes.map((h, idx) => {
            if (idx !== currentHoleIndex) return h;
            const currentVal = h.scores?.[playerId] || 0;
            let nextVal;
            if (isExact) {
              nextVal = Math.max(0, deltaOrExact);
            } else {
              if (currentVal === 0) {
                nextVal = deltaOrExact > 0 ? h.par : Math.max(1, h.par - 1);
              } else {
                nextVal = Math.max(0, currentVal + deltaOrExact);
              }
            }
            return {
              ...h,
              scores: { ...h.scores, [playerId]: nextVal }
            };
          });
          return {
            ...prev,
            roundState: { ...prev.roundState, holes: holesCopy }
          };
        });
      };

      const updateCurrentHoleTranscript = (text) => {
        setAppState(prev => {
          const holesCopy = prev.roundState.holes.map((h, idx) =>
            idx === currentHoleIndex ? { ...h, voiceTranscript: text } : h
          );
          return {
            ...prev,
            roundState: { ...prev.roundState, holes: holesCopy }
          };
        });
      };

      const toggleVoiceDictation = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showToast("⚠️ Browser speech recognition not supported on this device.");
          return;
        }
        if (isListening) {
          setIsListening(false);
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        setIsListening(true);
        recognition.onresult = (event) => {
          const spoken = event.results[0][0].transcript;
          const existing = currentHole.voiceTranscript ? currentHole.voiceTranscript + " " : "";
          updateCurrentHoleTranscript(existing + spoken);
          setIsListening(false);
          showToast("🎙️ Voice note added to Hole #" + currentHole.number);
        };
        recognition.onerror = () => setIsListening(false);
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      // =======================================================================
      // TASK #2: IN-ROUND SCORE MEMORY CHECK (Last Time, Hole PB, Avg, Thru H#)
      // =======================================================================
      const courseHistoryRounds = useMemo(() => {
        return (history || [])
          .filter(r => r.courseName === roundState.courseName)
          .sort((a, b) => {
            if (b.date !== a.date) return b.date.localeCompare(a.date);
            return (b.id || 0) - (a.id || 0);
          });
      }, [history, roundState.courseName]);

      const getHoleMemoryForPlayer = (playerId, holeNumber, holePar) => {
        const holeEntries = [];
        for (const r of courseHistoryRounds) {
          const hObj = (r.holes || []).find(h => h.number === holeNumber);
          const sc = hObj?.scores?.[playerId];
          if (typeof sc === "number" && sc > 0) {
            const thruScore = (r.holes || [])
              .filter(h => h.number <= holeNumber)
              .reduce((sum, h) => sum + (h.scores?.[playerId] || 0), 0);

            holeEntries.push({
              score: sc,
              par: hObj.par || holePar || 3,
              date: r.date,
              thruScore,
              voiceTranscript: hObj.voiceTranscript || "",
              roundTotal: (r.players || []).find(p => p.id === playerId)?.total || null
            });
          }
        }
        if (holeEntries.length === 0) {
          return { hasHistory: false, last: null, best: null, avg: null, count: 0 };
        }
        const last = holeEntries[0];
        const bestScore = Math.min(...holeEntries.map(e => e.score));
        const avgScore = (holeEntries.reduce((acc, e) => acc + e.score, 0) / holeEntries.length).toFixed(1);
        return {
          hasHistory: true,
          last,
          best: bestScore,
          avg: avgScore,
          count: holeEntries.length
        };
      };

      const getCourseSummaryMemory = (playerId) => {
        const totals = [];
        for (const r of courseHistoryRounds) {
          const p = (r.players || []).find(pl => pl.id === playerId);
          if (p && typeof p.total === "number" && p.total > 0) {
            totals.push({ total: p.total, par: r.par || 27, date: r.date });
          }
        }
        if (!totals.length) return { hasHistory: false, lastRound: null, pbRound: null };
        const lastRound = totals[0];
        const pbRound = totals.reduce((min, cur) => (cur.total < min.total ? cur : min), totals[0]);
        return { hasHistory: true, lastRound, pbRound, plays: totals.length };
      };

      const livePlayerStats = useMemo(() => {
        const res = {};
        roster.forEach(p => {
          let strokes = 0;
          let parThru = 0;
          let holesScored = 0;
          roundState.holes.forEach(h => {
            const sc = h.scores?.[p.id] || 0;
            if (sc > 0) {
              strokes += sc;
              parThru += h.par;
              holesScored += 1;
            }
          });
          res[p.id] = {
            strokes,
            parThru,
            diff: strokes - parThru,
            holesScored
          };
        });
        return res;
      }, [roundState.holes, roster]);

      const formatRoundClipboardText = (roundObj) => {
        const coursePar = roundObj.par || roundObj.holes.reduce((s, h) => s + (h.par || 3), 0);
        const header = `🥏 ${roundObj.courseName} (${roundObj.date}) — Par ${coursePar} | ⏱️ ${roundObj.duration || "00:00:00"} | 🌬️ ${roundObj.windCondition || "calm"}`;
        const playerLines = (roundObj.players || []).map(p => {
          const diff = p.total - coursePar;
          return `• ${p.name} (${p.tag}): ${p.total} (${formatToPar(diff)})`;
        });
        const holeNums = roundObj.holes.map(h => `H${h.number}`).join("\t");
        const holePars = roundObj.holes.map(h => h.par).join("\t");
        const j1Scores = roundObj.holes.map(h => h.scores?.jeffery || "-").join("\t");
        const j2Scores = roundObj.holes.map(h => h.scores?.jack || "-").join("\t");
        return [
          header,
          ...playerLines,
          "",
          `Hole\t${holeNums}`,
          `Par\t${holePars}`,
          `Jeffery\t${j1Scores}`,
          `Jack\t${j2Scores}`
        ].join("\n");
      };

      const handleLogAndCopyRound = () => {
        const coursePar = roundState.holes.reduce((s, h) => s + (h.par || 3), 0);
        const j1Total = livePlayerStats.jeffery?.strokes || 0;
        const j2Total = livePlayerStats.jack?.strokes || 0;

        if (j1Total === 0 && j2Total === 0) {
          showToast("⚠️ Enter at least one hole score before logging the round!");
          return;
        }

        const newRound = {
          id: Date.now(),
          courseName: roundState.courseName,
          totalHoles: roundState.totalHoles,
          date: roundState.date || new Date().toISOString().slice(0, 10),
          duration: formatDurationMs(elapsedMs),
          par: coursePar,
          players: [
            { id: "jeffery", name: "Jeffery", tag: "J1", total: j1Total },
            { id: "jack", name: "Jack", tag: "J2", total: j2Total }
          ],
          holes: roundState.holes.map(h => ({
            number: h.number,
            par: h.par,
            distance: h.distance,
            scores: {
              jeffery: h.scores?.jeffery || 0,
              jack: h.scores?.jack || 0
            },
            ...(h.voiceTranscript ? { voiceTranscript: h.voiceTranscript } : {})
          })),
          gameMode: roundState.gameMode || "stroke",
          windCondition: roundState.windCondition || "calm",
          roundTranscript: roundState.roundTranscript || ""
        };

        const clipText = formatRoundClipboardText(newRound);
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(clipText).catch(() => {});
        }

        setAppState(prev => ({
          ...prev,
          history: [newRound, ...(prev.history || [])],
          timerState: { running: false, startTime: null, accumulatedMs: 0 }
        }));

        showToast("✅ Round Logged to History & Copied to Clipboard!");
      };

      const handleResetLiveCard = () => {
        const course = activeCourseObj;
        const todayStr = new Date().toISOString().slice(0, 10);
        setAppState(prev => ({
          ...prev,
          roundState: {
            ...prev.roundState,
            date: todayStr,
            currentHoleIndex: 0,
            roundTranscript: "",
            holes: course.holes.map(h => ({
              number: h.number,
              par: h.par,
              distance: h.distance,
              scores: { jeffery: 0, jack: 0 },
              meta: {},
              voiceTranscript: ""
            }))
          },
          timerState: { running: false, startTime: null, accumulatedMs: 0 }
        }));
        scrollToTop();
        showToast("🔄 Fresh scorecard ready!");
      };

      // =======================================================================
      // "YOU VS. YOURSELF" TELEMETRY COMPUTATION
      // =======================================================================
      const personalTelemetry = useMemo(() => {
        const computeForPlayer = (playerId) => {
          const courseMap = {};
          let totalRounds = 0;
          let totalHolesPlayed = 0;
          let birdies = 0;
          let pars = 0;
          let bogeys = 0;
          let doublePlus = 0;
          let best9Hole = null;
          let best18Hole = null;

          const chronological = [...(history || [])].sort((a, b) => {
            if (a.date !== b.date) return a.date.localeCompare(b.date);
            return (a.id || 0) - (b.id || 0);
          });

          chronological.forEach(r => {
            const pObj = (r.players || []).find(p => p.id === playerId);
            if (!pObj || !pObj.total) return;
            totalRounds += 1;

            const cPar = r.par || (r.holes || []).reduce((s, h) => s + (h.par || 3), 0);
            const diff = pObj.total - cPar;

            if (r.totalHoles === 9) {
              if (!best9Hole || pObj.total < best9Hole.total) {
                best9Hole = { total: pObj.total, diff, courseName: r.courseName, date: r.date };
              }
            } else if (r.totalHoles === 18) {
              if (!best18Hole || pObj.total < best18Hole.total) {
                best18Hole = { total: pObj.total, diff, courseName: r.courseName, date: r.date };
              }
            }

            if (!courseMap[r.courseName]) {
              courseMap[r.courseName] = {
                courseName: r.courseName,
                totalHoles: r.totalHoles,
                par: cPar,
                rounds: []
              };
            }
            courseMap[r.courseName].rounds.push({
              id: r.id,
              date: r.date,
              total: pObj.total,
              diff,
              duration: r.duration
            });

            (r.holes || []).forEach(h => {
              const sc = h.scores?.[playerId];
              if (typeof sc === "number" && sc > 0) {
                totalHolesPlayed += 1;
                const d = sc - (h.par || 3);
                if (d <= -1) birdies += 1;
                else if (d === 0) pars += 1;
                else if (d === 1) bogeys += 1;
                else doublePlus += 1;
              }
            });
          });

          const courseCards = Object.values(courseMap).map(c => {
            const scores = c.rounds.map(r => r.total);
            const pb = Math.min(...scores);
            const avg = (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1);
            const firstScore = c.rounds[0].total;
            const latestScore = c.rounds[c.rounds.length - 1].total;
            const strokeDropFromFirst = firstScore - pb;
            return {
              ...c,
              pb,
              pbDiff: pb - c.par,
              avg,
              firstScore,
              latestScore,
              strokeDropFromFirst
            };
          });

          return {
            totalRounds,
            totalHolesPlayed,
            birdies,
            pars,
            bogeys,
            doublePlus,
            best9Hole,
            best18Hole,
            courseCards
          };
        };

        return {
          jeffery: computeForPlayer("jeffery"),
          jack: computeForPlayer("jack")
        };
      }, [history]);

      const handleExportBackupJson = () => {
        const payload = {
          ...appState,
          version: "v64",
          exportDate: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `DG_Full_Backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("💾 Exported DG_Full_Backup JSON!");
      };

      const handleImportBackupJson = () => {
        try {
          const parsed = JSON.parse(importJsonText);
          if (!parsed.history || !parsed.bag) {
            showToast("⚠️ Invalid backup JSON structure.");
            return;
          }
          setAppState({
            ...INITIAL_USER_EXPORT,
            ...parsed,
            version: "v64"
          });
          setJsonModalOpen(false);
          setImportJsonText("");
          showToast("✅ Backup JSON Imported Successfully!");
        } catch (e) {
          showToast("⚠️ Could not parse JSON. Check syntax.");
        }
      };

      const jefferyCaddiePick = useMemo(
        () => getCaddiePick(bag, "jeffery", currentHole?.distance || 150, roundState.windCondition),
        [bag, currentHole, roundState.windCondition]
      );
      const jackCaddiePick = useMemo(
        () => getCaddiePick(bag, "jack", currentHole?.distance || 150, roundState.windCondition),
        [bag, currentHole, roundState.windCondition]
      );

      const filteredBinderDiscs = useMemo(() => {
        return bag.filter(d => {
          if (binderOwnerFilter !== "all" && d.ownerId !== binderOwnerFilter) return false;
          if (binderTierFilter !== "all" && d.speedTier !== binderTierFilter) return false;
          return true;
        });
      }, [bag, binderOwnerFilter, binderTierFilter]);

      return (
        <div className="min-h-screen bg-[#070b14] text-slate-100 flex flex-col">
          {/* ================================================================= */}
          {/* TOP HEADER BAR                                                    */}
          {/* ================================================================= */}
          <header className="sticky top-0 z-40 bg-[#070b14]/95 backdrop-blur-md border-b border-slate-800 px-3 py-2.5">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-700 flex items-center justify-center shadow-lg shadow-cyan-500/20 font-orbitron font-black text-sm text-white">
                  199X
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <h1 className="font-orbitron font-black text-sm sm:text-base tracking-wide text-white">
                      JEFFERY & JACK DG
                    </h1>
                    <span className="bg-amber-400 text-black font-orbitron font-black text-[10px] px-1.5 py-0.5 rounded">
                      v64
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 truncate max-w-[180px] sm:max-w-xs">
                    {roundState.courseName} • {roundState.totalHoles} Holes
                  </p>
                </div>

                  </button>
                </div>

                <div className="flex flex-wrap gap-2">
                  <button
                    onClick={handleExportBackupJson}
                    className="bg-cyan-400 text-black font-orbitron font-bold text-xs px-3 py-2 rounded-xl"
                  >
                    ⬇️ Download Full JSON Backup
                  </button>
                  <button
                    onClick={() => {
                      localStorage.removeItem(STORAGE_KEY);
                      setAppState(INITIAL_USER_EXPORT);
                      setJsonModalOpen(false);
                      showToast("🔄 Synced to baked v64 INITIAL_USER_EXPORT!");
                    }}
                    className="bg-amber-400 text-black font-orbitron font-bold text-xs px-3 py-2 rounded-xl"
                  >
                    🔄 Restore Baked v64 Defaults
                  </button>
                </div>

                <div>
                  <label className="text-[10px] font-orbitron uppercase text-slate-400 block mb-1">
                    Or Paste DG_Full_Backup JSON to Import:
                  </label>
                  <textarea
                    rows={5}
                    value={importJsonText}
                    onChange={(e) => setImportJsonText(e.target.value)}
                    placeholder='Paste {"app": "Jeffery & Jack Disc Golf Scorecard", ...} here'
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs font-mono-code text-slate-200"
                  />
                  <button
                    onClick={handleImportBackupJson}
                    className="mt-2 w-full bg-emerald-400 text-black font-orbitron font-bold text-xs py-2 rounded-xl"
                  >
                    📥 Import Pasted JSON
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* TASK #1: STRICTLY FIXED BOTTOM MOBILE NAVIGATION BAR              */}
          {/* ================================================================= */}
          <nav className="fixed-bottom-nav">
            <div className="max-w-4xl mx-auto grid grid-cols-5 h-16 px-2">
              {[
                { id: "play", icon: "🥏", label: "Scorecard" },
                { id: "binder", icon: "🃏", label: "3D Binder" },
                { id: "stats", icon: "📈", label: "Telemetry" },
                { id: "history", icon: "📜", label: "History" },
                { id: "courses", icon: "🗺️", label: "Courses" }
              ].map(item => {
                const active = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => handleTabChange(item.id)}
                    className={`flex flex-col items-center justify-center gap-0.5 transition ${
                      active ? "text-cyan-300" : "text-slate-400 hover:text-slate-200"
                    }`}
                  >
                    <span className={`text-lg transition ${active ? "scale-110" : ""}`}>
                      {item.icon}
                    </span>
                    <span className="font-orbitron text-[10px] font-bold tracking-tight">
                      {item.label}
                    </span>
                    {active && (
                      <span className="w-6 h-0.5 rounded-full bg-cyan-400 mt-0.5" />
                    )}
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
