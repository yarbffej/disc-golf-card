    // ============================================================================
    // VIEW 6: SYNC, ROSTER & BACKUP
    // ============================================================================
    function SyncAndRosterView({
      roster,
      setRoster,
      activePlayerIds,
      onToggleActivePlayer,
      webhookUrl,
      setWebhookUrl,
      onExportJsonPayload,
      onImportJsonPayload,
      onResetToFactoryData
    }) {
      const [newPlayerName, setNewPlayerName] = useState('');
      const [newPlayerTag, setNewPlayerTag] = useState('');
      const [statusMessage, setStatusMessage] = useState(null);
      const [copiedClipboard, setCopiedClipboard] = useState(false);

      const handleAddPlayer = (e) => {
        e.preventDefault();
        if (!newPlayerName.trim()) return;
        const id = newPlayerName.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        if (roster.some((r) => r.id === id)) return;
        const created = {
          id,
          name: newPlayerName.trim(),
          tag: newPlayerTag.trim().toUpperCase() || newPlayerName.trim().slice(0, 2).toUpperCase(),
          color: 'emerald-600'
        };
        setRoster((prev) => [...prev, created]);
        setNewPlayerName('');
        setNewPlayerTag('');
        setStatusMessage({ type: 'success', text: `Added ${created.name} (${created.tag}) to roster.` });
      };

      const handleDownloadJson = () => {
        const payload = onExportJsonPayload();
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `DG_Full_Backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        setStatusMessage({ type: 'success', text: 'Downloaded JSON backup file.' });
      };

      const handleCopyJson = async () => {
        const payload = onExportJsonPayload();
        await navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
        setCopiedClipboard(true);
        setTimeout(() => setCopiedClipboard(false), 2500);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const result = onImportJsonPayload(String(ev.target?.result || ''));
          setStatusMessage({ type: result.ok ? 'success' : 'error', text: result.message });
        };
        reader.readAsText(file);
      };

      return (
        <div className="space-y-6">
          {statusMessage && (
            <div className="neon-card p-4 rounded-2xl border-2 border-[#39FF14] text-sm font-bold text-white flex justify-between">
              <span>{statusMessage.text}</span>
              <button onClick={() => setStatusMessage(null)} className="underline">Dismiss</button>
            </div>
          )}

          {/* Roster Management */}
          <div className="neon-card rounded-2xl border border-slate-800 p-5 space-y-4">
            <h2 className="text-xl font-extrabold text-white">Player Roster & Active Card Selection</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {roster.map((player) => {
                const isActive = activePlayerIds.includes(player.id);
                return (
                  <div key={player.id} className="sub-tile p-3.5 rounded-xl border border-slate-800 flex items-center justify-between">
                    <div className="font-extrabold text-base text-white">
                      {player.tag} · {player.name}
                    </div>
                    <button
                      onClick={() => onToggleActivePlayer(player.id)}
                      className={`px-3.5 py-2 rounded-lg text-xs sm:text-sm font-extrabold ${
                        isActive ? 'bg-[#39FF14] text-slate-950' : 'sub-control text-slate-400'
                      }`}
                    >
                      {isActive ? 'Active on Card ✓' : 'Add to Card'}
                    </button>
                  </div>
                );
              })}
            </div>

            <form onSubmit={handleAddPlayer} className="flex flex-wrap gap-2.5 pt-2">
              <input
                type="text"
                value={newPlayerName}
                onChange={(e) => setNewPlayerName(e.target.value)}
                placeholder="New player name (e.g. Zack)"
                className="sub-control h-11 px-3.5 rounded-xl border border-slate-700 text-white text-sm font-bold"
              />
              <input
                type="text"
                value={newPlayerTag}
                onChange={(e) => setNewPlayerTag(e.target.value)}
                placeholder="Tag (Z1)"
                className="sub-control w-24 h-11 px-3.5 rounded-xl border border-slate-700 text-white text-sm font-bold uppercase"
              />
              <button type="submit" className="keep-white h-11 px-5 rounded-xl bg-[#FF2E93] text-white text-sm font-extrabold">
                + Add Player
              </button>
            </form>
          </div>

          {/* JSON Backup Export / Import */}
          <div className="neon-card rounded-2xl border border-slate-800 p-5 space-y-4">
            <h2 className="text-xl font-extrabold text-white">JSON Data Export & Import (Phone ↔ Laptop)</h2>
            <div className="flex flex-wrap gap-3">
              <button
                onClick={handleDownloadJson}
                className="px-4 py-2.5 rounded-xl bg-[#00F0FF] text-slate-950 font-extrabold text-sm"
              >
                ⬇ Download .JSON Backup
              </button>
              <button
                onClick={handleCopyJson}
                className="sub-control px-4 py-2.5 rounded-xl border border-slate-700 text-white font-extrabold text-sm"
              >
                {copiedClipboard ? '✓ Copied JSON!' : '📋 Copy JSON to Clipboard'}
              </button>
              <label className="px-4 py-2.5 rounded-xl bg-[#39FF14] text-slate-950 font-extrabold text-sm cursor-pointer">
                ⬆ Upload .JSON File
                <input type="file" accept=".json" onChange={handleFileUpload} className="hidden" />
              </label>
              <button
                onClick={onResetToFactoryData}
                className="sub-control px-4 py-2.5 rounded-xl border border-slate-700 text-slate-400 font-extrabold text-sm"
              >
                ↺ Restore Baseline Snapshot
              </button>
            </div>
          </div>

          {/* Webhook URL */}
          <div className="neon-card rounded-2xl border border-slate-800 p-5 space-y-2">
            <h2 className="text-lg font-extrabold text-white">Google Sheets / Drive Webhook URL</h2>
            <input
              type="url"
              value={webhookUrl}
              onChange={(e) => setWebhookUrl(e.target.value)}
              className="sub-control w-full h-11 px-3.5 rounded-xl border border-slate-700 font-mono-tabular text-sm text-white"
            />
          </div>
        </div>
      );
    }

    // ============================================================================
    // MAIN APP COMPONENT
    // ============================================================================
    const STORAGE_KEY = 'jj_disc_golf_v46_hub_state';
    const THEME_STORAGE_KEY = 'jj_disc_golf_bg_theme';

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [focusedDiscId, setFocusedDiscId] = useState(null);
      const [bagOwnerFilter, setBagOwnerFilter] = useState('jeffery');
      const [bgTheme, setBgTheme] = useState(() => localStorage.getItem(THEME_STORAGE_KEY) || 'white');

      useEffect(() => {
        try { localStorage.setItem(THEME_STORAGE_KEY, bgTheme); } catch {}
      }, [bgTheme]);

      const [history, setHistory] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.history) && parsed.history.length > 0) return parsed.history;
          }
        } catch {}
        return INITIAL_USER_EXPORT.history;
      });

      const [roster, setRoster] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.roster) && parsed.roster.length > 0) return parsed.roster;
          }
        } catch {}
        return INITIAL_USER_EXPORT.roster;
      });

      const [courses, setCourses] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.courses) && parsed.courses.length >= 16) return parsed.courses;
          }
        } catch {}
        return INITIAL_COURSE_TEMPLATES;
      });

      const [bag, setBag] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.bag) && parsed.bag.length > 0) return parsed.bag;
          }
        } catch {}
        return INITIAL_DISC_BAG;
      });

      const [roundState, setRoundState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.roundState && Array.isArray(parsed.roundState.holes)) return parsed.roundState;
          }
        } catch {}
        return INITIAL_USER_EXPORT.roundState;
      });

      const [webhookUrl, setWebhookUrl] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (typeof parsed.webhookUrl === 'string') return parsed.webhookUrl;
          }
        } catch {}
        return INITIAL_USER_EXPORT.webhookUrl;
      });

      const [timerState, setTimerState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.timerState) return parsed.timerState;
          }
        } catch {}
        return INITIAL_USER_EXPORT.timerState;
      });

      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [webhookSyncStatus, setWebhookSyncStatus] = useState('idle');

      useEffect(() => {
        try {
          const payload = {
            app: 'Jeffery & Jack Disc Golf Scorecard',
            version: 'v47',
            exportDate: new Date().toISOString(),
            history,
            roster,
            roundState,
            webhookUrl,
            timerState,
            courses,
            bag
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch {}
      }, [history, roster, roundState, webhookUrl, timerState, courses, bag]);

      useEffect(() => {
        const computeSeconds = () => {
          const extra = timerState.running && timerState.startTime ? Date.now() - timerState.startTime : 0;
          return Math.floor((timerState.accumulatedMs + extra) / 1000);
        };
        setElapsedSeconds(computeSeconds());
        if (!timerState.running) return;
        const interval = setInterval(() => setElapsedSeconds(computeSeconds()), 1000);
        return () => clearInterval(interval);
      }, [timerState]);

      const handleToggleTimer = () => {
        setTimerState((prev) => {
          if (prev.running) {
            const delta = prev.startTime ? Date.now() - prev.startTime : 0;
            return { running: false, startTime: null, accumulatedMs: prev.accumulatedMs + delta };
          }
          return { running: true, startTime: Date.now(), accumulatedMs: prev.accumulatedMs };
        });
      };

      const handleResetTimer = () => {
        setTimerState({ running: false, startTime: null, accumulatedMs: 0 });
        setElapsedSeconds(0);
      };

      const handleSwitchCourse = (courseKey) => {
        const template = courses.find((c) => c.key === courseKey);
        if (!template) return;
        const activeIds = roundState.activePlayerIds || roster.map((r) => r.id);
        setRoundState({
          courseKey: template.key,
          courseName: template.name,
          totalHoles: template.totalHoles,
          date: new Date().toISOString().slice(0, 10),
          currentHoleIndex: 0,
          activePlayerIds: activeIds,
          gameMode: roundState.gameMode || 'stroke',
          windCondition: roundState.windCondition || 'calm',
          roundTranscript: '',
          holes: template.holes.map((h) => ({
            number: h.number,
            par: h.par,
            distance: h.distance,
            scores: Object.fromEntries(activeIds.map((id) => [id, 0]))
          }))
        });
        handleResetTimer();
      };

      const handleStartConfiguredRound = (params) => {
        const template = courses.find((c) => c.key === params.courseKey) || courses[0];
        const activeIds = roundState.activePlayerIds || roster.map((r) => r.id);
        setRoundState({
          courseKey: template.key,
          courseName: template.name,
          totalHoles: template.totalHoles,
          date: new Date().toISOString().slice(0, 10),
          currentHoleIndex: 0,
          activePlayerIds: activeIds,
          gameMode: roundState.gameMode || 'stroke',
          windCondition: params.windCondition,
          voiceRecordingConfirmed: params.voiceRecordingConfirmed,
          roundTranscript: '',
          holes: template.holes.map((h) => ({
            number: h.number,
            par: h.par,
            distance: h.distance,
            scores: Object.fromEntries(activeIds.map((id) => [id, 0]))
          }))
        });
        handleResetTimer();
        setActiveTab('live');
      };

      const handleReplayHistoricalCourse = (round) => {
        const activeIds = roundState.activePlayerIds || roster.map((r) => r.id);
        const matchedTemplate = courses.find((c) => c.name.toLowerCase() === round.courseName.toLowerCase());
        setRoundState({
          courseKey: matchedTemplate?.key || 'sarko',
          courseName: round.courseName,
          totalHoles: round.totalHoles,
          date: new Date().toISOString().slice(0, 10),
          currentHoleIndex: 0,
          activePlayerIds: activeIds,
          gameMode: 'stroke',
          windCondition: round.windCondition || 'calm',
          roundTranscript: '',
          holes: round.holes.map((h) => ({
            number: h.number,
            par: h.par,
            distance: h.distance,
            scores: Object.fromEntries(activeIds.map((id) => [id, 0]))
          }))
        });
        handleResetTimer();
        setActiveTab('live');
      };

      const syncRoundToWebhook = async (round) => {
        if (!webhookUrl) return;
        setWebhookSyncStatus('syncing');
        try {
          await fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(round)
          });
          setWebhookSyncStatus('success');
          setTimeout(() => setWebhookSyncStatus('idle'), 3000);
        } catch {
          setWebhookSyncStatus('error');
          setTimeout(() => setWebhookSyncStatus('idle'), 4000);
        }
      };

      const handleSaveFinishedRound = async (syncToWebhook) => {
        const activeIds = roundState.activePlayerIds || roster.map((r) => r.id);
        const activeRoster = roster.filter((r) => activeIds.includes(r.id));
        const hrs = Math.floor(elapsedSeconds / 3600);
        const mins = Math.floor((elapsedSeconds % 3600) / 60);
        const secs = elapsedSeconds % 60;
        const durationFormatted = elapsedSeconds > 0
          ? [hrs, mins, secs].map((v) => String(v).padStart(2, '0')).join(':')
          : '00:28:00';
        const coursePar = roundState.holes.reduce((acc, h) => acc + h.par, 0);
        const finalizedHoles = roundState.holes.map((h) => {
          const nextScores = {};
          for (const p of activeRoster) {
            nextScores[p.id] = h.scores && h.scores[p.id] > 0 ? h.scores[p.id] : h.par;
          }
          return { ...h, scores: nextScores };
        });
        const playersSummary = activeRoster.map((p) => ({
          id: p.id,
          name: p.name,
          tag: p.tag,
          total: finalizedHoles.reduce((sum, h) => sum + (h.scores[p.id] || h.par), 0)
        }));
        const newHistoricalRound = {
          id: Date.now(),
          courseName: roundState.courseName,
          totalHoles: roundState.totalHoles,
          date: roundState.date || new Date().toISOString().slice(0, 10),
          duration: durationFormatted,
          par: coursePar,
          players: playersSummary,
          holes: finalizedHoles,
          gameMode: roundState.gameMode,
          windCondition: roundState.windCondition || 'calm',
          roundTranscript: roundState.roundTranscript || ''
        };
        setHistory((prev) => [newHistoricalRound, ...prev]);
        if (syncToWebhook) await syncRoundToWebhook(newHistoricalRound);
        setRoundState((prev) => ({
          ...prev,
          currentHoleIndex: 0,
          date: new Date().toISOString().slice(0, 10),
          roundTranscript: '',
          holes: prev.holes.map((h) => ({
            ...h,
            scores: Object.fromEntries(activeIds.map((id) => [id, 0])),
            meta: {},
            voiceTranscript: ''
          }))
        }));
        handleResetTimer();
      };

      const handleToggleActivePlayer = (playerId) => {
        setRoundState((prev) => {
          const currentIds = prev.activePlayerIds || roster.map((r) => r.id);
          const exists = currentIds.includes(playerId);
          if (exists && currentIds.length <= 1) return prev;
          const nextIds = exists ? currentIds.filter((id) => id !== playerId) : [...currentIds, playerId];
          return { ...prev, activePlayerIds: nextIds };
        });
      };

      const handleExportJsonPayload = () => ({
        app: 'Jeffery & Jack Disc Golf Scorecard',
        version: 'v47',
        exportDate: new Date().toISOString(),
        history,
        roster,
        roundState,
        webhookUrl,
        timerState,
        courses,
        bag
      });

      const handleImportJsonPayload = (rawJson) => {
        try {
          const parsed = JSON.parse(rawJson);
          if (!parsed || !Array.isArray(parsed.history)) {
            return { ok: false, message: 'Invalid JSON: missing "history" array.' };
          }
          setHistory(parsed.history);
          if (Array.isArray(parsed.roster)) setRoster(parsed.roster);
          if (parsed.roundState && Array.isArray(parsed.roundState.holes)) setRoundState(parsed.roundState);
          if (typeof parsed.webhookUrl === 'string') setWebhookUrl(parsed.webhookUrl);
          if (Array.isArray(parsed.courses)) setCourses(parsed.courses);
          if (Array.isArray(parsed.bag) && parsed.bag[0]?.speedTier) setBag(parsed.bag);
          return { ok: true, message: `Successfully imported ${parsed.history.length} rounds into your scorecard!` };
        } catch {
          return { ok: false, message: 'Could not parse JSON string.' };
        }
      };

      const handleResetToFactoryData = () => {
        setHistory(INITIAL_USER_EXPORT.history);
        setRoster(INITIAL_USER_EXPORT.roster);
        setRoundState(INITIAL_USER_EXPORT.roundState);
        setWebhookUrl(INITIAL_USER_EXPORT.webhookUrl);
        setCourses(INITIAL_COURSE_TEMPLATES);
        setBag(INITIAL_DISC_BAG);
        handleResetTimer();
      };

      const themeClass =
        bgTheme === 'white'
          ? 'theme-white'
          : bgTheme === 'adventure'
          ? 'theme-adventure'
          : bgTheme === 'turf'
          ? 'theme-turf'
          : 'theme-midnight';

      return (
        <div className={`${themeClass} min-h-screen pb-24 transition-colors duration-200`}>
          {/* Top Bar */}
          <header className="bg-[#080B14]/95 border-b border-slate-800 px-4 py-3.5 sticky top-0 z-40 backdrop-blur-md">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              <a
                href="#home"
                onClick={(e) => { e.preventDefault(); setActiveTab('home'); }}
                className="font-display text-lg sm:text-xl font-extrabold tracking-normal whitespace-nowrap shrink-0 text-white"
              >
                Jeffery & <span className="text-[#FF2E93]">Jack</span> Disc Golf
              </a>

              <nav className="hidden md:flex items-center gap-7 text-sm font-extrabold text-slate-300">
                <button
                  onClick={() => setActiveTab('home')}
                  className={`py-1 border-b-2 ${activeTab === 'home' ? 'border-[#39FF14] text-[#39FF14]' : 'border-transparent hover:text-white'}`}
                >
                  Home Hub
                </button>
                <button
                  onClick={() => setActiveTab('live')}
                  className={`py-1 border-b-2 ${activeTab === 'live' ? 'border-[#FF2E93] text-[#FF2E93]' : 'border-transparent hover:text-white'}`}
                >
                  Live Scorecard
                </button>
                <button
                  onClick={() => setActiveTab('courses')}
                  className={`py-1 border-b-2 ${activeTab === 'courses' ? 'border-[#00F0FF] text-[#00F0FF]' : 'border-transparent hover:text-white'}`}
                >
                  Bag & Flight Lab
                </button>
                <button
                  onClick={() => setActiveTab('history')}
                  className={`py-1 border-b-2 ${activeTab === 'history' || activeTab === 'rivalry' ? 'border-[#FACC15] text-[#FACC15]' : 'border-transparent hover:text-white'}`}
                >
                  Round & Course History
                </button>
              </nav>

              <button
                onClick={() => setActiveTab('sync')}
                className={`px-4 py-2 text-xs sm:text-sm font-extrabold rounded-xl ${
                  activeTab === 'sync' ? 'bg-[#39FF14] text-slate-950' : 'bg-[#FF2E93] text-white'
                }`}
              >
                Data & Roster
              </button>
            </div>
          </header>

          {/* Main Content Container */}
          <main className="max-w-7xl mx-auto px-3.5 sm:px-6 py-5 space-y-5">
            {/* High-Contrast Theme & Backdrop Switcher Card */}
            <div className="neon-card border border-slate-800 rounded-2xl p-3.5 sm:px-5 flex flex-wrap items-center justify-between gap-3">
              <span className="text-sm font-extrabold text-white flex items-center gap-2">
                <span>🎨 Theme & Backdrop:</span>
              </span>
              <div className="flex flex-wrap gap-2">
                {[
                  { id: 'white', label: 'Indigo + White Tiles' },
                  { id: 'adventure', label: 'Pink/Blue + White Tiles' },
                  { id: 'turf', label: 'Fairway + White Tiles' },
                  { id: 'midnight', label: 'Midnight Dark Tiles' }
                ].map((mode) => {
                  const isActive = bgTheme === mode.id;
                  return (
                    <button
                      key={mode.id}
                      onClick={() => setBgTheme(mode.id)}
                      className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-extrabold border-2 transition-all ${
                        isActive
                          ? 'keep-white bg-[#FF2E93] text-white border-[#FF2E93] shadow-sm'
                          : 'sub-control text-white border-slate-700 hover:border-[#00F0FF]'
                      }`}
                    >
                      {mode.label}
                    </button>
                  );
                })}
              </div>
            </div>

            {activeTab === 'home' && (
              <HomeHubView
                courses={courses}
                bag={bag}
                history={history}
                roundState={roundState}
                onStartConfiguredRound={handleStartConfiguredRound}
                onResumeLiveRound={() => setActiveTab('live')}
                onNavigateTab={(tab, ownerFilter) => {
                  if (ownerFilter) setBagOwnerFilter(ownerFilter);
                  setActiveTab(tab);
                }}
              />
            )}

            {activeTab === 'live' && (
              <LiveScorecardView
                roundState={roundState}
                setRoundState={setRoundState}
                roster={roster}
                history={history}
                courses={courses}
                bag={bag}
                timerState={timerState}
                elapsedSeconds={elapsedSeconds}
                onToggleTimer={handleToggleTimer}
                onResetTimer={handleResetTimer}
                onSwitchCourse={handleSwitchCourse}
                onSaveFinishedRound={handleSaveFinishedRound}
                webhookSyncStatus={webhookSyncStatus}
                onOpenBagGuide={(discId, ownerFilter) => {
                  if (discId) setFocusedDiscId(discId);
                  if (ownerFilter) setBagOwnerFilter(ownerFilter);
                  setActiveTab('courses');
                }}
              />
            )}

            {activeTab === 'courses' && (
              <CoursesAndBagView
                courses={courses}
                setCourses={setCourses}
                bag={bag}
                setBag={setBag}
                history={history}
                roster={roster}
                onStartRoundAtCourse={(courseKey) => {
                  handleSwitchCourse(courseKey);
                  setActiveTab('live');
                }}
                initialSelectedDiscId={focusedDiscId}
                initialBagOwnerFilter={bagOwnerFilter}
              />
            )}

            {activeTab === 'rivalry' && (
              <div className="space-y-4">
                <div className="flex justify-end">
                  <button
                    onClick={() => setActiveTab('history')}
                    className="sub-control px-4 py-2.5 rounded-xl border border-slate-700 text-xs sm:text-sm font-extrabold text-white"
                  >
                    Switch to Completed Round Scorecards →
                  </button>
                </div>
                <RivalryAnalyticsView history={history} roster={roster} />
              </div>
            )}

            {activeTab === 'history' && (
              <div className="space-y-4">
                <div className="flex justify-end">
                  <button
                    onClick={() => setActiveTab('rivalry')}
                    className="px-4 py-2.5 rounded-xl bg-[#00F0FF] text-slate-950 text-xs sm:text-sm font-extrabold"
                  >
                    View Course Records & Jeffery vs. Jack Rivalry Stats →
                  </button>
                </div>
                <RoundHistoryView
                  history={history}
                  roster={roster}
                  bag={bag}
                  onDeleteRound={(id) => setHistory((prev) => prev.filter((item) => item.id !== id))}
                  onReplayCourse={handleReplayHistoricalCourse}
                  onSyncSingleRoundToWebhook={syncRoundToWebhook}
                />
              </div>
            )}

            {activeTab === 'sync' && (
              <SyncAndRosterView
                roster={roster}
                setRoster={setRoster}
                activePlayerIds={roundState.activePlayerIds || roster.map((r) => r.id)}
                onToggleActivePlayer={handleToggleActivePlayer}
                webhookUrl={webhookUrl}
                setWebhookUrl={setWebhookUrl}
                onExportJsonPayload={handleExportJsonPayload}
                onImportJsonPayload={handleImportJsonPayload}
                onResetToFactoryData={handleResetToFactoryData}
              />
            )}
          </main>

          {/* Mobile Fixed Bottom Thumb-Zone Navigation Bar */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#080B14]/95 border-t border-slate-800 grid grid-cols-5 md:hidden pb-[env(safe-area-inset-bottom)]">
            {[
              { id: 'home', label: 'Home Hub', icon: '🏠', color: 'text-[#39FF14]' },
              { id: 'live', label: 'Play Round', icon: '📋', color: 'text-[#FF2E93]' },
              { id: 'courses', label: 'Bags & Lab', icon: '🛸', color: 'text-[#00F0FF]' },
              { id: 'history', label: 'History', icon: '🕒', color: 'text-[#FACC15]' },
              { id: 'rivalry', label: 'Stats', icon: '🏆', color: 'text-[#C026D3]' }
            ].map((item) => {
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`min-h-[56px] flex flex-col items-center justify-center text-xs transition-colors ${
                    isActive ? `${item.color} font-extrabold` : 'text-slate-300'
                  }`}
                >
                  <span className="text-lg leading-none mb-0.5">{item.icon}</span>
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
