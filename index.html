<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>DG Scorecard - Jeffery & Jack</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* iOS Notch & Safe Area Support */
    :root {
      --sat: env(safe-area-inset-top, 20px);
      --sab: env(safe-area-inset-bottom, 20px);
    }
    body {
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .safe-top-padding {
      padding-top: calc(var(--sat) + 0.5rem);
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .custom-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased overflow-x-hidden pb-24">

  <!-- Top Sticky Header -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-blue-900/40 px-4 py-2.5 shadow-lg">
    <div class="flex items-center justify-between gap-2 max-w-lg mx-auto">
      <button onclick="openCourseModal()" class="flex items-center gap-2 text-left truncate group py-1">
        <div class="w-8 h-8 rounded-lg bg-blue-600/20 text-blue-400 border border-blue-500/30 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-location-dot text-sm"></i>
        </div>
        <div class="truncate">
          <div class="flex items-center gap-1.5">
            <span id="headerCourseName" class="font-bold text-white text-sm tracking-tight truncate">Black Hoof Park</span>
            <i class="fa-solid fa-pen text-[10px] text-blue-400 opacity-60"></i>
          </div>
          <div id="headerDateTime" class="text-[11px] text-slate-400 font-medium">Today · Round in Progress</div>
        </div>
      </button>

      <div class="flex items-center gap-1.5 shrink-0">
        <!-- History Drawer Button -->
        <button onclick="openHistoryModal()" title="Past Rounds" class="w-8 h-8 rounded-lg bg-slate-800 text-blue-400 border border-slate-700 flex items-center justify-center active:scale-95 transition">
          <i class="fa-solid fa-clock-rotate-left text-xs"></i>
        </button>
        <!-- CSV / Sheets Export Button -->
        <button onclick="exportToSheets()" title="Export to Sheets" class="px-2.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold flex items-center gap-1.5 active:scale-95 shadow-sm transition border border-blue-400/40">
          <i class="fa-solid fa-file-excel text-xs"></i>
          <span>Sheets</span>
        </button>
      </div>
    </div>

    <!-- Match Differential Status Ticker -->
    <div class="mt-2 pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs max-w-lg mx-auto px-1">
      <div id="matchStatusText" class="font-bold text-sky-400 flex items-center gap-1.5">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>All Square</span>
      </div>
      <div class="flex items-center gap-3 font-semibold text-slate-300">
        <span class="flex items-center gap-1">
          <span class="text-slate-400 font-normal">Jeffery:</span>
          <span id="tickerScoreJeffery" class="text-white bg-slate-800 px-1.5 py-0.5 rounded text-[11px]">E</span>
        </span>
        <span class="text-slate-600">|</span>
        <span class="flex items-center gap-1">
          <span class="text-slate-400 font-normal">Jack:</span>
          <span id="tickerScoreJack" class="text-white bg-slate-800 px-1.5 py-0.5 rounded text-[11px]">E</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Main Fairway Card Interface -->
  <main class="flex-1 px-3.5 py-3 max-w-lg mx-auto w-full flex flex-col gap-3">

    <!-- Hole Navigator Bar -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-2.5 flex items-center justify-between shadow-md">
      <button onclick="prevHole()" id="btnPrevHoleTop" class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 border border-slate-700 active:scale-90 flex items-center justify-center font-bold text-base disabled:opacity-30 disabled:pointer-events-none transition">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <div class="text-center">
        <div class="text-[10px] uppercase tracking-wider font-extrabold text-blue-400">HOLE</div>
        <div class="flex items-baseline justify-center gap-1">
          <span id="currentHoleLabel" class="text-2xl font-black text-white">1</span>
          <span class="text-xs text-slate-500 font-semibold">/ 18</span>
        </div>
      </div>

      <button onclick="nextHole()" id="btnNextHoleTop" class="w-10 h-10 rounded-xl bg-blue-600 text-white border border-blue-400/50 active:scale-90 flex items-center justify-center font-bold text-base transition shadow-sm">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- Hole Par & Distance Info Card -->
    <div class="grid grid-cols-2 gap-2.5">
      <!-- Par Setting -->
      <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-2.5 flex items-center justify-between shadow-sm">
        <div>
          <span class="text-[10px] font-bold uppercase text-slate-400 block tracking-wide">PAR</span>
          <span id="parDisplay" class="text-xl font-black text-white leading-tight">3</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="adjustPar(-1)" class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 font-bold active:scale-90 text-sm flex items-center justify-center">-</button>
          <button onclick="adjustPar(1)" class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 font-bold active:scale-90 text-sm flex items-center justify-center">+</button>
        </div>
      </div>

      <!-- Distance Setting -->
      <div class="bg-slate-900 border border-slate-800/80 rounded-xl p-2.5 flex items-center justify-between shadow-sm">
        <div>
          <span class="text-[10px] font-bold uppercase text-slate-400 block tracking-wide">DISTANCE</span>
          <div class="flex items-baseline gap-1">
            <span id="distanceDisplay" class="text-xl font-black text-white leading-tight">320</span>
            <span class="text-[10px] text-slate-400 font-semibold">ft</span>
          </div>
        </div>
        <button onclick="editDistance()" class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-blue-400 active:scale-90 flex items-center justify-center">
          <i class="fa-solid fa-pen-to-square text-xs"></i>
        </button>
      </div>
    </div>

    <!-- PLAYER 1: JEFFERY -->
    <div class="bg-slate-900 border-2 border-blue-600/40 rounded-2xl p-3.5 shadow-lg relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-blue-600/10 rounded-full blur-xl pointer-events-none"></div>
      
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-md bg-blue-600 text-white font-black text-[11px] flex items-center justify-center shadow">J1</span>
          <div>
            <h2 class="font-extrabold text-white text-base tracking-tight leading-none">Jeffery</h2>
            <span id="jefferyRelative" class="text-[11px] font-semibold text-slate-400">Total: 0 (E)</span>
          </div>
        </div>
        <div id="jefferyScoreBadge" class="px-2.5 py-0.5 rounded-full text-xs font-black bg-slate-800 text-slate-400 uppercase tracking-wider">
          Par
        </div>
      </div>

      <!-- Main Big Thumb Counter -->
      <div class="grid grid-cols-5 items-center gap-2 my-2 bg-slate-950/70 p-2 rounded-xl border border-slate-800">
        <button onclick="adjustPlayerScore('jeffery', -1)" class="col-span-1 h-14 rounded-lg bg-slate-800 active:bg-slate-700 border border-slate-700 text-slate-200 text-2xl font-black active:scale-95 flex items-center justify-center shadow-inner">
          <i class="fa-solid fa-minus"></i>
        </button>
        <div class="col-span-3 text-center">
          <span id="jefferyHoleScore" class="text-4xl font-black text-white leading-none tracking-tight">3</span>
          <span class="block text-[10px] text-slate-400 uppercase font-bold tracking-widest mt-0.5">Throws</span>
        </div>
        <button onclick="adjustPlayerScore('jeffery', 1)" class="col-span-1 h-14 rounded-lg bg-blue-600 active:bg-blue-500 border border-blue-400 text-white text-2xl font-black active:scale-95 flex items-center justify-center shadow">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <!-- One-Tap Preset Buttons -->
      <div class="grid grid-cols-4 gap-1.5 mt-2">
        <button onclick="setPlayerScorePreset('jeffery', 1)" class="py-1.5 px-1 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-300 font-extrabold text-[11px] active:scale-95">Ace (1)</button>
        <button onclick="setPlayerScorePreset('jeffery', 'birdie')" class="py-1.5 px-1 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-extrabold text-[11px] active:scale-95">Birdie</button>
        <button onclick="setPlayerScorePreset('jeffery', 'par')" class="py-1.5 px-1 rounded-lg bg-blue-500/10 border border-blue-500/30 text-blue-300 font-extrabold text-[11px] active:scale-95">Par</button>
        <button onclick="setPlayerScorePreset('jeffery', 'bogey')" class="py-1.5 px-1 rounded-lg bg-orange-500/10 border border-orange-500/30 text-orange-400 font-extrabold text-[11px] active:scale-95">Bogey</button>
      </div>
    </div>

    <!-- PLAYER 2: JACK -->
    <div class="bg-slate-900 border-2 border-slate-800 rounded-2xl p-3.5 shadow-lg relative overflow-hidden">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-md bg-slate-700 text-sky-400 font-black text-[11px] flex items-center justify-center border border-slate-600">J2</span>
          <div>
            <h2 class="font-extrabold text-white text-base tracking-tight leading-none">Jack</h2>
            <span id="jackRelative" class="text-[11px] font-semibold text-slate-400">Total: 0 (E)</span>
          </div>
        </div>
        <div id="jackScoreBadge" class="px-2.5 py-0.5 rounded-full text-xs font-black bg-slate-800 text-slate-400 uppercase tracking-wider">
          Par
        </div>
      </div>

      <!-- Main Big Thumb Counter -->
      <div class="grid grid-cols-5 items-center gap-2 my-2 bg-slate-950/70 p-2 rounded-xl border border-slate-800">
        <button onclick="adjustPlayerScore('jack', -1)" class="col-span-1 h-14 rounded-lg bg-slate-800 active:bg-slate-700 border border-slate-700 text-slate-200 text-2xl font-black active:scale-95 flex items-center justify-center shadow-inner">
          <i class="fa-solid fa-minus"></i>
        </button>
        <div class="col-span-3 text-center">
          <span id="jackHoleScore" class="text-4xl font-black text-white leading-none tracking-tight">3</span>
          <span class="block text-[10px] text-slate-400 uppercase font-bold tracking-widest mt-0.5">Throws</span>
        </div>
        <button onclick="adjustPlayerScore('jack', 1)" class="col-span-1 h-14 rounded-lg bg-sky-600 active:bg-sky-500 border border-sky-400 text-white text-2xl font-black active:scale-95 flex items-center justify-center shadow">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <!-- One-Tap Preset Buttons -->
      <div class="grid grid-cols-4 gap-1.5 mt-2">
        <button onclick="setPlayerScorePreset('jack', 1)" class="py-1.5 px-1 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-300 font-extrabold text-[11px] active:scale-95">Ace (1)</button>
        <button onclick="setPlayerScorePreset('jack', 'birdie')" class="py-1.5 px-1 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-extrabold text-[11px] active:scale-95">Birdie</button>
        <button onclick="setPlayerScorePreset('jack', 'par')" class="py-1.5 px-1 rounded-lg bg-blue-500/10 border border-blue-500/30 text-blue-300 font-extrabold text-[11px] active:scale-95">Par</button>
        <button onclick="setPlayerScorePreset('jack', 'bogey')" class="py-1.5 px-1 rounded-lg bg-orange-500/10 border border-orange-500/30 text-orange-400 font-extrabold text-[11px] active:scale-95">Bogey</button>
      </div>
    </div>

  </main>

  <!-- Fixed Bottom Navigation Bar -->
  <footer class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-4 py-2.5 pb-[max(0.6rem,env(safe-area-inset-bottom))] shadow-2xl">
    <div class="max-w-lg mx-auto flex items-center gap-2">
      <button onclick="prevHole()" id="btnBottomPrev" class="flex-1 py-3 px-3 rounded-xl bg-slate-800 text-slate-300 font-bold text-sm active:scale-95 border border-slate-700 flex items-center justify-center gap-2 disabled:opacity-30">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        <span>Prev Hole</span>
      </button>

      <button onclick="openScorecardModal()" class="w-12 h-12 rounded-xl bg-slate-800 text-blue-400 border border-slate-700 flex flex-col items-center justify-center active:scale-95 shrink-0">
        <i class="fa-solid fa-table-cells text-base"></i>
        <span class="text-[9px] font-black uppercase mt-0.5">Card</span>
      </button>

      <button onclick="nextHole()" id="btnBottomNext" class="flex-1 py-3 px-3 rounded-xl bg-blue-600 text-white font-extrabold text-sm active:scale-95 border border-blue-400/40 flex items-center justify-center gap-2 shadow-md">
        <span id="nextHoleText">Next Hole</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </div>
  </footer>

  <!-- FULL SCORECARD & ROUND REVIEW MODAL -->
  <div id="modalScorecard" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex-col justify-end">
    <div class="bg-slate-900 border-t border-slate-800 rounded-t-3xl max-w-lg mx-auto w-full max-h-[90vh] flex flex-col overflow-hidden safe-top-padding">
      <div class="px-5 py-3 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h3 class="font-black text-lg text-white">Full Scorecard</h3>
          <p class="text-xs text-slate-400" id="modalCardSubtitle">18 Holes · Match Play</p>
        </div>
        <button onclick="closeScorecardModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="overflow-y-auto p-4 flex-1 custom-scroll space-y-4">
        <!-- Comparative Table -->
        <div class="overflow-x-auto rounded-xl border border-slate-800">
          <table class="w-full text-center text-xs">
            <thead class="bg-slate-950 text-slate-400 font-bold uppercase text-[10px]">
              <tr>
                <th class="py-2 px-2 text-left pl-3">Hole</th>
                <th class="py-2 px-1">Par</th>
                <th class="py-2 px-2 text-blue-400">Jeffery</th>
                <th class="py-2 px-2 text-sky-300">Jack</th>
                <th class="py-2 px-1 text-slate-500">Diff</th>
              </tr>
            </thead>
            <tbody id="scorecardTableBody" class="divide-y divide-slate-800/60 font-medium">
              <!-- Dynamically populated -->
            </tbody>
            <tfoot class="bg-slate-950/90 font-black text-white divide-y divide-slate-800">
              <tr id="totalRowFront"></tr>
              <tr id="totalRowBack"></tr>
              <tr id="totalRowFinal" class="text-sm bg-blue-950/40 text-blue-200"></tr>
            </tfoot>
          </table>
        </div>

        <!-- Export & Finish Round Actions -->
        <div class="grid grid-cols-2 gap-2 pt-2">
          <button onclick="exportToSheets()" class="py-3 px-4 rounded-xl bg-blue-600 active:bg-blue-500 text-white font-extrabold text-xs flex items-center justify-center gap-2 border border-blue-400/40 shadow-sm">
            <i class="fa-solid fa-file-csv text-base"></i>
            <span>Export to CSV / Sheets</span>
          </button>
          <button onclick="finishAndSaveRound()" class="py-3 px-4 rounded-xl bg-emerald-600 active:bg-emerald-500 text-white font-extrabold text-xs flex items-center justify-center gap-2 border border-emerald-400/40 shadow-sm">
            <i class="fa-solid fa-floppy-disk text-base"></i>
            <span>Save Round to History</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- COURSE & ROUND SETTINGS MODAL -->
  <div id="modalCourse" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-5 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="font-extrabold text-white text-base">Round Details</h3>
        <button onclick="closeCourseModal()" class="text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">Course Name</label>
        <input type="text" id="inputCourseName" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-sm focus:outline-none focus:border-blue-500" value="Black Hoof Park">
        
        <!-- Quick Course Chips -->
        <div class="flex flex-wrap gap-1.5 mt-2">
          <button onclick="selectCourseChip('Black Hoof Park')" class="text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700">Black Hoof</button>
          <button onclick="selectCourseChip('Shawnee Mission Park')" class="text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700">Shawnee Mission</button>
          <button onclick="selectCourseChip('Heritage Park')" class="text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700">Heritage Park</button>
          <button onclick="selectCourseChip('Rosedale Park')" class="text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700">Rosedale</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Date</label>
          <input type="date" id="inputRoundDate" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-white text-xs font-bold focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Tee Time</label>
          <input type="time" id="inputRoundTime" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-white text-xs font-bold focus:outline-none">
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="resetCurrentRound()" class="flex-1 py-2.5 rounded-xl bg-rose-600/20 text-rose-300 border border-rose-500/30 text-xs font-bold active:scale-95">Reset Round</button>
        <button onclick="saveCourseSettings()" class="flex-1 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-extrabold active:scale-95 shadow">Save</button>
      </div>
    </div>
  </div>

  <!-- SAVED HISTORY MODAL -->
  <div id="modalHistory" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex-col justify-end">
    <div class="bg-slate-900 border-t border-slate-800 rounded-t-3xl max-w-lg mx-auto w-full max-h-[80vh] flex flex-col overflow-hidden safe-top-padding">
      <div class="px-5 py-3 border-b border-slate-800 flex items-center justify-between">
        <h3 class="font-black text-lg text-white">Saved Round History</h3>
        <button onclick="closeHistoryModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="historyList" class="p-4 overflow-y-auto space-y-3 custom-scroll flex-1">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const TOTAL_HOLES = 18;
    const STORAGE_KEY = 'dg_round_v2';
    const HISTORY_KEY = 'dg_history_v2';

    // State
    let roundState = {
      courseName: 'Black Hoof Park',
      date: new Date().toISOString().split('T')[0],
      time: new Date().toTimeString().slice(0, 5),
      currentHoleIndex: 0,
      holes: Array.from({ length: TOTAL_HOLES }, (_, i) => ({
        number: i + 1,
        par: 3,
        distance: 280 + (i * 15 % 150),
        jeffery: 3,
        jack: 3,
        scored: false
      }))
    };

    // Load State
    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          roundState = JSON.parse(saved);
        } catch (e) {
          console.error("Storage parse error", e);
        }
      }
      renderHeader();
      renderCurrentHole();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(roundState));
      renderHeader();
    }

    // Render Fairway UI
    function renderCurrentHole() {
      const h = roundState.holes[roundState.currentHoleIndex];
      document.getElementById('currentHoleLabel').innerText = h.number;
      document.getElementById('parDisplay').innerText = h.par;
      document.getElementById('distanceDisplay').innerText = h.distance;

      // Scores
      document.getElementById('jefferyHoleScore').innerText = h.jeffery;
      document.getElementById('jackHoleScore').innerText = h.jack;

      // Badges
      updateBadge('jefferyScoreBadge', h.jeffery, h.par);
      updateBadge('jackScoreBadge', h.jack, h.par);

      // Bottom buttons
      document.getElementById('btnPrevHoleTop').disabled = roundState.currentHoleIndex === 0;
      document.getElementById('btnBottomPrev').disabled = roundState.currentHoleIndex === 0;

      const nextBtnText = document.getElementById('nextHoleText');
      if (roundState.currentHoleIndex === TOTAL_HOLES - 1) {
        nextBtnText.innerText = "Finish Round";
      } else {
        nextBtnText.innerText = "Next Hole";
      }

      calculateTotals();
    }

    function updateBadge(elementId, score, par) {
      const el = document.getElementById(elementId);
      const diff = score - par;
      if (score === 1) {
        el.innerText = "ACE 🎯";
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-amber-500/20 text-amber-300 border border-amber-500/40";
      } else if (diff <= -2) {
        el.innerText = "Eagle";
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
      } else if (diff === -1) {
        el.innerText = "Birdie";
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-emerald-600/30 text-emerald-400 border border-emerald-500/50";
      } else if (diff === 0) {
        el.innerText = "Par";
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-slate-800 text-slate-300 border border-slate-700";
      } else if (diff === 1) {
        el.innerText = "Bogey";
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-orange-600/20 text-orange-400 border border-orange-500/40";
      } else {
        el.innerText = `+${diff} Bogey`;
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-rose-600/20 text-rose-400 border border-rose-500/40";
      }
    }

    function adjustPlayerScore(player, delta) {
      const h = roundState.holes[roundState.currentHoleIndex];
      h[player] = Math.max(1, h[player] + delta);
      h.scored = true;
      saveState();
      renderCurrentHole();
    }

    function setPlayerScorePreset(player, type) {
      const h = roundState.holes[roundState.currentHoleIndex];
      if (type === 1) h[player] = 1;
      else if (type === 'birdie') h[player] = Math.max(1, h.par - 1);
      else if (type === 'par') h[player] = h.par;
      else if (type === 'bogey') h[player] = h.par + 1;
      h.scored = true;
      saveState();
      renderCurrentHole();
    }

    function adjustPar(delta) {
      const h = roundState.holes[roundState.currentHoleIndex];
      h.par = Math.max(2, Math.min(6, h.par + delta));
      saveState();
      renderCurrentHole();
    }

    function editDistance() {
      const h = roundState.holes[roundState.currentHoleIndex];
      const current = h.distance;
      const input = prompt("Enter hole distance in feet:", current);
      if (input !== null && !isNaN(parseInt(input))) {
        h.distance = parseInt(input);
        saveState();
        renderCurrentHole();
      }
    }

    function prevHole() {
      if (roundState.currentHoleIndex > 0) {
        roundState.currentHoleIndex--;
        saveState();
        renderCurrentHole();
      }
    }

    function nextHole() {
      if (roundState.currentHoleIndex < TOTAL_HOLES - 1) {
        roundState.currentHoleIndex++;
        saveState();
        renderCurrentHole();
      } else {
        openScorecardModal();
      }
    }

    function calculateTotals() {
      let jTot = 0, kTot = 0, parTot = 0;
      roundState.holes.forEach(h => {
        jTot += h.jeffery;
        kTot += h.jack;
        parTot += h.par;
      });

      const jDiff = jTot - parTot;
      const kDiff = kTot - parTot;

      const fmt = (diff) => diff === 0 ? 'E' : (diff > 0 ? `+${diff}` : `${diff}`);
      document.getElementById('jefferyRelative').innerText = `Total: ${jTot} (${fmt(jDiff)})`;
      document.getElementById('jackRelative').innerText = `Total: ${kTot} (${fmt(kDiff)})`;
      document.getElementById('tickerScoreJeffery').innerText = fmt(jDiff);
      document.getElementById('tickerScoreJack').innerText = fmt(kDiff);

      // Match Play Ticker
      const tickerStatus = document.getElementById('matchStatusText');
      if (jTot === kTot) {
        tickerStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span><span>All Square</span>';
      } else if (jTot < kTot) {
        const lead = kTot - jTot;
        tickerStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-400 inline-block"></span><span>Jeffery +${lead} up</span>`;
      } else {
        const lead = jTot - kTot;
        tickerStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-sky-400 inline-block"></span><span>Jack +${lead} up</span>`;
      }
    }

    // Modal Course Handlers
    function renderHeader() {
      document.getElementById('headerCourseName').innerText = roundState.courseName;
      document.getElementById('headerDateTime').innerText = `${roundState.date} · ${roundState.time}`;
    }

    function openCourseModal() {
      document.getElementById('inputCourseName').value = roundState.courseName;
      document.getElementById('inputRoundDate').value = roundState.date;
      document.getElementById('inputRoundTime').value = roundState.time;
      document.getElementById('modalCourse').classList.remove('hidden');
      document.getElementById('modalCourse').classList.add('flex');
    }

    function closeCourseModal() {
      document.getElementById('modalCourse').classList.add('hidden');
      document.getElementById('modalCourse').classList.remove('flex');
    }

    function selectCourseChip(name) {
      document.getElementById('inputCourseName').value = name;
    }

    function saveCourseSettings() {
      roundState.courseName = document.getElementById('inputCourseName').value || 'Disc Golf Course';
      roundState.date = document.getElementById('inputRoundDate').value || roundState.date;
      roundState.time = document.getElementById('inputRoundTime').value || roundState.time;
      saveState();
      renderHeader();
      closeCourseModal();
    }

    function resetCurrentRound() {
      if (confirm("Reset current round scores back to hole 1?")) {
        roundState.currentHoleIndex = 0;
        roundState.holes.forEach(h => {
          h.jeffery = h.par;
          h.jack = h.par;
          h.scored = false;
        });
        saveState();
        renderCurrentHole();
        closeCourseModal();
      }
    }

    // Full Scorecard Modal
    function openScorecardModal() {
      buildScorecardTable();
      document.getElementById('modalScorecard').classList.remove('hidden');
      document.getElementById('modalScorecard').classList.add('flex');
    }

    function closeScorecardModal() {
      document.getElementById('modalScorecard').classList.add('hidden');
      document.getElementById('modalScorecard').classList.remove('flex');
    }

    function buildScorecardTable() {
      const tbody = document.getElementById('scorecardTableBody');
      tbody.innerHTML = '';

      let frontPar = 0, frontJ = 0, frontK = 0;
      let backPar = 0, backJ = 0, backK = 0;

      roundState.holes.forEach((h, idx) => {
        if (idx < 9) {
          frontPar += h.par; frontJ += h.jeffery; frontK += h.jack;
        } else {
          backPar += h.par; backJ += h.jeffery; backK += h.jack;
        }

        const diff = h.jeffery - h.jack;
        const diffText = diff === 0 ? '-' : (diff < 0 ? `J ${Math.abs(diff)}` : `K ${diff}`);

        const tr = document.createElement('tr');
        tr.className = (idx === roundState.currentHoleIndex) ? 'bg-blue-900/30 font-bold' : '';
        tr.innerHTML = `
          <td class="py-2 px-2 text-left pl-3 text-slate-300">#${h.number}</td>
          <td class="py-2 px-1 text-slate-400">${h.par}</td>
          <td class="py-2 px-2 font-bold ${h.jeffery < h.jack ? 'text-blue-400' : 'text-slate-200'}">${h.jeffery}</td>
          <td class="py-2 px-2 font-bold ${h.jack < h.jeffery ? 'text-sky-300' : 'text-slate-200'}">${h.jack}</td>
          <td class="py-2 px-1 text-[11px] text-slate-400 font-semibold">${diffText}</td>
        `;
        tbody.appendChild(tr);
      });

      // Front 9 Row
      document.getElementById('totalRowFront').innerHTML = `
        <td class="py-2 px-2 text-left pl-3 text-slate-400">OUT (1-9)</td>
        <td class="py-2 px-1 text-slate-400">${frontPar}</td>
        <td class="py-2 px-2 text-blue-400">${frontJ}</td>
        <td class="py-2 px-2 text-sky-300">${frontK}</td>
        <td></td>
      `;

      // Back 9 Row
      document.getElementById('totalRowBack').innerHTML = `
        <td class="py-2 px-2 text-left pl-3 text-slate-400">IN (10-18)</td>
        <td class="py-2 px-1 text-slate-400">${backPar}</td>
        <td class="py-2 px-2 text-blue-400">${backJ}</td>
        <td class="py-2 px-2 text-sky-300">${backK}</td>
        <td></td>
      `;

      // Final Total
      const totPar = frontPar + backPar;
      const totJ = frontJ + backJ;
      const totK = frontK + backK;
      document.getElementById('totalRowFinal').innerHTML = `
        <td class="py-2.5 px-2 text-left pl-3 font-black text-white">TOTAL</td>
        <td class="py-2.5 px-1">${totPar}</td>
        <td class="py-2.5 px-2 font-black text-blue-400">${totJ} (${totJ - totPar > 0 ? '+' : ''}${totJ - totPar})</td>
        <td class="py-2.5 px-2 font-black text-sky-300">${totK} (${totK - totPar > 0 ? '+' : ''}${totK - totPar})</td>
        <td class="py-2.5 px-1 text-xs text-emerald-400 font-black">${totJ === totK ? 'TIE' : (totJ < totK ? 'JEFFERY' : 'JACK')}</td>
      `;
    }

    // Google Sheets / CSV Export Function
    function exportToSheets() {
      let csv = "Course,Date,Time,Hole,Par,Distance_ft,Jeffery_Score,Jack_Score,Hole_Winner\n";
      
      roundState.holes.forEach(h => {
        let winner = "Tie";
        if (h.jeffery < h.jack) winner = "Jeffery";
        else if (h.jack < h.jeffery) winner = "Jack";

        csv += `"${roundState.courseName}","${roundState.date}","${roundState.time}",${h.number},${h.par},${h.distance},${h.jeffery},${h.jack},"${winner}"\n`;
      });

      // Append Total Summary Row
      let totPar = roundState.holes.reduce((a, b) => a + b.par, 0);
      let totJ = roundState.holes.reduce((a, b) => a + b.jeffery, 0);
      let totK = roundState.holes.reduce((a, b) => a + b.jack, 0);
      let matchWinner = totJ === totK ? "Tied" : (totJ < totK ? "Jeffery Won" : "Jack Won");
      csv += `"${roundState.courseName} TOTAL","${roundState.date}","${roundState.time}","1-18",${totPar},-,${totJ},${totK},"${matchWinner}"\n`;

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const filename = `${roundState.courseName.replace(/\s+/g, '_')}_${roundState.date}.csv`;
      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Round History Management
    function finishAndSaveRound() {
      let history = [];
      const savedHist = localStorage.getItem(HISTORY_KEY);
      if (savedHist) {
        try { history = JSON.parse(savedHist); } catch(e){}
      }

      const totPar = roundState.holes.reduce((a, b) => a + b.par, 0);
      const totJ = roundState.holes.reduce((a, b) => a + b.jeffery, 0);
      const totK = roundState.holes.reduce((a, b) => a + b.jack, 0);

      const record = {
        id: Date.now(),
        courseName: roundState.courseName,
        date: roundState.date,
        time: roundState.time,
        par: totPar,
        jeffery: totJ,
        jack: totK,
        winner: totJ === totK ? 'Tie' : (totJ < totK ? 'Jeffery' : 'Jack')
      };

      history.unshift(record);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      alert("Round saved successfully to History!");
      closeScorecardModal();
    }

    function openHistoryModal() {
      renderHistory();
      document.getElementById('modalHistory').classList.remove('hidden');
      document.getElementById('modalHistory').classList.add('flex');
    }

    function closeHistoryModal() {
      document.getElementById('modalHistory').classList.add('hidden');
      document.getElementById('modalHistory').classList.remove('flex');
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      container.innerHTML = '';
      let history = [];
      const saved = localStorage.getItem(HISTORY_KEY);
      if (saved) {
        try { history = JSON.parse(saved); } catch(e){}
      }

      if (history.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">No saved rounds yet.<br>Complete a round and tap "Save Round to History".</div>`;
        return;
      }

      history.forEach(r => {
        const item = document.createElement('div');
        item.className = "bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between";
        item.innerHTML = `
          <div>
            <h4 class="font-extrabold text-white text-sm">${r.courseName}</h4>
            <span class="text-[11px] text-slate-400">${r.date} · Par ${r.par}</span>
            <div class="text-xs mt-1 font-semibold text-slate-300">
              Jeffery: <span class="text-blue-400 font-bold">${r.jeffery}</span> | Jack: <span class="text-sky-300 font-bold">${r.jack}</span>
            </div>
          </div>
          <span class="px-2.5 py-1 rounded-lg text-xs font-black ${r.winner === 'Jeffery' ? 'bg-blue-600/30 text-blue-300 border border-blue-500/40' : (r.winner === 'Jack' ? 'bg-sky-600/30 text-sky-300 border border-sky-500/40' : 'bg-slate-800 text-slate-400')}">
            ${r.winner === 'Tie' ? 'TIE' : r.winner + ' Won'}
          </span>
        `;
        container.appendChild(item);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
