    .card-3d-scene {

      position: relative;
      width: 100%;

      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;

      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);

      height: 100%;

    function getHoleCaddyInsights(courseName, holeNumber, history, playerIds) {
      const courseRounds = history.filter((r) => r.courseName.toLowerCase() === courseName.toLowerCase());
      const playerStats = {};
      for (const pid of playerIds) {
        const scores = [];
        for (const r of courseRounds) {
          const h = r.holes.find((hole) => hole.number === holeNumber);
          if (h && h.scores && h.scores[pid] && h.scores[pid] > 0) scores.push({ score: h.scores[pid], par: h.par });
        }
        if (scores.length === 0) {
          playerStats[pid] = { avgScore: 0, bestScore: null, worstScore: null, birdies: 0, pars: 0, bogeysOrWorse: 0 };
        } else {
          const sum = scores.reduce((acc, s) => acc + s.score, 0);
          playerStats[pid] = {
            avgScore: Number((sum / scores.length).toFixed(2)),
            bestScore: Math.min(...scores.map((s) => s.score)),
            worstScore: Math.max(...scores.map((s) => s.score)),
            birdies: scores.filter((s) => s.score < s.par).length,
            pars: scores.filter((s) => s.score === s.par).length,
            bogeysOrWorse: scores.filter((s) => s.score > s.par).length
          };
        }
      }
      return { holeNumber, roundsPlayed: courseRounds.length, playerStats };
    }

    function getCoursePersonalBest(courseName, playerId, history) {
      const matching = history.filter(
        (r) => r.courseName.toLowerCase() === courseName.toLowerCase() && r.players.some((p) => p.id === playerId && p.total > 0)
      );
      if (matching.length === 0) return { bestTotal: null, bestRelPar: null, avgTotal: null, roundsCount: 0 };
      let bestTotal = Infinity, bestRelPar = Infinity, sumTotal = 0;
      for (const r of matching) {
        const p = r.players.find((pl) => pl.id === playerId);
        sumTotal += p.total;
        if (p.total < bestTotal) { bestTotal = p.total; bestRelPar = p.total - r.par; }
      }
      return { bestTotal, bestRelPar, avgTotal: Number((sumTotal / matching.length).toFixed(1)), roundsCount: matching.length };
    }

    function computePlayerCareerProfile(playerId, history) {
      let roundsPlayed = 0, holesPlayed = 0, totalStrokes = 0, totalPar = 0, aces = 0, birdies = 0, pars = 0, bogeys = 0, doubleOrWorse = 0;
      let bestRoundRelPar = null;
      for (const round of history) {
        const pSummary = round.players.find((p) => p.id === playerId);
        if (!pSummary) continue;
        roundsPlayed++;
        const roundDiff = pSummary.total - round.par;
        if (!bestRoundRelPar || roundDiff < bestRoundRelPar.diff) {
          bestRoundRelPar = { diff: roundDiff, courseName: round.courseName, date: round.date, score: pSummary.total, par: round.par };
        }
        for (const h of round.holes) {
          const s = h.scores ? h.scores[playerId] : 0;
          if (!s || s <= 0) continue;
          holesPlayed++; totalStrokes += s; totalPar += h.par;
          if (s === 1) aces++;
          const d = s - h.par;
          if (d <= -1) birdies++; else if (d === 0) pars++; else if (d === 1) bogeys++; else doubleOrWorse++;
        }
      }
      const overallRelPar = totalStrokes - totalPar;
      const avgRelParPer9 = holesPlayed > 0 ? Number(((overallRelPar / holesPlayed) * 9).toFixed(1)) : 0;
      return { playerId, roundsPlayed, holesPlayed, totalStrokes, totalPar, overallRelPar, avgRelParPer9, aces, birdies, pars, bogeys, doubleOrWorse, bestRoundRelPar };
    }

    function computeHeadToHead(p1Id, p2Id, history) {
      let sharedRounds = 0, p1Wins = 0, p2Wins = 0, ties = 0, sharedHoles = 0, p1Skins = 0, p2Skins = 0, pushedHoles = 0;
      for (const r of history) {
        const p1 = r.players.find((p) => p.id === p1Id);
        const p2 = r.players.find((p) => p.id === p2Id);
        if (!p1 || !p2) continue;
        sharedRounds++;
        if (p1.total < p2.total) p1Wins++; else if (p2.total < p1.total) p2Wins++; else ties++;
        for (const h of r.holes) {
          const s1 = h.scores ? h.scores[p1Id] : 0;
          const s2 = h.scores ? h.scores[p2Id] : 0;
          if (s1 > 0 && s2 > 0) {
            sharedHoles++;
            if (s1 < s2) p1Skins++; else if (s2 < s1) p2Skins++; else pushedHoles++;
          }
        }
      }
      return { sharedRounds, p1Wins, p2Wins, ties, sharedHoles, p1Skins, p2Skins, pushedHoles };
    }

    function recommendDiscForScenario(distanceFeet, scenario, bag) {
      const byId = (id) => bag.find((d) => d.id === id) || null;
      if (distanceFeet < 185) {
        if (scenario === 'headwind') return { primary: byId('innova-pig') || bag[0], synergyAlt: byId('innova-sync'), shotCallout: 'Forehand flick or flat headwind approach — 1 glide refuses to float long; Galactic XT kills the skip.' };
        if (scenario === 'tailwind') return { primary: byId('innova-sync') || bag[0], synergyAlt: byId('discraft-roach'), shotCallout: '175g Star Sync thrown on a smooth anhyzer pan — holds the turnover line without burning over.' };
        if (distanceFeet <= 145) return { primary: byId('innova-aviar') || bag[0], synergyAlt: byId('discraft-roach'), shotCallout: 'Soft, lofted touch approach (100–145 ft) that settles flat right at the pole, followed by Circle 1 chains.' };
        return { primary: byId('innova-sync') || byId('innova-aviar'), synergyAlt: byId('discraft-roach'), shotCallout: 'Full-power throwing putter tee shot straight down the pipe without wobble.' };
      }
      if (distanceFeet <= 240) {
        if (scenario === 'headwind') return { primary: byId('innova-roc3') || bag[0], synergyAlt: byId('innova-pig'), shotCallout: '174g DX Roc3 — handles Kansas breeze far better than Mako3 with a dependable late left finish.' };
        if (scenario === 'tailwind') return { primary: byId('innova-rollo') || bag[0], synergyAlt: byId('discraft-buzzz-ss'), shotCallout: '172g Star Rollo — effortless right-turning pan (RHBH), scramble patent-pending, or instant backhand roller.' };
        return { primary: byId('innova-mako3') || bag[0], synergyAlt: byId('discraft-buzzz-ss'), shotCallout: 'Glow Mako3 [5|5|0|0] truth-teller — zero turn, zero fade down tight wooded hallways.' };
      }
      if (scenario === 'headwind') return { primary: byId('innova-firebird') || bag[0], synergyAlt: byId('innova-roc3'), shotCallout: '170g Champion I-Dye Firebird — 3 glide and 4 fade laugh at 30mph headwinds; power forehand or flare skip.' };
      if (scenario === 'tailwind' || distanceFeet >= 305) return { primary: byId('innova-mamba') || bag[0], synergyAlt: byId('innova-it'), shotCallout: '152g Star Mamba — release on a steep hyzer angle; stands up, turns right, and glides forever.' };
      return { primary: byId('innova-it') || bag[0], synergyAlt: byId('discraft-cicada'), shotCallout: '170g Halo Star IT — throw on a slight hyzer at 70% power; pops flat and glides on a tight S-curve.' };
    }

    function recommendJackDisc(distanceFeet, bag) {
      const jackDiscs = bag.filter((d) => d.ownerId === 'jack');
      const byId = (id) => jackDiscs.find((d) => d.id === id) || null;
      if (distanceFeet < 175) return byId('discraft-roach') || jackDiscs[0] || null;
      if (distanceFeet <= 240) return byId('discraft-buzzz-ss') || jackDiscs[0] || null;
      return byId('discraft-cicada') || jackDiscs[0] || null;
    }

    function computeFlightPathSvg(disc, wind = 'calm', releaseAngle = 'flat') {
      const startX = 130, startY = 295;
      let windDistMod = wind === 'tailwind' ? 1.08 : wind === 'headwind' ? (disc.turn <= -3 ? 0.85 : 0.94) : 1.0;
      const estFeet = Math.round(disc.idealMaxFeet * windDistMod);
      const normDist = Math.min(0.92, Math.max(0.36, estFeet / 410));
      const endY = Math.round(startY - normDist * 255);

      let effTurn = disc.turn + (wind === 'headwind' ? -1.5 : wind === 'tailwind' ? 1.0 : 0) + (releaseAngle === 'hyzer' ? 1.5 : releaseAngle === 'anhyzer' ? -1.8 : 0);
      let effFade = Math.max(0, disc.fade + (wind === 'headwind' ? -0.8 : wind === 'tailwind' ? 0.6 : 0) + (releaseAngle === 'hyzer' ? 0.8 : releaseAngle === 'anhyzer' ? -1.0 : 0));

      const turnPullX = Math.min(235, Math.max(45, startX + (-effTurn) * 16));
      const netLateral = (-effTurn) * 10 - effFade * 15;
      const endX = Math.min(235, Math.max(25, Math.round(startX + netLateral)));
      const cp1X = startX + (turnPullX - startX) * 0.45;
      const cp1Y = Math.round(startY - (startY - endY) * 0.35);
      const cp2X = turnPullX;
      const cp2Y = Math.round(startY - (startY - endY) * 0.78);
      return { pathD: `M ${startX} ${startY} C ${Math.round(cp1X)} ${cp1Y}, ${Math.round(cp2X)} ${cp2Y}, ${endX} ${endY}`, endX, endY, estimatedFeet: estFeet };
    }

    function computeLiveSkinsAndMatch(holes, p1Id, p2Id) {
      let p1SkinsWon = 0, p2SkinsWon = 0, carryover = 0, p1HolesUp = 0;
      const holeWinners = {};
      for (const h of holes) {
        const s1 = (h.scores && h.scores[p1Id]) || 0;
        const s2 = (h.scores && h.scores[p2Id]) || 0;
        if (s1 === 0 || s2 === 0) { holeWinners[h.number] = { winner: 'unplayed', skinsAwarded: 0 }; continue; }
        const pot = 1 + carryover;
        if (s1 < s2) { p1SkinsWon += pot; carryover = 0; p1HolesUp += 1; holeWinners[h.number] = { winner: p1Id, skinsAwarded: pot }; }
        else if (s2 < s1) { p2SkinsWon += pot; carryover = 0; p1HolesUp -= 1; holeWinners[h.number] = { winner: p2Id, skinsAwarded: pot }; }
        else { carryover += 1; holeWinners[h.number] = { winner: 'push', skinsAwarded: 0 }; }
      }
      let matchStatusText = 'All Square (AS)';
      if (p1HolesUp > 0) matchStatusText = `${p1Id === 'jeffery' ? 'Jeffery' : 'P1'} ${p1HolesUp} UP`;
      else if (p1HolesUp < 0) matchStatusText = `${p2Id === 'jack' ? 'Jack' : 'P2'} ${Math.abs(p1HolesUp)} UP`;
      return { p1SkinsWon, p2SkinsWon, currentCarryover: carryover, matchStatusText, holeWinners };
    }

    function buildNotebookGeminiDossier({ courseName, date, windCondition, duration, holes, players, roundTranscript, bag }) {
      const totalPar = holes.reduce((acc, h) => acc + h.par, 0);
      const totalDist = holes.reduce((acc, h) => acc + h.distance, 0);
      const playerSummaries = players.map((p) => {
        const strokes = holes.reduce((s, h) => s + ((h.scores && h.scores[p.id]) || h.par), 0);
        return `- **${p.name} (${p.tag || p.id})**: ${strokes} throws (${formatRelativePar(strokes - totalPar)})`;
      }).join('\n');
      const holeLines = holes.map((h) => {
        const scoreParts = players.map((p) => {
          const sc = (h.scores && h.scores[p.id]) || 0;
          const meta = h.meta && h.meta[p.id];
          return `${p.name}: ${sc > 0 ? sc : 'Unscored'}${meta?.discUsed ? ` [Disc: ${meta.discUsed}]` : ''}`;
        }).join(' | ');
        const caddieRec = recommendDiscForScenario(h.distance, windCondition, bag);
        const holeVoice = h.voiceTranscript ? `\n  - **Voice Dictation on Hole #${h.number}**: "${h.voiceTranscript}"` : '';
        return `- **Hole #${h.number}** (${h.distance} ft, Par ${h.par} · Caddie Rec: ${caddieRec.primary?.name || 'N/A'}): ${scoreParts}${holeVoice}`;
      }).join('\n');

      return `# DISC GOLF ROUND DOSSIER & VOICE TRANSCRIPT (FOR GEMINI / NOTEBOOKLM)\n\n## 1. Round Overview\n- **Course**: ${courseName} (${holes.length} Holes · Par ${totalPar} · ${totalDist.toLocaleString()} ft)\n- **Date**: ${date} · **Wind**: ${windCondition.toUpperCase()} · **Duration**: ${duration}\n\n## 2. Final Standings\n${playerSummaries}\n\n## 3. Full Round Voice Narration\n${roundTranscript?.trim() || '_(No full-round transcript pasted)_'}\n\n## 4. Hole-by-Hole Breakdown\n${holeLines}\n`;
    }

            <div className="neon-card rounded-2xl border border-slate-800 p-5 flex flex-col justify-between space-y-3.5">
              <div>
                <span className="text-[11px] font-extrabold uppercase tracking-wider accent-cyan text-[#00F0FF]">2 · 3D Collector Binder & Flight Lab</span>
                <h2 className="text-base sm:text-lg font-extrabold text-white mt-0.5">3D Flippable Trading Card Binder</h2>
                <p className="text-xs sm:text-sm text-slate-300 mt-1">Tap any of Jeffery's {jefferyDiscs.length} holographic Innova cards to flip to its 1990s Impel stat back, or inspect Jack's Discraft bag.</p>
              </div>
              <div className="flex gap-2">
                <button onClick={() => onNavigateTab('courses', 'jeffery')} className="keep-white flex-1 py-2.5 px-4 rounded-xl bg-[#FF2E93] text-white font-bold text-xs sm:text-sm">Jeffery's 3D Cards ({jefferyDiscs.length})</button>
                <button onClick={() => onNavigateTab('courses', 'jack')} className="flex-1 py-2.5 px-4 rounded-xl bg-[#00F0FF] text-slate-950 font-bold text-xs sm:text-sm">Jack's Discraft Bag ({jackDiscs.length})</button>
              </div>

            <div className="neon-card rounded-2xl border border-slate-800 p-5 flex flex-col justify-between space-y-3.5">
              <div>
                <span className="text-[11px] font-extrabold uppercase tracking-wider accent-lime text-[#39FF14]">3 · Round History & Voice Logs</span>
                <h2 className="text-base sm:text-lg font-extrabold text-white mt-0.5">Review Round History ({history.length} Rounds)</h2>
                <p className="text-xs sm:text-sm text-slate-300 mt-1">Browse every completed scorecard across Sar-Ko-Par, Mize, Black Hoof, Harmon, Wolf Den & Art Nine.</p>
              </div>
              <button onClick={() => onNavigateTab('history')} className="w-full py-2.5 px-4 rounded-xl bg-[#39FF14] text-slate-950 font-bold text-xs sm:text-sm">Open Round History & Transcripts →</button>
            </div>

            <div className="neon-card rounded-2xl border border-slate-800 p-5 flex flex-col justify-between space-y-3.5">

                <p className="text-xs sm:text-sm text-slate-300 mt-1">Compare Personal Bests, skins won, and birdie percentages between Jeffery and Jack.</p>
              </div>
              <div className="flex gap-2">
                <button onClick={() => onNavigateTab('rivalry')} className="flex-1 py-2.5 px-4 rounded-xl bg-[#00F0FF] text-slate-950 font-bold text-xs sm:text-sm">View Rivalry Stats</button>
                <button onClick={() => onNavigateTab('sync')} className="sub-control py-2.5 px-4 rounded-xl border border-slate-700 text-white font-bold text-xs sm:text-sm">Roster & Backup</button>

    // ============================================================================
    // VIEW 2: LIVE SCORECARD VIEW (WITH POP-UP 3D FLIPPABLE TEE-BOX CARD MODAL)
    // ============================================================================
    function LiveScorecardView({
      roundState, setRoundState, roster, history, courses, bag,
      timerState, elapsedSeconds, onToggleTimer, onResetTimer,
      onSwitchCourse, onSaveFinishedRound, webhookSyncStatus, onOpenBagGuide
    }) {
      const [editingHoleSpec, setEditingHoleSpec] = useState(false);
      const [caddieScenario, setCaddieScenario] = useState(roundState.windCondition || 'calm');
      const [expandedShotDetails, setExpandedShotDetails] = useState({});
      const [confirmResetModal, setConfirmResetModal] = useState(false);
      const [saveConfirmBanner, setSaveConfirmBanner] = useState(null);
      const [micStatusMessage, setMicStatusMessage] = useState(null);
      const [showDossierModal, setShowDossierModal] = useState(false);
      const [copiedDossier, setCopiedDossier] = useState(false);
      const [modalCardDisc, setModalCardDisc] = useState(null);

      useEffect(() => {
        if (roundState.windCondition && roundState.windCondition !== caddieScenario) setCaddieScenario(roundState.windCondition);
      }, [roundState.windCondition]);

      const handleSelectWindScenario = (scenario) => {
        setCaddieScenario(scenario);
        setRoundState((prev) => ({ ...prev, windCondition: scenario }));
      };

      const activePlayerIds = roundState.activePlayerIds || roster.map((r) => r.id);
      const activePlayers = roster.filter((r) => activePlayerIds.includes(r.id));
      const currentHole = roundState.holes[roundState.currentHoleIndex] || roundState.holes[0];
      const currentCourseTemplate = courses.find((c) => c.key === roundState.courseKey || c.name.toLowerCase() === roundState.courseName.toLowerCase());
      const currentHoleHint = currentCourseTemplate?.holes.find((h) => h.number === currentHole.number)?.hint;
      const caddyInsight = getHoleCaddyInsights(roundState.courseName, currentHole.number, history, activePlayerIds);

      const jefferyBag = bag.filter((d) => d.ownerId !== 'jack');
      const jackBag = bag.filter((d) => d.ownerId === 'jack');
      const caddieDecision = recommendDiscForScenario(currentHole.distance, caddieScenario, jefferyBag.length > 0 ? jefferyBag : bag);
      const jackRecommendedDisc = recommendJackDisc(currentHole.distance, bag);

      const formatDuration = (secs) => {
        const hrs = Math.floor(secs / 3600), mins = Math.floor((secs % 3600) / 60), s = secs % 60;
        return [hrs, mins, s].map((v) => String(v).padStart(2, '0')).join(':');
      };

      const updateScore = (playerId, newScore) => {
        const clamped = Math.max(0, Math.min(15, newScore));
        setRoundState((prev) => ({
          ...prev,
          holes: prev.holes.map((h, idx) => (idx !== prev.currentHoleIndex ? h : { ...h, scores: { ...h.scores, [playerId]: clamped } }))
        }));
        if (!timerState.running && elapsedSeconds === 0 && clamped > 0) onToggleTimer();
      };

      const updateShotMeta = (playerId, patch) => {
        setRoundState((prev) => ({
          ...prev,
          holes: prev.holes.map((h, idx) => {
            if (idx !== prev.currentHoleIndex) return h;
            const existingMeta = (h.meta && h.meta[playerId]) || {};
            return { ...h, meta: { ...(h.meta || {}), [playerId]: { ...existingMeta, ...patch } } };
          })
        }));
      };

      const updateCurrentHoleVoiceTranscript = (text) => {
        setRoundState((prev) => ({
          ...prev,
          holes: prev.holes.map((h, idx) => (idx === prev.currentHoleIndex ? { ...h, voiceTranscript: text } : h))
        }));
      };

      const handleShareToPhoneNotes = async () => {
        const template = `🎙️ ${roundState.courseName} — Hole #${currentHole.number} (${currentHole.distance}ft, Par ${currentHole.par}, Wind: ${caddieScenario.toUpperCase()})\nJeffery Pull: ${caddieDecision.primary?.name || 'Innova'} | Jack Pull: ${jackRecommendedDisc?.name || 'Discraft'}\nNotes: ${currentHole.voiceTranscript || ''}`;
        try { await navigator.clipboard.writeText(template); } catch {}
        if (navigator.share) {
          try { await navigator.share({ title: `${roundState.courseName} — Round Voice Notes`, text: template }); } catch {}
        } else {
          setMicStatusMessage('✓ Copied Hole & Wind header to clipboard!');
          setTimeout(() => setMicStatusMessage(null), 4000);
        }
      };

      const updateCurrentHoleSpec = (field, value) => {
        setRoundState((prev) => ({
          ...prev,
          holes: prev.holes.map((h, idx) => (idx === prev.currentHoleIndex ? { ...h, [field]: Math.max(1, value) } : h))
        }));
      };

      const fillParForUnscored = () => {
        setRoundState((prev) => ({
          ...prev,
          holes: prev.holes.map((h, idx) => {
            if (idx !== prev.currentHoleIndex) return h;
            const nextScores = { ...h.scores };
            for (const pid of activePlayerIds) { if (!nextScores[pid] || nextScores[pid] === 0) nextScores[pid] = h.par; }
            return { ...h, scores: nextScores };
          })
        }));
        if (!timerState.running && elapsedSeconds === 0) onToggleTimer();
      };

      const goToHole = (index) => {
        const safeIdx = Math.max(0, Math.min(roundState.holes.length - 1, index));
        setRoundState((prev) => ({ ...prev, currentHoleIndex: safeIdx }));
      };

      const clearCurrentRoundScores = () => {
        setRoundState((prev) => ({
          ...prev, currentHoleIndex: 0, date: new Date().toISOString().slice(0, 10), roundTranscript: '',
          holes: prev.holes.map((h) => ({ ...h, scores: Object.fromEntries(activePlayerIds.map((id) => [id, 0])), meta: {}, voiceTranscript: '' }))
        }));
        onResetTimer();
        setConfirmResetModal(false);
      };

      const liveStandings = activePlayers.map((player) => {
        let totalStrokes = 0, parThru = 0, holesCompleted = 0, birdiesCount = 0;
        for (const h of roundState.holes) {
          const sc = (h.scores && h.scores[player.id]) || 0;
          if (sc > 0) { totalStrokes += sc; parThru += h.par; holesCompleted++; if (sc < h.par) birdiesCount++; }
        }
        return { player, totalStrokes, parThru, holesCompleted, relPar: totalStrokes - parThru, birdiesCount, coursePB: getCoursePersonalBest(roundState.courseName, player.id, history) };
      });

      const skinsAndMatch = activePlayers.length >= 2 ? computeLiveSkinsAndMatch(roundState.holes, activePlayers[0].id, activePlayers[1].id) : null;
      const totalHolesScoredAllPlayers = roundState.holes.filter((h) => activePlayers.every((p) => ((h.scores && h.scores[p.id]) || 0) > 0)).length;
      const totalCoursePar = roundState.holes.reduce((sum, h) => sum + h.par, 0);
      const totalCourseDistance = roundState.holes.reduce((sum, h) => sum + h.distance, 0);

      const handleSaveRoundClick = async (syncWebhook) => {
        await onSaveFinishedRound(syncWebhook);
        setSaveConfirmBanner(syncWebhook ? 'Round + Voice Transcript saved & synced to Google Sheets!' : 'Round saved to History! Scores reset.');
        setTimeout(() => setSaveConfirmBanner(null), 5000);
      };

      const generatedDossierText = buildNotebookGeminiDossier({
        courseName: roundState.courseName, date: roundState.date || new Date().toISOString().slice(0, 10),
        windCondition: caddieScenario, duration: formatDuration(elapsedSeconds),
        holes: roundState.holes, players: activePlayers, roundTranscript: roundState.roundTranscript, bag
      });

      const isTimerUnstarted = !timerState.running && elapsedSeconds === 0;

      return (
        <div className="space-y-4">
          {/* POP-UP 3D FLIPPABLE CARD MODAL ON THE TEE BOX */}
          {modalCardDisc && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setModalCardDisc(null)}>
              <div className="max-w-sm w-full space-y-3" onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between px-1">
                  <span className="text-xs font-extrabold uppercase tracking-wider cb-gold">
                    🃏 Tap Card to Flip Front / Back
                  </span>
                  <button onClick={() => setModalCardDisc(null)} className="px-3 py-1 rounded-lg bg-white/10 cb-white text-xs font-extrabold">
                    Close ✕
                  </button>
                </div>
                <FlippableTradingCard
                  disc={modalCardDisc}
                  history={history}
                  onSelectForSim={(discId) => { setModalCardDisc(null); if (onOpenBagGuide) onOpenBagGuide(discId, 'jeffery'); }}
                />
              </div>
            </div>
          )}

          {/* BIG UNSTARTED TIMER REMINDER BANNER */}
          {isTimerUnstarted && (
            <div className="neon-card rounded-2xl border-2 border-[#FF2E93] p-3.5 sm:px-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-lg">
              <div className="flex items-center gap-3">
                <span className="keep-white w-10 h-10 rounded-xl bg-[#FF2E93] text-white flex items-center justify-center text-lg font-extrabold shrink-0 animate-pulse">⏱️</span>
                <div>
                  <div className="font-extrabold text-sm sm:text-base text-white">Round Timer is at 00:00:00 — Ready to Tee Off?</div>
                  <div className="text-xs text-slate-400">Tap the big Start button now (or it will auto-start as soon as you log Hole 1).</div>
                </div>
              </div>
              <button
                onClick={onToggleTimer}
                className="keep-white min-h-[46px] px-6 py-2.5 rounded-xl bg-[#FF2E93] hover:bg-[#FF2E93]/90 text-white font-extrabold text-sm sm:text-base flex items-center justify-center gap-2 neon-border-pink active:scale-95 shrink-0"
              >
                <span>▶ START ROUND TIMER</span>
              </button>
            </div>
          )}

          {/* Top Course, Format & Prominent Timer Bar */}
          <div className="neon-card rounded-2xl border border-slate-800 p-4 flex flex-col lg:flex-row lg:items-center justify-between gap-3.5">
            <div className="flex flex-col sm:flex-row sm:items-center gap-3 flex-1">
              <div className="flex-1 max-w-xs">
                <label className="block text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1">Active Course Loop ({courses.length} Courses)</label>
                <select
                  value={roundState.courseKey}
                  onChange={(e) => onSwitchCourse(e.target.value)}
                  className="sub-control w-full h-10 px-3 rounded-xl border border-slate-700 text-white font-bold text-xs sm:text-sm"
                >
                  {courses.map((c) => <option key={c.key} value={c.key}>{c.name} ({c.totalHoles} Holes)</option>)}
                </select>
              </div>
              <div className="text-xs sm:text-sm font-bold text-slate-300 pt-1 sm:pt-4">
                Par {totalCoursePar} · {totalCourseDistance.toLocaleString()} ft · Wind: <span className="uppercase font-extrabold accent-cyan text-[#00F0FF]">{caddieScenario}</span>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2.5">
              <button onClick={() => setShowDossierModal(!showDossierModal)} className="min-h-[42px] px-3.5 py-2 rounded-xl bg-[#39FF14] hover:bg-[#39FF14]/90 text-slate-950 font-bold text-xs flex items-center gap-1.5">
                <span>📓 NotebookLM / Gemini</span>
              </button>

              <div className="sub-control p-1 rounded-xl border border-slate-700 flex items-center gap-1">
                {['stroke', 'skins', 'match'].map((mode) => (
                  <button
                    key={mode}
                    onClick={() => setRoundState((prev) => ({ ...prev, gameMode: mode }))}
                    className={`px-2.5 py-1.5 text-xs font-bold rounded-lg ${
                      (roundState.gameMode || 'stroke') === mode ? 'keep-white bg-[#FF2E93] text-white' : 'text-slate-400'
                    }`}
                  >
                    {mode === 'stroke' ? 'Stroke' : mode === 'skins' ? 'Skins' : 'Match'}
                  </button>
                ))}
              </div>

              <div className="sub-tile px-3.5 py-1.5 rounded-xl border-2 border-slate-700 flex items-center gap-2.5">
                <span className="font-mono-tabular text-sm sm:text-base font-extrabold text-white">⏱️ {formatDuration(elapsedSeconds)}</span>
                <button
                  onClick={onToggleTimer}
                  className={`min-h-[34px] px-4 py-1.5 rounded-lg text-xs sm:text-sm font-extrabold active:scale-95 ${
                    timerState.running ? 'bg-[#FACC15] text-slate-950' : 'keep-white bg-[#FF2E93] text-white neon-border-pink'
                  }`}
                >
                  {timerState.running ? '⏸ Pause' : '▶ START TIMER'}
                </button>
                <button onClick={() => setConfirmResetModal(true)} title="Reset Round" className="sub-control w-8 h-8 rounded-lg border border-slate-700 text-xs text-slate-400 font-extrabold flex items-center justify-center">↺</button>
              </div>
            </div>
          </div>

          {showDossierModal && (
            <div className="neon-card rounded-2xl border-2 border-[#00F0FF] p-4 space-y-3">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 className="font-extrabold text-sm sm:text-base text-white">Round Voice Transcript & NotebookLM / Gemini Dossier</h3>
                  <p className="text-xs text-slate-400">Paste your Apple Notes audio transcript below, then copy or download for Gemini or NotebookLM!</p>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={async () => { try { await navigator.clipboard.writeText(generatedDossierText); setCopiedDossier(true); setTimeout(() => setCopiedDossier(false), 3000); } catch {} }}
                    className="px-3 py-1.5 rounded-xl bg-[#00F0FF] text-slate-950 font-bold text-xs"
                  >
                    {copiedDossier ? '✓ Copied Dossier!' : '📋 Copy Full Dossier'}
                  </button>
                  <button
                    onClick={() => {
                      const blob = new Blob([generatedDossierText], { type: 'text/markdown' });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a'); a.href = url; a.download = `Gemini-Round-${roundState.date}.md`; a.click(); URL.revokeObjectURL(url);
                    }}
                    className="sub-control px-3 py-1.5 rounded-xl border border-slate-700 text-white font-bold text-xs"
                  >
                    ⬇ Download .MD
                  </button>
                </div>
              </div>
              <textarea
                rows={4}

    function CoursesAndBagView({
      courses, bag, history, onStartRoundAtCourse,
      initialSelectedDiscId, initialBagOwnerFilter = 'jeffery'
    }) {
      const [bagOwnerFilter, setBagOwnerFilter] = useState(initialBagOwnerFilter);
      const [selectedDiscId, setSelectedDiscId] = useState(initialSelectedDiscId || 'innova-it');
      const [simWind, setSimWind] = useState('calm');
      const [simRelease, setSimRelease] = useState('flat');
      const [packGear, setPackGear] = useState(INITIAL_PACK_GEAR);
      const [selectedCourseKey, setSelectedCourseKey] = useState(courses[0]?.key || 'sarko');
      const [courseWindPreview, setCourseWindPreview] = useState('calm');
      const [zoomedCardDisc, setZoomedCardDisc] = useState(null);

      useEffect(() => { if (initialBagOwnerFilter) setBagOwnerFilter(initialBagOwnerFilter); }, [initialBagOwnerFilter]);
      useEffect(() => {
        if (initialSelectedDiscId && bag.some((d) => d.id === initialSelectedDiscId)) setSelectedDiscId(initialSelectedDiscId);
      }, [initialSelectedDiscId, bag]);

                            <th className="py-1.5 text-left">Metric</th>
                            {round.holes.map((h) => <th key={h.number} className="py-1.5">#{h.number}</th>)}
                            <th className="py-1.5">Total</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800 text-white font-bold">
                          <tr>
                            <td className="py-1.5 text-left text-slate-400">Dist</td>

                            <td className="py-1.5">{totalDistance}ft</td>
                          </tr>
                          <tr>
                            <td className="py-1.5 text-left text-slate-400">Par</td>
                            {round.holes.map((h) => <td key={h.number} className="py-1.5 text-slate-400">{h.par}</td>)}
                            <td className="py-1.5">{round.par}</td>
                          </tr>
                          {round.players.map((pl) => (
                            <tr key={pl.id}>
                              <td className="py-1.5 text-left font-extrabold">{pl.name}</td>
                              {round.holes.map((h) => <td key={h.number} className="py-1.5 font-extrabold">{(h.scores && h.scores[pl.id]) || '—'}</td>)}
                              <td className="py-1.5 font-extrabold accent-cyan text-[#00F0FF]">{pl.total} ({formatRelativePar(pl.total - round.par)})</td>
                            </tr>

                      </table>

                          const dossier = buildNotebookGeminiDossier({ courseName: round.courseName, date: round.date, windCondition: round.windCondition || 'calm', duration: round.duration, holes: round.holes, players: round.players, roundTranscript: round.roundTranscript, bag });
                          try { await navigator.clipboard.writeText(dossier); setCopiedRoundDossierId(round.id); setTimeout(() => setCopiedRoundDossierId(null), 3000); } catch {}
                        }}
                        className="px-3.5 py-2 rounded-xl bg-[#00F0FF] text-slate-950 text-xs font-extrabold"
                      >

                        className="sub-control px-3.5 py-2 rounded-xl border border-slate-700 text-xs font-bold text-white"

                        {syncingId === round.id ? 'Pushing...' : '☁️ Push to Google Sheet'}

                      <button onClick={() => { if (confirm('Delete this round?')) onDeleteRound(round.id); }} className="px-3 py-2 rounded-xl text-rose-500 text-xs font-bold">🗑 Delete</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );

        e.preventDefault();
        if (!newPlayerName.trim()) return;
        const id = newPlayerName.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        if (roster.some((r) => r.id === id)) return;
        const created = { id, name: newPlayerName.trim(), tag: newPlayerTag.trim().toUpperCase() || newPlayerName.trim().slice(0, 2).toUpperCase(), color: 'emerald-600' };
        setRoster((prev) => [...prev, created]);
        setNewPlayerName(''); setNewPlayerTag('');
        setStatusMessage({ type: 'success', text: `Added ${created.name} (${created.tag}) to roster.` });
      };

      return (
        <div className="space-y-5">
          {statusMessage && (
            <div className="neon-card p-3.5 rounded-2xl border-2 border-[#39FF14] text-xs sm:text-sm font-bold text-white flex justify-between">
              <span>{statusMessage.text}</span>
              <button onClick={() => setStatusMessage(null)} className="underline">Dismiss</button>
            </div>
          )}

          <div className="neon-card rounded-2xl border border-slate-800 p-4 sm:p-5 space-y-3.5">
            <h2 className="text-base sm:text-lg font-extrabold text-white">Player Roster & Active Card Selection</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              {roster.map((player) => {
                const isActive = activePlayerIds.includes(player.id);
                return (
                  <div key={player.id} className="sub-tile p-3 rounded-xl border border-slate-800 flex items-center justify-between">
                    <div className="font-extrabold text-sm text-white">{player.tag} · {player.name}</div>
                    <button onClick={() => onToggleActivePlayer(player.id)} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${isActive ? 'bg-[#39FF14] text-slate-950' : 'sub-control text-slate-400'}`}>
                      {isActive ? 'Active on Card ✓' : 'Add to Card'}
                    </button>
                  </div>
                );
              })}
            </div>
            <form onSubmit={handleAddPlayer} className="flex flex-wrap gap-2 pt-1">
              <input type="text" value={newPlayerName} onChange={(e) => setNewPlayerName(e.target.value)} placeholder="New player name (e.g. Zack)" className="sub-control h-10 px-3 rounded-xl border border-slate-700 text-white text-xs sm:text-sm font-bold" />
              <input type="text" value={newPlayerTag} onChange={(e) => setNewPlayerTag(e.target.value)} placeholder="Tag (Z1)" className="sub-control w-20 h-10 px-3 rounded-xl border border-slate-700 text-white text-xs sm:text-sm font-bold uppercase" />
              <button type="submit" className="keep-white h-10 px-4 rounded-xl bg-[#FF2E93] text-white text-xs sm:text-sm font-extrabold">+ Add Player</button>
            </form>
          </div>

          <div className="neon-card rounded-2xl border border-slate-800 p-4 sm:p-5 space-y-3.5">
            <h2 className="text-base sm:text-lg font-extrabold text-white">JSON Data Export & Import (Phone ↔ Laptop)</h2>
            <div className="flex flex-wrap gap-2.5">
              <button
                onClick={() => {
                  const payload = onExportJsonPayload();
                  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a'); a.href = url; a.download = `DG_Full_Backup_${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(url);
                }}
                className="px-3.5 py-2 rounded-xl bg-[#00F0FF] text-slate-950 font-extrabold text-xs sm:text-sm"
              >
                ⬇ Download .JSON Backup
              </button>
              <button
                onClick={async () => {
                  await navigator.clipboard.writeText(JSON.stringify(onExportJsonPayload(), null, 2));
                  setCopiedClipboard(true); setTimeout(() => setCopiedClipboard(false), 2500);
                }}
                className="sub-control px-3.5 py-2 rounded-xl border border-slate-700 text-white font-bold text-xs sm:text-sm"
              >
                {copiedClipboard ? '✓ Copied JSON!' : '📋 Copy JSON to Clipboard'}
              </button>
              <label className="px-3.5 py-2 rounded-xl bg-[#39FF14] text-slate-950 font-extrabold text-xs sm:text-sm cursor-pointer">
                ⬆ Upload .JSON File
                <input
                  type="file" accept=".json" className="hidden"
                  onChange={(e) => {
                    const file = e.target.files?.[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                      const result = onImportJsonPayload(String(ev.target?.result || ''));
                      setStatusMessage({ type: result.ok ? 'success' : 'error', text: result.message });
                    };
                    reader.readAsText(file);
                  }}
                />
              </label>
              <button onClick={onResetToFactoryData} className="sub-control px-3.5 py-2 rounded-xl border border-slate-700 text-slate-400 font-bold text-xs sm:text-sm">↺ Restore Baseline Snapshot</button>
            </div>
          </div>

          <div className="neon-card rounded-2xl border border-slate-800 p-4 sm:p-5 space-y-2">
            <h2 className="text-sm sm:text-base font-extrabold text-white">Google Sheets / Drive Webhook URL</h2>
            <input type="url" value={webhookUrl} onChange={(e) => setWebhookUrl(e.target.value)} className="sub-control w-full h-10 px-3 rounded-xl border border-slate-700 font-mono-tabular text-xs text-white" />
          </div>
        </div>
      );
    }

    // ============================================================================
    // MAIN APP COMPONENT
    // ============================================================================
    const STORAGE_KEY = 'jj_disc_golf_v46_hub_state';
    const THEME_STORAGE_KEY = 'jj_disc_golf_bg_theme';

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [focusedDiscId, setFocusedDiscId] = useState(null);
      const [bagOwnerFilter, setBagOwnerFilter] = useState('jeffery');
      const [bgTheme, setBgTheme] = useState(() => localStorage.getItem(THEME_STORAGE_KEY) || 'white');

      useEffect(() => { try { localStorage.setItem(THEME_STORAGE_KEY, bgTheme); } catch {} }, [bgTheme]);

      const [history, setHistory] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) { const parsed = JSON.parse(saved); if (Array.isArray(parsed.history) && parsed.history.length > 0) return parsed.history; }
        } catch {}
        return INITIAL_USER_EXPORT.history;
      });

      const [roster, setRoster] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) { const parsed = JSON.parse(saved); if (Array.isArray(parsed.roster) && parsed.roster.length > 0) return parsed.roster; }
        } catch {}
        return INITIAL_USER_EXPORT.roster;
      });

      const [courses, setCourses] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) { const parsed = JSON.parse(saved); if (Array.isArray(parsed.courses) && parsed.courses.length >= 16) return parsed.courses; }
        } catch {}
        return INITIAL_COURSE_TEMPLATES;
      });

      // Ensure canonical card specs (Star Aviar, Glow Mako3, cardImage, cardNumber) always sync cleanly
      const [bag, setBag] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.bag) && parsed.bag.length > 0) {
              return parsed.bag.map((d) => {
                const defaultMatch = INITIAL_DISC_BAG.find((initD) => initD.id === d.id);
                return defaultMatch ? { ...d, ...defaultMatch } : d;
              });
            }
          }
        } catch {}
        return INITIAL_DISC_BAG;
      });

      const [roundState, setRoundState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) { const parsed = JSON.parse(saved); if (parsed.roundState && Array.isArray(parsed.roundState.holes)) return parsed.roundState; }
        } catch {}
        return INITIAL_USER_EXPORT.roundState;
      });

      const [webhookUrl, setWebhookUrl] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) { const parsed = JSON.parse(saved); if (typeof parsed.webhookUrl === 'string') return parsed.webhookUrl; }
        } catch {}
        return INITIAL_USER_EXPORT.webhookUrl;
      });

      const [timerState, setTimerState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) { const parsed = JSON.parse(saved); if (parsed.timerState) return parsed.timerState; }
        } catch {}
        return INITIAL_USER_EXPORT.timerState;
      });

      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [webhookSyncStatus, setWebhookSyncStatus] = useState('idle');

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            app: 'Jeffery & Jack Disc Golf Scorecard', version: 'v52', exportDate: new Date().toISOString(),
            history, roster, roundState, webhookUrl, timerState, courses, bag
          }));
        } catch {}
      }, [history, roster, roundState, webhookUrl, timerState, courses, bag]);

      useEffect(() => {
        const computeSeconds = () => {
          const extra = timerState.running && timerState.startTime ? Date.now() - timerState.startTime : 0;
          return Math.floor((timerState.accumulatedMs + extra) / 1000);
        };
        setElapsedSeconds(computeSeconds());
        if (!timerState.running) return;
        const interval = setInterval(() => setElapsedSeconds(computeSeconds()), 1000);
        return () => clearInterval(interval);
      }, [timerState]);

      const handleToggleTimer = () => {
        setTimerState((prev) => {
          if (prev.running) return { running: false, startTime: null, accumulatedMs: prev.accumulatedMs + (prev.startTime ? Date.now() - prev.startTime : 0) };
          return { running: true, startTime: Date.now(), accumulatedMs: prev.accumulatedMs };
        });
      };

      const handleResetTimer = () => { setTimerState({ running: false, startTime: null, accumulatedMs: 0 }); setElapsedSeconds(0); };

      const handleSwitchCourse = (courseKey) => {
        const template = courses.find((c) => c.key === courseKey);
        if (!template) return;
        const activeIds = roundState.activePlayerIds || roster.map((r) => r.id);
        setRoundState({
          courseKey: template.key, courseName: template.name, totalHoles: template.totalHoles,
          date: new Date().toISOString().slice(0, 10), currentHoleIndex: 0, activePlayerIds: activeIds,
          gameMode: roundState.gameMode || 'stroke', windCondition: roundState.windCondition || 'calm', roundTranscript: '',
          holes: template.holes.map((h) => ({ number: h.number, par: h.par, distance: h.distance, scores: Object.fromEntries(activeIds.map((id) => [id, 0])) }))
        });
        handleResetTimer();
      };

      const handleStartConfiguredRound = (params) => {
        const template = courses.find((c) => c.key === params.courseKey) || courses[0];
        const activeIds = roundState.activePlayerIds || roster.map((r) => r.id);
        setRoundState({
          courseKey: template.key, courseName: template.name, totalHoles: template.totalHoles,
          date: new Date().toISOString().slice(0, 10), currentHoleIndex: 0, activePlayerIds: activeIds,
          gameMode: roundState.gameMode || 'stroke', windCondition: params.windCondition,
          voiceRecordingConfirmed: params.voiceRecordingConfirmed, roundTranscript: '',
          holes: template.holes.map((h) => ({ number: h.number, par: h.par, distance: h.distance, scores: Object.fromEntries(activeIds.map((id) => [id, 0])) }))
        });
        handleResetTimer();
        setActiveTab('live');
      };

      const handleReplayHistoricalCourse = (round) => {
        const activeIds = roundState.activePlayerIds || roster.map((r) => r.id);
        const matchedTemplate = courses.find((c) => c.name.toLowerCase() === round.courseName.toLowerCase());
        setRoundState({
          courseKey: matchedTemplate?.key || 'sarko', courseName: round.courseName, totalHoles: round.totalHoles,
          date: new Date().toISOString().slice(0, 10), currentHoleIndex: 0, activePlayerIds: activeIds,
          gameMode: 'stroke', windCondition: round.windCondition || 'calm', roundTranscript: '',
          holes: round.holes.map((h) => ({ number: h.number, par: h.par, distance: h.distance, scores: Object.fromEntries(activeIds.map((id) => [id, 0])) }))
        });
        handleResetTimer();
        setActiveTab('live');
      };

      const syncRoundToWebhook = async (round) => {
        if (!webhookUrl) return;
        setWebhookSyncStatus('syncing');
        try {
          await fetch(webhookUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(round) });
          setWebhookSyncStatus('success'); setTimeout(() => setWebhookSyncStatus('idle'), 3000);
        } catch {
          setWebhookSyncStatus('error'); setTimeout(() => setWebhookSyncStatus('idle'), 4000);
        }
      };

      const handleSaveFinishedRound = async (syncToWebhook) => {
        const activeIds = roundState.activePlayerIds || roster.map((r) => r.id);
        const activeRoster = roster.filter((r) => activeIds.includes(r.id));
        const hrs = Math.floor(elapsedSeconds / 3600), mins = Math.floor((elapsedSeconds % 3600) / 60), secs = elapsedSeconds % 60;
        const durationFormatted = elapsedSeconds > 0 ? [hrs, mins, secs].map((v) => String(v).padStart(2, '0')).join(':') : '00:28:00';
        const coursePar = roundState.holes.reduce((acc, h) => acc + h.par, 0);
        const finalizedHoles = roundState.holes.map((h) => {
          const nextScores = {};
          for (const p of activeRoster) nextScores[p.id] = h.scores && h.scores[p.id] > 0 ? h.scores[p.id] : h.par;
          return { ...h, scores: nextScores };
        });
        const playersSummary = activeRoster.map((p) => ({
          id: p.id, name: p.name, tag: p.tag,
          total: finalizedHoles.reduce((sum, h) => sum + (h.scores[p.id] || h.par), 0)
        }));
        const newHistoricalRound = {
          id: Date.now(), courseName: roundState.courseName, totalHoles: roundState.totalHoles,
          date: roundState.date || new Date().toISOString().slice(0, 10), duration: durationFormatted,
          par: coursePar, players: playersSummary, holes: finalizedHoles,
          gameMode: roundState.gameMode, windCondition: roundState.windCondition || 'calm',
          roundTranscript: roundState.roundTranscript || ''
        };
        setHistory((prev) => [newHistoricalRound, ...prev]);
        if (syncToWebhook) await syncRoundToWebhook(newHistoricalRound);
        setRoundState((prev) => ({
          ...prev, currentHoleIndex: 0, date: new Date().toISOString().slice(0, 10), roundTranscript: '',
          holes: prev.holes.map((h) => ({ ...h, scores: Object.fromEntries(activeIds.map((id) => [id, 0])), meta: {}, voiceTranscript: '' }))
        }));
        handleResetTimer();
      };

      const handleToggleActivePlayer = (playerId) => {
        setRoundState((prev) => {
          const currentIds = prev.activePlayerIds || roster.map((r) => r.id);
          const exists = currentIds.includes(playerId);
          if (exists && currentIds.length <= 1) return prev;
          return { ...prev, activePlayerIds: exists ? currentIds.filter((id) => id !== playerId) : [...currentIds, playerId] };
        });
      };

      const handleExportJsonPayload = () => ({
        app: 'Jeffery & Jack Disc Golf Scorecard', version: 'v52', exportDate: new Date().toISOString(),
        history, roster, roundState, webhookUrl, timerState, courses, bag
      });

      const handleImportJsonPayload = (rawJson) => {
        try {
          const parsed = JSON.parse(rawJson);
          if (!parsed || !Array.isArray(parsed.history)) return { ok: false, message: 'Invalid JSON: missing "history" array.' };
          setHistory(parsed.history);
          if (Array.isArray(parsed.roster)) setRoster(parsed.roster);
          if (parsed.roundState && Array.isArray(parsed.roundState.holes)) setRoundState(parsed.roundState);
          if (typeof parsed.webhookUrl === 'string') setWebhookUrl(parsed.webhookUrl);
          if (Array.isArray(parsed.courses)) setCourses(parsed.courses);
          return { ok: true, message: `Successfully imported ${parsed.history.length} rounds into your scorecard!` };
        } catch {
          return { ok: false, message: 'Could not parse JSON string.' };
        }
      };

      const handleResetToFactoryData = () => {
        setHistory(INITIAL_USER_EXPORT.history); setRoster(INITIAL_USER_EXPORT.roster);
        setRoundState(INITIAL_USER_EXPORT.roundState); setWebhookUrl(INITIAL_USER_EXPORT.webhookUrl);
        setCourses(INITIAL_COURSE_TEMPLATES); setBag(INITIAL_DISC_BAG); handleResetTimer();
      };

      const themeClass = bgTheme === 'white' ? 'theme-white' : bgTheme === 'adventure' ? 'theme-adventure' : bgTheme === 'turf' ? 'theme-turf' : 'theme-midnight';

      return (
        <div className={`${themeClass} min-h-screen pb-28 transition-colors duration-200`}>
          <header className="safe-header bg-[#080B14]/95 border-b border-slate-800 px-4 sticky top-0 z-40 backdrop-blur-md shadow-md">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-3">
              <a href="#home" onClick={(e) => { e.preventDefault(); setActiveTab('home'); }} className="font-display text-base sm:text-lg font-extrabold tracking-normal whitespace-nowrap shrink-0 text-white">
                Jeffery & <span className="text-[#FF2E93]">Jack</span> Disc Golf
              </a>

              <nav className="hidden md:flex items-center gap-6 text-xs sm:text-sm font-bold text-slate-300">
                <button onClick={() => setActiveTab('home')} className={`py-1 border-b-2 ${activeTab === 'home' ? 'border-[#39FF14] text-[#39FF14]' : 'border-transparent hover:text-white'}`}>Home Hub</button>
                <button onClick={() => setActiveTab('live')} className={`py-1 border-b-2 ${activeTab === 'live' ? 'border-[#FF2E93] text-[#FF2E93]' : 'border-transparent hover:text-white'}`}>Live Scorecard</button>
                <button onClick={() => setActiveTab('courses')} className={`py-1 border-b-2 ${activeTab === 'courses' ? 'border-[#00F0FF] text-[#00F0FF]' : 'border-transparent hover:text-white'}`}>3D Cards & Flight Lab</button>
                <button onClick={() => setActiveTab('history')} className={`py-1 border-b-2 ${activeTab === 'history' || activeTab === 'rivalry' ? 'border-[#FACC15] text-[#FACC15]' : 'border-transparent hover:text-white'}`}>Round & Course History</button>
              </nav>

              <button onClick={() => setActiveTab('sync')} className={`px-3.5 py-1.5 text-xs font-extrabold rounded-xl shrink-0 ${activeTab === 'sync' ? 'bg-[#39FF14] text-slate-950' : 'bg-[#FF2E93] text-white'}`}>
                Data & Roster
              </button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-3.5 sm:px-6 py-4 space-y-4">
            <div className="neon-card border border-slate-800 rounded-2xl p-2.5 sm:px-4 flex flex-wrap items-center justify-between gap-2">
              <span className="text-xs sm:text-sm font-extrabold text-white flex items-center gap-1.5"><span>🎨 Theme & Backdrop:</span></span>
              <div className="flex flex-wrap gap-1.5">
                {[
                  { id: 'white', label: 'Indigo + White Tiles' },
                  { id: 'adventure', label: 'Pink/Blue + White Tiles' },
                  { id: 'turf', label: 'Fairway + White Tiles' },
                  { id: 'midnight', label: 'Midnight Dark Tiles' }
                ].map((mode) => (
                  <button
                    key={mode.id}
                    onClick={() => setBgTheme(mode.id)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border transition-all ${bgTheme === mode.id ? 'keep-white bg-[#FF2E93] text-white border-[#FF2E93] shadow-xs' : 'sub-control text-white border-slate-700'}`}
                  >
                    {mode.label}
                  </button>
                ))}
              </div>
            </div>

            {activeTab === 'home' && (
              <HomeHubView
                courses={courses} bag={bag} history={history} roundState={roundState}
                onStartConfiguredRound={handleStartConfiguredRound}
                onResumeLiveRound={() => setActiveTab('live')}
                onNavigateTab={(tab, ownerFilter) => { if (ownerFilter) setBagOwnerFilter(ownerFilter); setActiveTab(tab); }}
              />
            )}

            {activeTab === 'live' && (
              <LiveScorecardView
                roundState={roundState} setRoundState={setRoundState} roster={roster} history={history} courses={courses} bag={bag}
                timerState={timerState} elapsedSeconds={elapsedSeconds} onToggleTimer={handleToggleTimer} onResetTimer={handleResetTimer}
                onSwitchCourse={handleSwitchCourse} onSaveFinishedRound={handleSaveFinishedRound} webhookSyncStatus={webhookSyncStatus}
                onOpenBagGuide={(discId, ownerFilter) => { if (discId) setFocusedDiscId(discId); if (ownerFilter) setBagOwnerFilter(ownerFilter); setActiveTab('courses'); }}
              />
            )}

            {activeTab === 'courses' && (
              <CoursesAndBagView
                courses={courses} setCourses={setCourses} bag={bag} setBag={setBag} history={history} roster={roster}
                onStartRoundAtCourse={(courseKey) => { handleSwitchCourse(courseKey); setActiveTab('live'); }}
                initialSelectedDiscId={focusedDiscId} initialBagOwnerFilter={bagOwnerFilter}
              />
            )}

            {activeTab === 'rivalry' && (
              <div className="space-y-4">
                <div className="flex justify-end">
                  <button onClick={() => setActiveTab('history')} className="sub-control px-3.5 py-2 rounded-xl border border-slate-700 text-xs font-extrabold text-white">Switch to Completed Round Scorecards →</button>
                </div>
                <RivalryAnalyticsView history={history} roster={roster} />
              </div>
            )}

            {activeTab === 'history' && (
              <div className="space-y-4">
                <div className="flex justify-end">
                  <button onClick={() => setActiveTab('rivalry')} className="px-3.5 py-2 rounded-xl bg-[#00F0FF] text-slate-950 text-xs font-extrabold">View Course Records & Jeffery vs. Jack Rivalry Stats →</button>
                </div>
                <RoundHistoryView
                  history={history} roster={roster} bag={bag}
                  onDeleteRound={(id) => setHistory((prev) => prev.filter((item) => item.id !== id))}
                  onReplayCourse={handleReplayHistoricalCourse}
                  onSyncSingleRoundToWebhook={syncRoundToWebhook}
                />
              </div>
            )}

            {activeTab === 'sync' && (
              <SyncAndRosterView
                roster={roster} setRoster={setRoster} activePlayerIds={roundState.activePlayerIds || roster.map((r) => r.id)}
                onToggleActivePlayer={handleToggleActivePlayer} webhookUrl={webhookUrl} setWebhookUrl={setWebhookUrl}
                onExportJsonPayload={handleExportJsonPayload} onImportJsonPayload={handleImportJsonPayload} onResetToFactoryData={handleResetToFactoryData}
              />
            )}
          </main>

          <nav className="safe-bottom-nav fixed bottom-0 left-0 right-0 z-40 bg-[#080B14]/95 border-t border-slate-800 grid grid-cols-5 md:hidden">
            {[
              { id: 'home', label: 'Home Hub', icon: '🏠', color: 'text-[#39FF14]' },
              { id: 'live', label: 'Play Round', icon: '📋', color: 'text-[#FF2E93]' },
              { id: 'courses', label: '3D Cards', icon: '🃏', color: 'text-[#00F0FF]' },
              { id: 'history', label: 'History', icon: '🕒', color: 'text-[#FACC15]' },
              { id: 'rivalry', label: 'Stats', icon: '🏆', color: 'text-[#C026D3]' }
            ].map((item) => {
              const isActive = activeTab === item.id;
              return (
                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`min-h-[52px] flex flex-col items-center justify-center text-[11px] transition-colors ${isActive ? `${item.color} font-extrabold` : 'text-slate-300'}`}>
                  <span className="text-base leading-none mb-0.5">{item.icon}</span>
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
