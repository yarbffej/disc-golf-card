<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>DG Scorecard - Jeffery & Jack</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --sat: env(safe-area-inset-top, 20px);
      --sab: env(safe-area-inset-bottom, 20px);
    }
    body {
      padding-top: max(var(--sat), 16px);
      padding-bottom: max(var(--sab), 20px);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .custom-scroll::-webkit-scrollbar { display: none; }
    .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* Theme 1: Royal Blue Background with White Cards */
    body.theme-blue {
      background-color: #1e3a8a; /* Rich Royal Blue */
      color: #0f172a;
    }
    body.theme-blue .app-card {
      background-color: #ffffff;
      color: #0f172a;
      border: 1px solid #bfdbfe;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }
    body.theme-blue .app-header {
      background-color: rgba(30, 58, 138, 0.96);
      border-color: #2563eb;
      color: #ffffff;
    }
    body.theme-blue .app-footer {
      background-color: rgba(30, 58, 138, 0.96);
      border-color: #2563eb;
    }
    body.theme-blue .card-title { color: #0f172a; }
    body.theme-blue .card-subtext { color: #475569; }
    body.theme-blue .counter-box {
      background-color: #eff6ff;
      border-color: #bfdbfe;
    }
    body.theme-blue .counter-number { color: #1e3a8a; }

    /* Theme 2: White Background with Royal Blue Cards */
    body.theme-white {
      background-color: #f8fafc;
      color: #0f172a;
    }
    body.theme-white .app-card {
      background-color: #1d4ed8; /* Vibrant Royal Blue card */
      color: #ffffff;
      border: 1px solid #1e40af;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.25);
    }
    body.theme-white .app-header {
      background-color: rgba(248, 250, 252, 0.96);
      border-color: #cbd5e1;
      color: #0f172a;
    }
    body.theme-white .app-footer {
      background-color: rgba(248, 250, 252, 0.96);
      border-color: #cbd5e1;
    }
    body.theme-white .card-title { color: #ffffff; }
    body.theme-white .card-subtext { color: #bfdbfe; }
    body.theme-white .counter-box {
      background-color: #1e40af;
      border-color: #3b82f6;
    }
    body.theme-white .counter-number { color: #ffffff; }
  </style>
</head>
<body id="appBody" class="theme-blue min-h-screen flex flex-col font-sans antialiased overflow-x-hidden pb-28">

  <!-- TOP HEADER -->
  <header id="appHeader" class="app-header sticky top-0 z-40 backdrop-blur-md border-b px-3.5 py-2 shadow-md">
    <div class="flex items-center justify-between gap-2 max-w-lg mx-auto">
      <button onclick="openCourseModal()" class="flex items-center gap-2 text-left truncate py-1">
        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center shrink-0 shadow">
          <i class="fa-solid fa-location-dot text-sm"></i>
        </div>
        <div class="truncate">
          <div class="flex items-center gap-1.5">
            <span id="headerCourseName" class="font-black text-sm tracking-tight truncate">Sar-Ko-Par Trails</span>
            <span id="headerHoleCountBadge" class="text-[10px] bg-white text-blue-800 px-1.5 py-0.2 rounded font-black shadow-sm">9H</span>
          </div>
          <div id="headerDateTime" class="text-[11px] opacity-80 font-medium">Today · In Progress</div>
        </div>
      </button>

      <div class="flex items-center gap-1.5 shrink-0">
        <!-- Palette Switcher -->
        <button onclick="toggleTheme()" id="btnPalette" title="Switch Theme" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 text-amber-300 border border-white/20 flex items-center justify-center active:scale-90 shadow-sm">
          <i class="fa-solid fa-palette text-xs"></i>
        </button>
        <!-- Hole Count Toggle -->
        <button onclick="toggleHoleCountDirect()" id="btnQuickToggle" class="px-2 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-white border border-white/20 text-xs font-black active:scale-95">
          9H
        </button>
        <!-- History Drawer Button -->
        <button onclick="openHistoryModal()" title="Past Rounds" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 text-white border border-white/20 flex items-center justify-center active:scale-95">
          <i class="fa-solid fa-clock-rotate-left text-xs"></i>
        </button>
        <!-- Sheets Export Button -->
        <button onclick="exportToSheets()" title="Export CSV" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black flex items-center gap-1 active:scale-95 shadow">
          <i class="fa-solid fa-file-excel text-xs"></i>
          <span>Sheets</span>
        </button>
      </div>
    </div>

    <!-- Match Status Ticker -->
    <div class="mt-2 pt-2 border-t border-white/20 flex items-center justify-between text-xs max-w-lg mx-auto px-1">
      <div id="matchStatusText" class="font-black flex items-center gap-1.5 truncate">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
        <span class="truncate">All Square</span>
      </div>
      <div class="flex items-center gap-2.5 font-bold shrink-0">
        <span class="flex items-center gap-1">
          <span class="opacity-80 font-normal">Jeffery:</span>
          <span id="tickerScoreJeffery" class="bg-white text-blue-900 px-1.5 py-0.5 rounded text-[11px] font-black shadow-sm">0 (E)</span>
        </span>
        <span class="opacity-40">|</span>
        <span class="flex items-center gap-1">
          <span class="opacity-80 font-normal">Jack:</span>
          <span id="tickerScoreJack" class="bg-white text-blue-900 px-1.5 py-0.5 rounded text-[11px] font-black shadow-sm">0 (E)</span>
        </span>
      </div>
    </div>
  </header>

  <!-- MAIN SCORING CARD -->
  <main class="flex-1 px-3.5 py-3 max-w-lg mx-auto w-full flex flex-col gap-3">

    <!-- Hole Navigator Bar -->
    <div class="app-card rounded-2xl p-2.5 flex items-center justify-between shadow-md">
      <button onclick="prevHole()" id="btnPrevHoleTop" class="w-10 h-10 rounded-xl bg-blue-900 text-white active:scale-90 flex items-center justify-center font-bold text-base disabled:opacity-30 disabled:pointer-events-none transition shadow">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <div class="text-center">
        <div class="text-[10px] uppercase tracking-wider font-extrabold text-blue-600">HOLE</div>
        <div class="flex items-baseline justify-center gap-1">
          <span id="currentHoleLabel" class="text-2xl font-black card-title">1</span>
          <span id="totalHolesMaxLabel" class="text-xs card-subtext font-semibold">/ 9</span>
        </div>
      </div>

      <button onclick="nextHole()" id="btnNextHoleTop" class="w-10 h-10 rounded-xl bg-blue-600 text-white active:scale-90 flex items-center justify-center font-bold text-base transition shadow">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- Hole Par & Distance Info -->
    <div class="grid grid-cols-2 gap-2.5">
      <div class="app-card rounded-xl p-2.5 flex items-center justify-between shadow-sm">
        <div>
          <span class="text-[10px] font-bold uppercase card-subtext block tracking-wide">PAR</span>
          <span id="parDisplay" class="text-xl font-black card-title leading-tight">3</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="adjustPar(-1)" class="w-8 h-8 rounded-lg bg-blue-900 text-white font-bold active:scale-90 text-sm flex items-center justify-center">-</button>
          <button onclick="adjustPar(1)" class="w-8 h-8 rounded-lg bg-blue-900 text-white font-bold active:scale-90 text-sm flex items-center justify-center">+</button>
        </div>
      </div>

      <div class="app-card rounded-xl p-2.5 flex items-center justify-between shadow-sm">
        <div>
          <span class="text-[10px] font-bold uppercase card-subtext block tracking-wide">DISTANCE</span>
          <div class="flex items-baseline gap-1">
            <span id="distanceDisplay" class="text-xl font-black card-title leading-tight">128</span>
            <span class="text-[10px] card-subtext font-semibold">ft</span>
          </div>
        </div>
        <button onclick="editDistance()" class="w-8 h-8 rounded-lg bg-blue-600 text-white active:scale-90 flex items-center justify-center shadow">
          <i class="fa-solid fa-pen-to-square text-xs"></i>
        </button>
      </div>
    </div>

    <!-- PLAYER 1: JEFFERY -->
    <div class="app-card rounded-2xl p-3.5 shadow-lg relative overflow-hidden">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-md bg-blue-600 text-white font-black text-[11px] flex items-center justify-center shadow">J1</span>
          <div>
            <h2 class="font-black card-title text-base tracking-tight leading-none">Jeffery</h2>
            <span id="jefferyRelative" class="text-[11px] font-semibold card-subtext">Total: 0 (E)</span>
          </div>
        </div>
        <div id="jefferyScoreBadge" class="px-2.5 py-0.5 rounded-full text-xs font-black uppercase tracking-wider bg-slate-200 text-slate-700">
          -
        </div>
      </div>

      <div class="counter-box grid grid-cols-5 items-center gap-2 my-2 p-2 rounded-xl border">
        <button onclick="adjustPlayerScore('jeffery', -1)" class="col-span-1 h-14 rounded-lg bg-blue-900 text-white text-2xl font-black active:scale-95 flex items-center justify-center shadow">
          <i class="fa-solid fa-minus"></i>
        </button>
        <div class="col-span-3 text-center">
          <span id="jefferyHoleScore" class="text-4xl font-black counter-number leading-none tracking-tight">0</span>
          <span class="block text-[10px] card-subtext uppercase font-bold tracking-widest mt-0.5">Throws</span>
        </div>
        <button onclick="adjustPlayerScore('jeffery', 1)" class="col-span-1 h-14 rounded-lg bg-blue-600 text-white text-2xl font-black active:scale-95 flex items-center justify-center shadow">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <div class="grid grid-cols-4 gap-1.5 mt-2">
        <button onclick="setPlayerScorePreset('jeffery', 1)" class="py-1.5 px-1 rounded-lg bg-amber-500 text-white font-extrabold text-[11px] active:scale-95 shadow-sm">Ace (1)</button>
        <button onclick="setPlayerScorePreset('jeffery', 'birdie')" class="py-1.5 px-1 rounded-lg bg-emerald-600 text-white font-extrabold text-[11px] active:scale-95 shadow-sm">Birdie</button>
        <button onclick="setPlayerScorePreset('jeffery', 'par')" class="py-1.5 px-1 rounded-lg bg-blue-700 text-white font-extrabold text-[11px] active:scale-95 shadow-sm">Par</button>
        <button onclick="setPlayerScorePreset('jeffery', 'bogey')" class="py-1.5 px-1 rounded-lg bg-orange-600 text-white font-extrabold text-[11px] active:scale-95 shadow-sm">Bogey</button>
      </div>
    </div>

    <!-- PLAYER 2: JACK -->
    <div class="app-card rounded-2xl p-3.5 shadow-lg relative overflow-hidden">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-md bg-blue-800 text-white font-black text-[11px] flex items-center justify-center shadow">J2</span>
          <div>
            <h2 class="font-black card-title text-base tracking-tight leading-none">Jack</h2>
            <span id="jackRelative" class="text-[11px] font-semibold card-subtext">Total: 0 (E)</span>
          </div>
        </div>
        <div id="jackScoreBadge" class="px-2.5 py-0.5 rounded-full text-xs font-black uppercase tracking-wider bg-slate-200 text-slate-700">
          -
        </div>
      </div>

      <div class="counter-box grid grid-cols-5 items-center gap-2 my-2 p-2 rounded-xl border">
        <button onclick="adjustPlayerScore('jack', -1)" class="col-span-1 h-14 rounded-lg bg-blue-900 text-white text-2xl font-black active:scale-95 flex items-center justify-center shadow">
          <i class="fa-solid fa-minus"></i>
        </button>
        <div class="col-span-3 text-center">
          <span id="jackHoleScore" class="text-4xl font-black counter-number leading-none tracking-tight">0</span>
          <span class="block text-[10px] card-subtext uppercase font-bold tracking-widest mt-0.5">Throws</span>
        </div>
        <button onclick="adjustPlayerScore('jack', 1)" class="col-span-1 h-14 rounded-lg bg-blue-600 text-white text-2xl font-black active:scale-95 flex items-center justify-center shadow">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <div class="grid grid-cols-4 gap-1.5 mt-2">
        <button onclick="setPlayerScorePreset('jack', 1)" class="py-1.5 px-1 rounded-lg bg-amber-500 text-white font-extrabold text-[11px] active:scale-95 shadow-sm">Ace (1)</button>
        <button onclick="setPlayerScorePreset('jack', 'birdie')" class="py-1.5 px-1 rounded-lg bg-emerald-600 text-white font-extrabold text-[11px] active:scale-95 shadow-sm">Birdie</button>
        <button onclick="setPlayerScorePreset('jack', 'par')" class="py-1.5 px-1 rounded-lg bg-blue-700 text-white font-extrabold text-[11px] active:scale-95 shadow-sm">Par</button>
        <button onclick="setPlayerScorePreset('jack', 'bogey')" class="py-1.5 px-1 rounded-lg bg-orange-600 text-white font-extrabold text-[11px] active:scale-95 shadow-sm">Bogey</button>
      </div>
    </div>

  </main>

  <!-- FIXED BOTTOM DOCK -->
  <footer id="appFooter" class="app-footer fixed bottom-0 left-0 right-0 z-40 backdrop-blur-md border-t px-4 py-2.5 pb-[max(0.6rem,env(safe-area-inset-bottom))] shadow-2xl">
    <div class="max-w-lg mx-auto flex items-center gap-2">
      <button onclick="prevHole()" id="btnBottomPrev" class="flex-1 py-3 px-3 rounded-xl bg-blue-900 text-white font-bold text-sm active:scale-95 border border-blue-700 flex items-center justify-center gap-2 disabled:opacity-30">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        <span>Prev</span>
      </button>

      <button onclick="openScorecardModal()" class="w-12 h-12 rounded-xl bg-white text-blue-900 border border-blue-200 flex flex-col items-center justify-center active:scale-95 shrink-0 shadow">
        <i class="fa-solid fa-table-cells text-base"></i>
        <span class="text-[9px] font-black uppercase mt-0.5">Card</span>
      </button>

      <button onclick="nextHole()" id="btnBottomNext" class="flex-1 py-3 px-3 rounded-xl bg-blue-600 text-white font-black text-sm active:scale-95 border border-blue-400 flex items-center justify-center gap-2 shadow-md">
        <span id="nextHoleText">Next</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </div>
  </footer>

  <!-- FULL SCORECARD MODAL -->
  <div id="modalScorecard" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex-col justify-end">
    <div class="bg-white text-slate-900 border-t border-slate-200 rounded-t-3xl max-w-lg mx-auto w-full max-h-[92vh] flex flex-col overflow-hidden">
      <div class="px-5 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div>
          <h3 class="font-black text-lg text-slate-900">Scorecard</h3>
          <p class="text-xs text-slate-500 font-semibold" id="modalCardSubtitle">Match Overview</p>
        </div>
        <button onclick="closeScorecardModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center font-bold">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="overflow-y-auto p-4 flex-1 custom-scroll space-y-4">
        <div class="overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
          <table class="w-full text-center text-xs">
            <thead class="bg-blue-900 text-white font-bold uppercase text-[10px]">
              <tr>
                <th class="py-2.5 px-2 text-left pl-3">Hole</th>
                <th class="py-2.5 px-1">Dist</th>
                <th class="py-2.5 px-1">Par</th>
                <th class="py-2.5 px-2 text-blue-200">Jeffery</th>
                <th class="py-2.5 px-2 text-sky-200">Jack</th>
                <th class="py-2.5 px-1 text-slate-300">Diff</th>
              </tr>
            </thead>
            <tbody id="scorecardTableBody" class="divide-y divide-slate-100 font-semibold text-slate-800"></tbody>
            <tfoot class="bg-blue-950 font-black text-white divide-y divide-blue-900" id="scorecardTableFoot"></tfoot>
          </table>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <button onclick="exportToSheets()" class="py-3 px-4 rounded-xl bg-blue-600 active:bg-blue-500 text-white font-black text-xs flex items-center justify-center gap-2 border border-blue-400 shadow">
            <i class="fa-solid fa-file-csv text-base"></i>
            <span>Export to CSV</span>
          </button>
          <button onclick="finishAndSaveRound()" class="py-3 px-4 rounded-xl bg-emerald-600 active:bg-emerald-500 text-white font-black text-xs flex items-center justify-center gap-2 border border-emerald-400 shadow">
            <i class="fa-solid fa-floppy-disk text-base"></i>
            <span>Save Round</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- COURSE CATALOG & SETTINGS MODAL -->
  <div id="modalCourse" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white text-slate-900 border border-slate-200 rounded-3xl max-w-sm w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto custom-scroll shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <h3 class="font-black text-slate-900 text-base">Select Course</h3>
        <button onclick="closeCourseModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Preset UDisc Courses</label>
        <select id="selectPresetCourse" onchange="loadSelectedPresetCourse(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-slate-900 font-bold text-xs focus:outline-none focus:border-blue-500">
          <option value="sarko">Sar-Ko-Par Trails (9H · Par 27)</option>
          <option value="mize">Mize Elementary (9H · Par 27)</option>
          <option value="lakeside">Lakeside Hills (19H · Par 57)</option>
          <option value="blackhoof_18">Black Hoof Championship (18H · Par 58)</option>
          <option value="blackhoof_9">Black Hoof Flying Disc (9H · Par 27)</option>
          <option value="smp_wooded">Shawnee Mission Wooded (18H · Par 54)</option>
          <option value="smp_art9">The Art Nine @ SMP (9H · Par 27)</option>
          <option value="california_trail">California Trail MS (9H · Par 29)</option>
          <option value="prairie_center">Prairie Center Park (18H · Par 55)</option>
          <option value="wolf_den">Wolf Den @ Mission Trail (18H · Par 54)</option>
          <option value="harmon">Harmon & Santa Fe Parks (9H · Par 27)</option>
          <option value="indian_woods">Indian Woods MS (9H · Par 27)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Custom Name</label>
        <input type="text" id="inputCourseName" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-slate-900 font-bold text-xs focus:outline-none" value="Sar-Ko-Par Trails">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Date</label>
          <input type="date" id="inputRoundDate" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2 py-2 text-slate-900 text-xs font-bold focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tee Time</label>
          <input type="time" id="inputRoundTime" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-2 py-2 text-slate-900 text-xs font-bold focus:outline-none">
        </div>
      </div>

      <div class="pt-2 flex gap-2">
        <button onclick="resetCurrentRound()" class="flex-1 py-2.5 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold active:scale-95">Reset Scores</button>
        <button onclick="saveCourseSettings()" class="flex-1 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-extrabold active:scale-95 shadow">Apply</button>
      </div>
    </div>
  </div>

  <!-- SAVED HISTORY MODAL -->
  <div id="modalHistory" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex-col justify-end">
    <div class="bg-white text-slate-900 border-t border-slate-200 rounded-t-3xl max-w-lg mx-auto w-full max-h-[80vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="px-5 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="font-black text-lg text-slate-900">Saved Rounds</h3>
        <button onclick="closeHistoryModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="historyList" class="p-4 overflow-y-auto space-y-3 custom-scroll flex-1"></div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    const COURSE_DATABASE = {
      sarko: {
        name: "Sar-Ko-Par Trails",
        totalHoles: 9,
        holes: [
          { number: 1, dist: 128, par: 3 },
          { number: 2, dist: 197, par: 3 },
          { number: 3, dist: 167, par: 3 },
          { number: 4, dist: 165, par: 3 },
          { number: 5, dist: 131, par: 3 },
          { number: 6, dist: 125, par: 3 },
          { number: 7, dist: 139, par: 3 },
          { number: 8, dist: 204, par: 3 },
          { number: 9, dist: 121, par: 3 }
        ]
      },
      mize: {
        name: "Mize Elementary",
        totalHoles: 9,
        holes: [
          { number: 1, dist: 218, par: 3 },
          { number: 2, dist: 264, par: 3 },
          { number: 3, dist: 294, par: 3 },
          { number: 4, dist: 296, par: 3 },
          { number: 5, dist: 296, par: 3 },
          { number: 6, dist: 310, par: 3 },
          { number: 7, dist: 324, par: 3 },
          { number: 8, dist: 235, par: 3 },
          { number: 9, dist: 389, par: 3 }

    const STORAGE_KEY = 'dg_round_v6';
    const HISTORY_KEY = 'dg_history_v6';
    const THEME_KEY = 'dg_theme_mode_v2';

    let roundState = {
      courseKey: 'sarko',
      courseName: 'Sar-Ko-Par Trails',
      totalHoles: 9,
      date: new Date().toISOString().split('T')[0],
      time: new Date().toTimeString().slice(0, 5),
      currentHoleIndex: 0,
      holes: []
    };

    function init() {
      const savedTheme = localStorage.getItem(THEME_KEY) || 'theme-blue';
      applyTheme(savedTheme);

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { roundState = JSON.parse(saved); } catch(e){}
      }
      if (!roundState.holes || roundState.holes.length === 0) {
        loadPresetData('sarko');
      }
      renderHeader();
      renderCurrentHole();
    }

    function toggleTheme() {
      const current = document.body.classList.contains('theme-blue') ? 'theme-blue' : 'theme-white';
      const nextTheme = current === 'theme-blue' ? 'theme-white' : 'theme-blue';
      applyTheme(nextTheme);
      localStorage.setItem(THEME_KEY, nextTheme);
    }

    function applyTheme(themeName) {
      document.body.classList.remove('theme-blue', 'theme-white');
      document.body.classList.add(themeName);
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(roundState));
      renderHeader();
    }

    function loadPresetData(key) {
      const course = COURSE_DATABASE[key] || COURSE_DATABASE.sarko;
      roundState.courseKey = key;
      roundState.courseName = course.name;
      roundState.totalHoles = course.totalHoles;
      roundState.currentHoleIndex = 0;
      // All scores start at 0
      roundState.holes = course.holes.map(h => ({
        number: h.number,
        par: h.par,
        distance: h.dist,
        jeffery: 0,
        jack: 0,
        scored: false
      }));
      saveState();
      renderHeader();
      renderCurrentHole();
    }

    function loadSelectedPresetCourse(key) {
      if (confirm(`Load official course layout for ${COURSE_DATABASE[key].name}? Scores will reset to 0.`)) {
        loadPresetData(key);
        document.getElementById('inputCourseName').value = roundState.courseName;
      }
    }

    function toggleHoleCountDirect() {
      const newTotal = roundState.totalHoles === 9 ? 18 : 9;
      if (confirm(`Switch round format to ${newTotal} holes?`)) {
        roundState.totalHoles = newTotal;
        if (newTotal === 9) {
          roundState.holes = roundState.holes.slice(0, 9);
        } else {
          while (roundState.holes.length < 18) {
            const num = roundState.holes.length + 1;
            roundState.holes.push({ number: num, par: 3, distance: 300, jeffery: 0, jack: 0, scored: false });
          }
        }
        if (roundState.currentHoleIndex >= newTotal) {
          roundState.currentHoleIndex = newTotal - 1;
        }
        saveState();
        renderHeader();
        renderCurrentHole();
      }
    }

    function renderHeader() {
      document.getElementById('headerCourseName').innerText = roundState.courseName;
      document.getElementById('headerHoleCountBadge').innerText = `${roundState.totalHoles}H`;
      document.getElementById('btnQuickToggle').innerText = `${roundState.totalHoles}H`;
      document.getElementById('headerDateTime').innerText = `${roundState.date} · ${roundState.time}`;
      document.getElementById('totalHolesMaxLabel').innerText = `/ ${roundState.totalHoles}`;
    }

    function renderCurrentHole() {
      const h = roundState.holes[roundState.currentHoleIndex];
      document.getElementById('currentHoleLabel').innerText = h.number;
      document.getElementById('parDisplay').innerText = h.par;
      document.getElementById('distanceDisplay').innerText = h.distance;

      document.getElementById('jefferyHoleScore').innerText = h.jeffery;
      document.getElementById('jackHoleScore').innerText = h.jack;

      updateBadge('jefferyScoreBadge', h.jeffery, h.par);
      updateBadge('jackScoreBadge', h.jack, h.par);

      document.getElementById('btnPrevHoleTop').disabled = roundState.currentHoleIndex === 0;
      document.getElementById('btnBottomPrev').disabled = roundState.currentHoleIndex === 0;

      const nextBtnText = document.getElementById('nextHoleText');
      if (roundState.currentHoleIndex === roundState.totalHoles - 1) {
        nextBtnText.innerText = "Finish";
      } else {
        nextBtnText.innerText = "Next";
      }

      calculateTotals();
    }

    function updateBadge(id, score, par) {
      const el = document.getElementById(id);
      if (score === 0) {
        el.innerText = "-";
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-slate-200 text-slate-700 shadow-sm";
        return;
      }
      const diff = score - par;
      if (score === 1) {
        el.innerText = "ACE 🎯";
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-amber-500 text-white shadow";
      } else if (diff <= -2) {
        el.innerText = "Eagle";
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-emerald-600 text-white shadow";
      } else if (diff === -1) {
        el.innerText = "Birdie";
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-emerald-500 text-white shadow";
      } else if (diff === 0) {
        el.innerText = "Par";
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-blue-700 text-white shadow";
      } else if (diff === 1) {
        el.innerText = "Bogey";
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-orange-600 text-white shadow";
      } else {
        el.innerText = `+${diff} Bogey`;
        el.className = "px-2.5 py-0.5 rounded-full text-xs font-black bg-rose-600 text-white shadow";
      }
    }

    function adjustPlayerScore(player, delta) {
      const h = roundState.holes[roundState.currentHoleIndex];
      // Starts at 0, allows incrementing up or decrementing back to 0
      h[player] = Math.max(0, h[player] + delta);
      h.scored = (h[player] > 0);
      saveState();
      renderCurrentHole();
    }

    function setPlayerScorePreset(player, type) {
      const h = roundState.holes[roundState.currentHoleIndex];
      if (type === 1) h[player] = 1;
      else if (type === 'birdie') h[player] = Math.max(1, h.par - 1);
      else if (type === 'par') h[player] = h.par;
      else if (type === 'bogey') h[player] = h.par + 1;
      h.scored = true;
      saveState();
      renderCurrentHole();
    }

    function adjustPar(delta) {
      const h = roundState.holes[roundState.currentHoleIndex];
      h.par = Math.max(2, Math.min(6, h.par + delta));
      saveState();
      renderCurrentHole();
    }

    function editDistance() {
      const h = roundState.holes[roundState.currentHoleIndex];
      const input = prompt("Hole distance (ft):", h.distance);
      if (input !== null && !isNaN(parseInt(input))) {
        h.distance = parseInt(input);
        saveState();
        renderCurrentHole();
      }
    }

    function prevHole() {
      if (roundState.currentHoleIndex > 0) {
        roundState.currentHoleIndex--;
        saveState();
        renderCurrentHole();
      }
    }

    function nextHole() {
      if (roundState.currentHoleIndex < roundState.totalHoles - 1) {
        roundState.currentHoleIndex++;
        saveState();
        renderCurrentHole();
      } else {
        openScorecardModal();
      }
    }

    function calculateTotals() {
      let jTot = 0, kTot = 0, playedParJ = 0, playedParK = 0;
      
      roundState.holes.forEach(h => {
        if (h.jeffery > 0) {
          jTot += h.jeffery;
          playedParJ += h.par;
        }
        if (h.jack > 0) {
          kTot += h.jack;
          playedParK += h.par;
        }
      });

      const jDiff = (playedParJ > 0) ? (jTot - playedParJ) : 0;
      const kDiff = (playedParK > 0) ? (kTot - playedParK) : 0;

      const fmt = d => d === 0 ? 'E' : (d > 0 ? `+${d}` : `${d}`);

      document.getElementById('jefferyRelative').innerText = `Total: ${jTot} (${fmt(jDiff)})`;
      document.getElementById('jackRelative').innerText = `Total: ${kTot} (${fmt(kDiff)})`;
      document.getElementById('tickerScoreJeffery').innerText = `${jTot} (${fmt(jDiff)})`;
      document.getElementById('tickerScoreJack').innerText = `${kTot} (${fmt(kDiff)})`;

      const ticker = document.getElementById('matchStatusText');
      if (jTot === 0 && kTot === 0) {
        ticker.innerHTML = '<span class="w-2 h-2 rounded-full bg-slate-400 inline-block"></span><span>Round Ready</span>';
      } else if (jTot === kTot) {
        ticker.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span><span>All Square</span>';
      } else if (jTot < kTot) {
        ticker.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-500 inline-block"></span><span>Jeffery +${kTot - jTot} up</span>`;
      } else {
        ticker.innerHTML = `<span class="w-2 h-2 rounded-full bg-sky-400 inline-block"></span><span>Jack +${jTot - kTot} up</span>`;
      }
    }

    function openCourseModal() {
      document.getElementById('inputCourseName').value = roundState.courseName;
      document.getElementById('inputRoundDate').value = roundState.date;
      document.getElementById('inputRoundTime').value = roundState.time;
      document.getElementById('modalCourse').classList.remove('hidden');
      document.getElementById('modalCourse').classList.add('flex');
    }

    function closeCourseModal() {
      document.getElementById('modalCourse').classList.add('hidden');
      document.getElementById('modalCourse').classList.remove('flex');
    }

    function saveCourseSettings() {
      roundState.courseName = document.getElementById('inputCourseName').value || 'Course';
      roundState.date = document.getElementById('inputRoundDate').value || roundState.date;
      roundState.time = document.getElementById('inputRoundTime').value || roundState.time;
      saveState();
      renderHeader();
      closeCourseModal();
    }

    function resetCurrentRound() {
      if (confirm("Reset current scores back to 0?")) {
        roundState.currentHoleIndex = 0;
        roundState.holes.forEach(h => {
          h.jeffery = 0;
          h.jack = 0;
          h.scored = false;
        });
        saveState();
        renderCurrentHole();
        closeCourseModal();
      }
    }

    function openScorecardModal() {
      buildScorecardTable();
      document.getElementById('modalCardSubtitle').innerText = `${roundState.courseName} · ${roundState.totalHoles} Holes`;
      document.getElementById('modalScorecard').classList.remove('hidden');
      document.getElementById('modalScorecard').classList.add('flex');
    }

    function closeScorecardModal() {
      document.getElementById('modalScorecard').classList.add('hidden');
      document.getElementById('modalScorecard').classList.remove('flex');
    }

    function buildScorecardTable() {
      const tbody = document.getElementById('scorecardTableBody');
      const tfoot = document.getElementById('scorecardTableFoot');
      tbody.innerHTML = '';
      tfoot.innerHTML = '';

      let totPar = 0, totJ = 0, totK = 0;

      roundState.holes.forEach((h, idx) => {
        totPar += h.par;
        totJ += h.jeffery;
        totK += h.jack;

        let diffText = '-';
        if (h.jeffery > 0 && h.jack > 0) {
          const diff = h.jeffery - h.jack;
          diffText = diff === 0 ? 'Tie' : (diff < 0 ? `J ${Math.abs(diff)}` : `K ${diff}`);
        }

        const tr = document.createElement('tr');
        tr.className = (idx === roundState.currentHoleIndex) ? 'bg-blue-100 font-black' : '';
        tr.innerHTML = `
          <td class="py-2 px-2 text-left pl-3 text-slate-800">#${h.number}</td>
          <td class="py-2 px-1 text-slate-500">${h.distance}'</td>
          <td class="py-2 px-1 text-slate-500">${h.par}</td>
          <td class="py-2 px-2 font-black ${h.jeffery > 0 && (h.jeffery < h.jack || h.jack === 0) ? 'text-blue-700' : 'text-slate-800'}">${h.jeffery || '-'}</td>
          <td class="py-2 px-2 font-black ${h.jack > 0 && (h.jack < h.jeffery || h.jeffery === 0) ? 'text-blue-700' : 'text-slate-800'}">${h.jack || '-'}</td>
          <td class="py-2 px-1 text-[11px] text-slate-500 font-bold">${diffText}</td>
        `;
        tbody.appendChild(tr);
      });

      const winner = (totJ === 0 && totK === 0) ? '-' : (totJ === totK ? 'TIE' : (totJ < totK ? 'JEFFERY' : 'JACK'));
      tfoot.innerHTML = `
        <tr class="text-sm bg-blue-950 font-black text-white">
          <td class="py-2.5 px-2 text-left pl-3">TOTAL</td>
          <td></td>
          <td class="py-2.5 px-1">${totPar}</td>
          <td class="py-2.5 px-2 text-blue-300 font-black">${totJ}</td>
          <td class="py-2.5 px-2 text-blue-300 font-black">${totK}</td>
          <td class="py-2.5 px-1 text-xs text-emerald-400 font-black">${winner}</td>
        </tr>
      `;
    }

    function exportToSheets() {
      let csv = "Course,Format,Date,Time,Hole,Distance_ft,Par,Jeffery_Score,Jack_Score,Hole_Winner\n";
      roundState.holes.forEach(h => {
        let winner = "-";
        if (h.jeffery > 0 && h.jack > 0) {
          if (h.jeffery < h.jack) winner = "Jeffery";
          else if (h.jack < h.jeffery) winner = "Jack";
          else winner = "Tie";
        }
        csv += `"${roundState.courseName}","${roundState.totalHoles}H","${roundState.date}","${roundState.time}",${h.number},${h.distance},${h.par},${h.jeffery},${h.jack},"${winner}"\n`;
      });

      let totPar = roundState.holes.reduce((a, b) => a + b.par, 0);
      let totJ = roundState.holes.reduce((a, b) => a + b.jeffery, 0);
      let totK = roundState.holes.reduce((a, b) => a + b.jack, 0);
      let winner = (totJ === 0 && totK === 0) ? "Incomplete" : (totJ === totK ? "Tied" : (totJ < totK ? "Jeffery" : "Jack"));
      csv += `"${roundState.courseName} TOTAL","${roundState.totalHoles}H","${roundState.date}","${roundState.time}","TOT",-,${totPar},${totJ},${totK},"${winner}"\n`;

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `${roundState.courseName.replace(/\s+/g, '_')}_${roundState.date}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function finishAndSaveRound() {
      let history = [];
      const saved = localStorage.getItem(HISTORY_KEY);
      if (saved) { try { history = JSON.parse(saved); } catch(e){} }

      const totPar = roundState.holes.reduce((a, b) => a + b.par, 0);
      const totJ = roundState.holes.reduce((a, b) => a + b.jeffery, 0);
      const totK = roundState.holes.reduce((a, b) => a + b.jack, 0);

      history.unshift({
        id: Date.now(),
        courseName: roundState.courseName,
        totalHoles: roundState.totalHoles,
        date: roundState.date,
        time: roundState.time,
        par: totPar,
        jeffery: totJ,
        jack: totK,
        winner: totJ === totK ? 'Tie' : (totJ < totK ? 'Jeffery' : 'Jack')
      });

      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      alert("Round saved to history!");
      closeScorecardModal();
    }

    function renderHistory() {
      const container = document.getElementById('historyList');
      container.innerHTML = '';
      let history = [];
      const saved = localStorage.getItem(HISTORY_KEY);
      if (saved) { try { history = JSON.parse(saved); } catch(e){} }

      if (history.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">No saved rounds yet.</div>`;
        return;
      }

      history.forEach(r => {
        const item = document.createElement('div');
        item.className = "bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center justify-between";
        item.innerHTML = `
          <div>
            <h4 class="font-extrabold text-slate-900 text-sm">${r.courseName} <span class="text-xs text-blue-600">(${r.totalHoles}H)</span></h4>
            <span class="text-[11px] text-slate-500 font-semibold">${r.date} · Par ${r.par}</span>
            <div class="text-xs mt-1 font-bold text-slate-700">
              Jeffery: <span class="text-blue-700 font-black">${r.jeffery}</span> | Jack: <span class="text-blue-900 font-black">${r.jack}</span>
            </div>
          </div>
          <span class="px-2.5 py-1 rounded-lg text-xs font-black ${r.winner === 'Jeffery' ? 'bg-blue-100 text-blue-800 border border-blue-200' : (r.winner === 'Jack' ? 'bg-indigo-100 text-indigo-800 border border-indigo-200' : 'bg-slate-100 text-slate-600')}">
            ${r.winner === 'Tie' ? 'TIE' : r.winner + ' Won'}
          </span>
        `;
        container.appendChild(item);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
