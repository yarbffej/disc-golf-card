    function formatRelativePar(diff) {
      if (diff === 0) return 'E';
      return diff > 0 ? `+${diff}` : `${diff}`;
    }

    function getScoreTerm(score, par) {
      if (!score || score <= 0) {
        return { label: 'Unscored', shortLabel: '—', textColor: 'text-slate-400', bgColor: 'bg-[#0D1120]', borderColor: 'border-slate-800' };
      }
      if (score === 1) {
        return { label: 'Ace', shortLabel: 'ACE', textColor: 'accent-gold text-[#FACC15]', bgColor: 'bg-[#FACC15]/15', borderColor: 'border-[#FACC15]' };
      }
      const diff = score - par;
      if (diff <= -2) {
        return { label: 'Eagle', shortLabel: 'EAG', textColor: 'accent-lime text-[#39FF14]', bgColor: 'bg-[#39FF14]/20', borderColor: 'border-[#39FF14]' };
      }
      if (diff === -1) {
        return { label: 'Birdie', shortLabel: 'BIR', textColor: 'accent-lime text-[#39FF14]', bgColor: 'bg-[#39FF14]/15', borderColor: 'border-[#39FF14]/80' };
      }
      if (diff === 0) {
        return { label: 'Par', shortLabel: 'PAR', textColor: 'accent-cyan text-[#00F0FF]', bgColor: 'bg-[#00F0FF]/10', borderColor: 'border-[#00F0FF]/60' };
      }
      if (diff === 1) {
        return { label: 'Bogey', shortLabel: 'BOG', textColor: 'text-[#FF9E00]', bgColor: 'bg-[#FF9E00]/15', borderColor: 'border-[#FF9E00]/70' };
      }
      if (diff === 2) {
        return { label: 'Double Bogey', shortLabel: 'DBL', textColor: 'accent-pink text-[#FF2E93]', bgColor: 'bg-[#FF2E93]/15', borderColor: 'border-[#FF2E93]/80' };
      }
      return { label: `+${diff}`, shortLabel: `+${diff}`, textColor: 'accent-pink text-[#FF2E93]', bgColor: 'bg-[#FF2E93]/25', borderColor: 'border-[#FF2E93]' };
    }

    function getHoleCaddyInsights(courseName, holeNumber, history, playerIds) {
      const courseRounds = history.filter((r) => r.courseName.toLowerCase() === courseName.toLowerCase());
      const playerStats = {};
      for (const pid of playerIds) {
        const scores = [];
        for (const r of courseRounds) {
          const h = r.holes.find((hole) => hole.number === holeNumber);
          if (h && h.scores && h.scores[pid] && h.scores[pid] > 0) {
            scores.push({ score: h.scores[pid], par: h.par });
          }
        }
        if (scores.length === 0) {
          playerStats[pid] = { avgScore: 0, bestScore: null, worstScore: null, birdies: 0, pars: 0, bogeysOrWorse: 0 };
        } else {
          const sum = scores.reduce((acc, s) => acc + s.score, 0);
          const best = Math.min(...scores.map((s) => s.score));
          const worst = Math.max(...scores.map((s) => s.score));
          const birdies = scores.filter((s) => s.score < s.par).length;
          const pars = scores.filter((s) => s.score === s.par).length;
          const bogeysOrWorse = scores.filter((s) => s.score > s.par).length;
          playerStats[pid] = {
            avgScore: Number((sum / scores.length).toFixed(2)),
            bestScore: best,
            worstScore: worst,
            birdies,
            pars,
            bogeysOrWorse
          };
        }
      }
      return { holeNumber, roundsPlayed: courseRounds.length, playerStats };
    }

    function getCoursePersonalBest(courseName, playerId, history) {
      const matching = history.filter(
        (r) => r.courseName.toLowerCase() === courseName.toLowerCase() && r.players.some((p) => p.id === playerId && p.total > 0)
      );
      if (matching.length === 0) {
        return { bestTotal: null, bestRelPar: null, avgTotal: null, roundsCount: 0 };
      }
      let bestTotal = Infinity;
      let bestRelPar = Infinity;
      let sumTotal = 0;
      for (const r of matching) {
        const p = r.players.find((pl) => pl.id === playerId);
        sumTotal += p.total;
        if (p.total < bestTotal) {
          bestTotal = p.total;
          bestRelPar = p.total - r.par;
        }
      }
      return {
        bestTotal,
        bestRelPar,
        avgTotal: Number((sumTotal / matching.length).toFixed(1)),
        roundsCount: matching.length
      };
    }

    function computePlayerCareerProfile(playerId, history) {
      let roundsPlayed = 0;
      let holesPlayed = 0;
      let totalStrokes = 0;
      let totalPar = 0;
      let aces = 0;
      let birdies = 0;
      let pars = 0;
      let bogeys = 0;
      let doubleOrWorse = 0;
      let bestRoundRelPar = null;
      const brackets = [
        { label: 'Putters & Touch (SPD 2–4)', rangeText: '< 185 ft', min: 0, max: 184, count: 0, diffSum: 0 },
        { label: 'Midrange Trio (SPD 5)', rangeText: '185–239 ft', min: 185, max: 239, count: 0, diffSum: 0 },
        { label: 'Fairway Workhorse (SPD 7–9)', rangeText: '240–299 ft', min: 240, max: 299, count: 0, diffSum: 0 },
        { label: 'Max Air Distance (SPD 11)', rangeText: '300+ ft', min: 300, max: 9999, count: 0, diffSum: 0 }
      ];

      for (const round of history) {
        const pSummary = round.players.find((p) => p.id === playerId);
        if (!pSummary) continue;
        roundsPlayed++;
        const roundDiff = pSummary.total - round.par;
        if (!bestRoundRelPar || roundDiff < bestRoundRelPar.diff) {
          bestRoundRelPar = { diff: roundDiff, courseName: round.courseName, date: round.date, score: pSummary.total, par: round.par };
        }
        for (const h of round.holes) {
          const s = h.scores ? h.scores[playerId] : 0;
          if (!s || s <= 0) continue;
          holesPlayed++;
          totalStrokes += s;
          totalPar += h.par;
          if (s === 1) aces++;
          const d = s - h.par;
          if (d <= -1) birdies++;
          else if (d === 0) pars++;
          else if (d === 1) bogeys++;
          else doubleOrWorse++;
          const b = brackets.find((br) => h.distance >= br.min && h.distance <= br.max);
          if (b) {
            b.count++;
            b.diffSum += d;
          }
        }
      }
      const overallRelPar = totalStrokes - totalPar;
      const avgRelParPer9 = holesPlayed > 0 ? Number(((overallRelPar / holesPlayed) * 9).toFixed(1)) : 0;
      return {
        playerId,
        roundsPlayed,
        holesPlayed,
        totalStrokes,
        totalPar,
        overallRelPar,
        avgRelParPer9,
        aces,
        birdies,
        pars,
        bogeys,
        doubleOrWorse,
        bestRoundRelPar,
        distanceBrackets: brackets.map((b) => ({
          label: b.label,
          rangeText: b.rangeText,
          holesCount: b.count,
          avgRelPar: b.count > 0 ? Number((b.diffSum / b.count).toFixed(2)) : 0
        }))
      };
    }

    function computeHeadToHead(p1Id, p2Id, history) {
      let sharedRounds = 0;
      let p1Wins = 0;
      let p2Wins = 0;
      let ties = 0;
      let sharedHoles = 0;
      let p1Skins = 0;
      let p2Skins = 0;
      let pushedHoles = 0;
      let p1TotalStrokesInShared = 0;
      let p2TotalStrokesInShared = 0;
      const roundByRound = [];

      for (const r of history) {
        const p1 = r.players.find((p) => p.id === p1Id);
        const p2 = r.players.find((p) => p.id === p2Id);
        if (!p1 || !p2) continue;
        sharedRounds++;
        p1TotalStrokesInShared += p1.total;
        p2TotalStrokesInShared += p2.total;
        let winnerId = 'tie';
        if (p1.total < p2.total) {
          p1Wins++;
          winnerId = p1Id;
        } else if (p2.total < p1.total) {
          p2Wins++;
          winnerId = p2Id;
        } else {
          ties++;
        }
        roundByRound.push({
          id: r.id,
          date: r.date,
          courseName: r.courseName,
          par: r.par,
          p1Score: p1.total,
          p2Score: p2.total,
          winnerId,
          margin: Math.abs(p1.total - p2.total)
        });
        for (const h of r.holes) {
          const s1 = h.scores ? h.scores[p1Id] : 0;
          const s2 = h.scores ? h.scores[p2Id] : 0;
          if (s1 > 0 && s2 > 0) {
            sharedHoles++;
            if (s1 < s2) p1Skins++;
            else if (s2 < s1) p2Skins++;
            else pushedHoles++;
          }
        }
      }
      return {
        sharedRounds,
        p1Wins,
        p2Wins,
        ties,
        sharedHoles,
        p1Skins,
        p2Skins,
        pushedHoles,
        p1TotalStrokesInShared,
        p2TotalStrokesInShared,
        roundByRound
      };
    }

    function computeFlightPathSvg(disc, wind = 'calm', releaseAngle = 'flat') {
      const startX = 130;
      const startY = 295;
      let windDistMod = 1.0;
      if (wind === 'tailwind') windDistMod = 1.08;
      if (wind === 'headwind') windDistMod = disc.turn <= -3 ? 0.85 : 0.94;
      const estFeet = Math.round(disc.idealMaxFeet * windDistMod);
      const normDist = Math.min(0.92, Math.max(0.36, estFeet / 410));
      const endY = Math.round(startY - normDist * 255);

      let effTurn = disc.turn;
      if (wind === 'headwind') effTurn -= 1.5;
      if (wind === 'tailwind') effTurn += 1.0;
      if (releaseAngle === 'hyzer') effTurn += 1.5;
      if (releaseAngle === 'anhyzer') effTurn -= 1.8;

      let effFade = disc.fade;
      if (wind === 'headwind') effFade = Math.max(0, effFade - 0.8);
      if (wind === 'tailwind') effFade += 0.6;
      if (releaseAngle === 'hyzer') effFade += 0.8;
      if (releaseAngle === 'anhyzer') effFade = Math.max(0, effFade - 1.0);

      const turnPullX = Math.min(235, Math.max(45, startX + (-effTurn) * 16));
      const turnPullY = Math.round(startY - (startY - endY) * 0.62);
      const netLateral = (-effTurn) * 10 - effFade * 15;
      const endX = Math.min(235, Math.max(25, Math.round(startX + netLateral)));

      const cp1X = startX + (turnPullX - startX) * 0.45;
      const cp1Y = Math.round(startY - (startY - endY) * 0.35);
      const cp2X = turnPullX;
      const cp2Y = Math.round(startY - (startY - endY) * 0.78);
      const pathD = `M ${startX} ${startY} C ${Math.round(cp1X)} ${cp1Y}, ${Math.round(cp2X)} ${cp2Y}, ${endX} ${endY}`;

      return { pathD, endX, endY, apexX: Math.round(turnPullX), apexY: turnPullY, estimatedFeet: estFeet };
    }

    function computeLiveSkinsAndMatch(holes, p1Id, p2Id) {
      let p1SkinsWon = 0;
      let p2SkinsWon = 0;
      let carryover = 0;
      let p1HolesUp = 0;
      const holeWinners = {};

      for (const h of holes) {
        const s1 = (h.scores && h.scores[p1Id]) || 0;
        const s2 = (h.scores && h.scores[p2Id]) || 0;
        if (s1 === 0 || s2 === 0) {
          holeWinners[h.number] = { winner: 'unplayed', skinsAwarded: 0 };
          continue;
        }
        const pot = 1 + carryover;
        if (s1 < s2) {
          p1SkinsWon += pot;
          carryover = 0;
          p1HolesUp += 1;
          holeWinners[h.number] = { winner: p1Id, skinsAwarded: pot };
        } else if (s2 < s1) {
          p2SkinsWon += pot;
          carryover = 0;
          p1HolesUp -= 1;
          holeWinners[h.number] = { winner: p2Id, skinsAwarded: pot };
        } else {
          carryover += 1;
          holeWinners[h.number] = { winner: 'push', skinsAwarded: 0 };
        }
      }
      let matchStatusText = 'All Square (AS)';
      if (p1HolesUp > 0) matchStatusText = `${p1Id === 'jeffery' ? 'Jeffery' : 'P1'} ${p1HolesUp} UP`;
      else if (p1HolesUp < 0) matchStatusText = `${p2Id === 'jack' ? 'Jack' : 'P2'} ${Math.abs(p1HolesUp)} UP`;

      return { p1SkinsWon, p2SkinsWon, currentCarryover: carryover, matchStatusText, holeWinners };
    }

    function buildNotebookGeminiDossier({ courseName, date, windCondition, duration, holes, players, roundTranscript, bag }) {
      const totalPar = holes.reduce((acc, h) => acc + h.par, 0);
      const totalDist = holes.reduce((acc, h) => acc + h.distance, 0);
      const playerSummaries = players
        .map((p) => {
          const strokes = holes.reduce((s, h) => s + ((h.scores && h.scores[p.id]) || h.par), 0);
          const diff = strokes - totalPar;
          return `- **${p.name} (${p.tag || p.id})**: ${strokes} throws (${formatRelativePar(diff)})`;
        })
        .join('\n');

      const holeLines = holes
        .map((h) => {
          const scoreParts = players
            .map((p) => {
              const sc = (h.scores && h.scores[p.id]) || 0;
              const meta = h.meta && h.meta[p.id];
              const extras = [];
              if (meta && meta.discUsed) extras.push(`Disc: ${meta.discUsed}`);
              if (meta && meta.fairwayHit) extras.push('Fairway Hit');
              if (meta && meta.puttDistance) extras.push(`${meta.puttDistance} Make`);
              if (meta && meta.obStrokes) extras.push(`OB +${meta.obStrokes}`);
              return `${p.name}: ${sc > 0 ? sc : 'Unscored'}${extras.length > 0 ? ` [${extras.join(', ')}]` : ''}`;
            })
            .join(' | ');
          const caddieRec = recommendDiscForScenario(h.distance, windCondition, bag);
          const holeVoice = h.voiceTranscript ? `\n  - **Voice Dictation on Hole #${h.number}**: "${h.voiceTranscript}"` : '';
          return `- **Hole #${h.number}** (${h.distance} ft, Par ${h.par} · Caddie Rec: ${caddieRec.primary ? caddieRec.primary.name : 'N/A'}): ${scoreParts}${holeVoice}`;

        .join('\n');

      const jefferyBagLines = bag

        .join('\n');

      const jackBagLines = bag
        .filter((d) => d.ownerId === 'jack')

        .join('\n');

      return `# DISC GOLF ROUND DOSSIER & VOICE TRANSCRIPT (FOR GEMINI / NOTEBOOKLM)

> **Prompt for Gemini / NotebookLM**: Please analyze this disc golf round report and voice narration transcript for Jeffery Bray and Jack. Extract key throwing tendencies, disc performance insights under today's wind condition, hole-by-hole lessons, and recommendations to update Jeffery's 9-Disc Innova Bag Guide and Jack's Discraft Bag.

## 1. Round Overview

- **Primary Wind Condition**: ${windCondition.toUpperCase()}
- **Round Duration**: ${duration}

## 2. Final Card Standings
${playerSummaries}

## 3. Full Round Voice Narration / Notes App Transcript
${roundTranscript && roundTranscript.trim().length > 0 ? roundTranscript.trim() : '_(Paste your Apple Notes / Google Keep voice dictation here, or use the in-app mic recorder during your round)_'}

## 4. Hole-by-Hole Scorecard, Discs Thrown & Voice Notes

    // ============================================================================
    // VIEW 2: LIVE SCORECARD VIEW
    // ============================================================================
    function LiveScorecardView({
      roundState,
      setRoundState,
      roster,
      history,
      courses,
      bag,
      timerState,
      elapsedSeconds,
      onToggleTimer,
      onResetTimer,
      onSwitchCourse,
      onSaveFinishedRound,
      webhookSyncStatus,
      onOpenBagGuide
    }) {
      const [editingHoleSpec, setEditingHoleSpec] = useState(false);
      const [caddieScenario, setCaddieScenario] = useState(roundState.windCondition || 'calm');
      const [expandedShotDetails, setExpandedShotDetails] = useState({});
      const [confirmResetModal, setConfirmResetModal] = useState(false);
      const [saveConfirmBanner, setSaveConfirmBanner] = useState(null);
      const [isListeningMic, setIsListeningMic] = useState(false);
      const [micStatusMessage, setMicStatusMessage] = useState(null);
      const [showDossierModal, setShowDossierModal] = useState(false);
      const [copiedDossier, setCopiedDossier] = useState(false);
      const recognitionRef = useRef(null);

      useEffect(() => {
        if (roundState.windCondition && roundState.windCondition !== caddieScenario) {
          setCaddieScenario(roundState.windCondition);
        }
      }, [roundState.windCondition]);

      const handleSelectWindScenario = (scenario) => {
        setCaddieScenario(scenario);
        setRoundState((prev) => ({ ...prev, windCondition: scenario }));
      };

      const activePlayerIds = roundState.activePlayerIds || roster.map((r) => r.id);
      const activePlayers = roster.filter((r) => activePlayerIds.includes(r.id));
      const currentHole = roundState.holes[roundState.currentHoleIndex] || roundState.holes[0];
      const currentCourseTemplate = courses.find(
        (c) => c.key === roundState.courseKey || c.name.toLowerCase() === roundState.courseName.toLowerCase()
      );
      const currentHoleHint = currentCourseTemplate?.holes.find((h) => h.number === currentHole.number)?.hint;
      const caddyInsight = getHoleCaddyInsights(roundState.courseName, currentHole.number, history, activePlayerIds);

      const jefferyBag = bag.filter((d) => d.ownerId !== 'jack');
      const jackBag = bag.filter((d) => d.ownerId === 'jack');
      const caddieDecision = recommendDiscForScenario(currentHole.distance, caddieScenario, jefferyBag.length > 0 ? jefferyBag : bag);
      const jackRecommendedDisc = recommendJackDisc(currentHole.distance, bag);

      const formatDuration = (secs) => {
        const hrs = Math.floor(secs / 3600);
        const mins = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        return [hrs, mins, s].map((v) => String(v).padStart(2, '0')).join(':');
      };

      const updateScore = (playerId, newScore) => {
        const clamped = Math.max(0, Math.min(15, newScore));
        setRoundState((prev) => {
          const updatedHoles = prev.holes.map((h, idx) => {
            if (idx !== prev.currentHoleIndex) return h;
            return { ...h, scores: { ...h.scores, [playerId]: clamped } };
          });
          return { ...prev, holes: updatedHoles };
        });
        if (!timerState.running && elapsedSeconds === 0 && clamped > 0) {
          onToggleTimer();
        }
      };

      const updateShotMeta = (playerId, patch) => {
        setRoundState((prev) => {
          const updatedHoles = prev.holes.map((h, idx) => {
            if (idx !== prev.currentHoleIndex) return h;
            const existingMeta = (h.meta && h.meta[playerId]) || {};
            return { ...h, meta: { ...(h.meta || {}), [playerId]: { ...existingMeta, ...patch } } };
          });
          return { ...prev, holes: updatedHoles };
        });
      };

      const updateCurrentHoleVoiceTranscript = (text) => {
        setRoundState((prev) => {
          const updatedHoles = prev.holes.map((h, idx) => (idx === prev.currentHoleIndex ? { ...h, voiceTranscript: text } : h));
          return { ...prev, holes: updatedHoles };
        });
      };

      const toggleLiveVoiceDictation = () => {
        if (isListeningMic && recognitionRef.current) {
          recognitionRef.current.stop();
          setIsListeningMic(false);
          return;
        }
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          setMicStatusMessage('Tip: Tap inside the text box below and press the microphone icon on your iPhone keyboard!');
          return;
        }
        try {
          const recognition = new SpeechRec();
          recognition.continuous = true;
          recognition.interimResults = false;
          recognition.lang = 'en-US';
          recognition.onstart = () => {
            setIsListeningMic(true);
            setMicStatusMessage(`Listening on Hole #${currentHole.number}... Speak naturally!`);
          };
          recognition.onresult = (event) => {
            let spokenChunk = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              if (event.results[i].isFinal) spokenChunk += event.results[i][0].transcript + ' ';
            }
            if (spokenChunk.trim()) {
              const cleanChunk = spokenChunk.trim();
              setRoundState((prev) => {
                const holeObj = prev.holes[prev.currentHoleIndex];
                const prevHoleVoice = holeObj?.voiceTranscript ? `${holeObj.voiceTranscript} ${cleanChunk}` : cleanChunk;
                const updatedHoles = prev.holes.map((h, idx) => (idx === prev.currentHoleIndex ? { ...h, voiceTranscript: prevHoleVoice } : h));
                const logLine = `[Hole #${holeObj.number} · ${holeObj.distance}ft Par ${holeObj.par} · ${caddieScenario}]: ${cleanChunk}`;
                const updatedRoundTranscript = prev.roundTranscript ? `${prev.roundTranscript}\n${logLine}` : logLine;
                return { ...prev, holes: updatedHoles, roundTranscript: updatedRoundTranscript, voiceRecordingConfirmed: true };
              });
            }
          };
          recognition.onerror = () => {
            setIsListeningMic(false);
            setMicStatusMessage('Mic paused — you can also tap the text box below and use your iPhone keyboard mic!');
          };
          recognition.onend = () => setIsListeningMic(false);
          recognitionRef.current = recognition;
          recognition.start();
        } catch {
          setIsListeningMic(false);
        }
      };

      const handleShareToPhoneNotes = async () => {
        const template = `🎙️ ${roundState.courseName} — Hole #${currentHole.number} (${currentHole.distance}ft, Par ${currentHole.par}, Wind: ${caddieScenario.toUpperCase()})\nJeffery Pull: ${caddieDecision.primary?.name || 'Innova'} | Jack Pull: ${jackRecommendedDisc?.name || 'Discraft'}\nNotes: ${currentHole.voiceTranscript || ''}`;
        try { await navigator.clipboard.writeText(template); } catch {}
        if (navigator.share) {
          try { await navigator.share({ title: `${roundState.courseName} — Round Voice Notes`, text: template }); } catch {}
        } else {
          setMicStatusMessage('Copied Hole & Wind header to clipboard!');
        }
      };

      const updateCurrentHoleSpec = (field, value) => {
        setRoundState((prev) => {
          const updatedHoles = prev.holes.map((h, idx) => (idx === prev.currentHoleIndex ? { ...h, [field]: Math.max(1, value) } : h));
          return { ...prev, holes: updatedHoles };
        });
      };

      const fillParForUnscored = () => {
        setRoundState((prev) => {
          const updatedHoles = prev.holes.map((h, idx) => {
            if (idx !== prev.currentHoleIndex) return h;
            const nextScores = { ...h.scores };
            for (const pid of activePlayerIds) {
              if (!nextScores[pid] || nextScores[pid] === 0) nextScores[pid] = h.par;
            }
            return { ...h, scores: nextScores };
          });
          return { ...prev, holes: updatedHoles };
        });
        if (!timerState.running && elapsedSeconds === 0) onToggleTimer();
      };

      const goToHole = (index) => {
        if (isListeningMic && recognitionRef.current) {
          recognitionRef.current.stop();
          setIsListeningMic(false);
        }
        const safeIdx = Math.max(0, Math.min(roundState.holes.length - 1, index));
        setRoundState((prev) => ({ ...prev, currentHoleIndex: safeIdx }));
      };

      const clearCurrentRoundScores = () => {
        setRoundState((prev) => ({
          ...prev,
          currentHoleIndex: 0,
          date: new Date().toISOString().slice(0, 10),
          roundTranscript: '',
          holes: prev.holes.map((h) => ({
            ...h,
            scores: Object.fromEntries(activePlayerIds.map((id) => [id, 0])),
            meta: {},
            voiceTranscript: ''
          }))
        }));
        onResetTimer();
        setConfirmResetModal(false);
      };

      const liveStandings = activePlayers.map((player) => {
        let totalStrokes = 0;
        let parThru = 0;
        let holesCompleted = 0;
        let birdiesCount = 0;
        for (const h of roundState.holes) {
          const sc = (h.scores && h.scores[player.id]) || 0;
          if (sc > 0) {
            totalStrokes += sc;
            parThru += h.par;
            holesCompleted++;
            if (sc < h.par) birdiesCount++;
          }
        }
        const relPar = totalStrokes - parThru;
        const coursePB = getCoursePersonalBest(roundState.courseName, player.id, history);
        return { player, totalStrokes, parThru, holesCompleted, relPar, birdiesCount, coursePB };
      });

      const skinsAndMatch = activePlayers.length >= 2
        ? computeLiveSkinsAndMatch(roundState.holes, activePlayers[0].id, activePlayers[1].id)
        : null;

      const totalHolesScoredAllPlayers = roundState.holes.filter((h) =>
        activePlayers.every((p) => ((h.scores && h.scores[p.id]) || 0) > 0)
      ).length;
      const totalCoursePar = roundState.holes.reduce((sum, h) => sum + h.par, 0);
      const totalCourseDistance = roundState.holes.reduce((sum, h) => sum + h.distance, 0);

      const handleSaveRoundClick = async (syncWebhook) => {
        await onSaveFinishedRound(syncWebhook);
        setSaveConfirmBanner(
          syncWebhook
            ? 'Round + Voice Transcript saved to History and dispatched to Google Sheets!'
            : 'Round + Voice Transcript saved to History! Scores reset for a fresh loop.'
        );
        setTimeout(() => setSaveConfirmBanner(null), 5000);
      };

                            <div className="text-xs font-bold uppercase text-slate-400">{player.name}'s Disc Thrown:</div>
                            <div className="flex flex-wrap gap-1.5">
                              {playerBagList.map((d) => (
                                <button
                                  key={d.id}
                                  onClick={() => updateShotMeta(player.id, { discUsed: holeMeta.discUsed === d.name ? undefined : d.name })}
                                  className={`px-2.5 py-1.5 rounded-lg text-xs font-extrabold border ${
                                    holeMeta.discUsed === d.name
                                      ? 'bg-[#39FF14] text-slate-950 border-[#39FF14]'
                                      : 'sub-control text-slate-300 border-slate-700'
                                  }`}
                                >
                                  {d.name}
                                </button>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Bottom Hole Navigation Controls */}
              <div className="neon-card rounded-2xl border border-slate-800 p-4 flex items-center justify-between gap-2">
                <button
                  disabled={roundState.currentHoleIndex === 0}
                  onClick={() => goToHole(roundState.currentHoleIndex - 1)}
                  className="sub-control min-h-[46px] px-4 rounded-xl border border-slate-700 disabled:opacity-40 text-white font-extrabold text-sm sm:text-base"
                >
                  ← Hole {Math.max(1, currentHole.number - 1)}
                </button>
                <span className="text-sm sm:text-base font-extrabold text-white">
                  Hole {currentHole.number} of {roundState.holes.length}
                </span>
                {roundState.currentHoleIndex < roundState.holes.length - 1 ? (
                  <button
                    onClick={() => goToHole(roundState.currentHoleIndex + 1)}
                    className="min-h-[46px] px-5 rounded-xl bg-[#00F0FF] text-slate-950 font-extrabold text-sm sm:text-base neon-border-cyan"
                  >
                    Next: Hole {currentHole.number + 1} →
                  </button>
                ) : (
                  <button
                    onClick={() => handleSaveRoundClick(false)}
                    className="min-h-[46px] px-5 rounded-xl bg-[#39FF14] text-slate-950 font-extrabold text-sm sm:text-base neon-border-lime"
                  >
                    Finish & Save Round ✓
                  </button>
                )}
              </div>
            </div>

            {/* RIGHT 5 COLS: Live Standings & Full Scorecard Matrix */}
            <div className="lg:col-span-5 space-y-4">
              <div className="neon-card rounded-2xl border border-slate-800 p-4 sm:p-5 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-extrabold text-base text-white">Live Standings & Course Record Pace</h3>
                  {skinsAndMatch && (
                    <span className="text-xs sm:text-sm font-extrabold accent-pink text-[#FF2E93]">
                      {roundState.gameMode === 'skins'
                        ? `Skins: J1 ${skinsAndMatch.p1SkinsWon} · J2 ${skinsAndMatch.p2SkinsWon}`
                        : skinsAndMatch.matchStatusText}
                    </span>
                  )}
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400">
                        <th className="py-2">Player</th>
                        <th className="py-2">Thru</th>
                        <th className="py-2">+/-</th>
                        <th className="py-2">Strokes</th>
                        <th className="py-2">Course PB / Avg</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800 font-bold text-white">
                      {liveStandings.map((st) => (
                        <tr key={st.player.id}>
                          <td className="py-2.5">{st.player.name} ({st.player.tag})</td>
                          <td className="py-2.5 font-mono-tabular">{st.holesCompleted}/{roundState.totalHoles}</td>
                          <td className="py-2.5 font-mono-tabular accent-cyan text-[#00F0FF]">
                            {st.holesCompleted > 0 ? formatRelativePar(st.relPar) : 'E'}
                          </td>
                          <td className="py-2.5 font-mono-tabular">{st.totalStrokes || '—'}</td>
                          <td className="py-2.5 text-slate-400">
                            {st.coursePB.bestTotal !== null ? `PB ${st.coursePB.bestTotal} · Avg ${st.coursePB.avgTotal}` : 'First Round'}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Full Scorecard Table */}
              <div className="neon-card rounded-2xl border border-slate-800 p-4 sm:p-5 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-extrabold text-base text-white">Full Card — {roundState.courseName}</h3>
                  <span className="text-xs text-slate-400 font-semibold">Tap any row to jump</span>
                </div>
                <div className="overflow-x-auto max-h-96">
                  <table className="w-full text-center text-sm">
                    <thead className="border-b border-slate-800 text-slate-400">
                      <tr>
                        <th className="py-2 text-left pl-2">Hole</th>
                        <th className="py-2">Dist</th>
                        <th className="py-2">Par</th>
                        {activePlayers.map((p) => (
                          <th key={p.id} className="py-2">{p.name}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800 font-mono-tabular text-white">
                      {roundState.holes.map((h, idx) => {
                        const isCurrent = idx === roundState.currentHoleIndex;
                        return (
                          <tr
                            key={h.number}
                            onClick={() => goToHole(idx)}
                            className={`cursor-pointer ${isCurrent ? 'sub-tile font-extrabold' : ''}`}
                          >
                            <td className="py-2.5 text-left pl-2 font-bold">
                              #{h.number} {h.voiceTranscript ? '🎙️' : ''}
                            </td>
                            <td className="py-2.5 text-slate-400">{h.distance}ft</td>
                            <td className="py-2.5 text-slate-400">{h.par}</td>
                            {activePlayers.map((p) => {
                              const sc = (h.scores && h.scores[p.id]) || 0;
                              const diff = sc - h.par;
                              return (
                                <td key={p.id} className="py-2.5 font-extrabold">
                                  {sc > 0 ? sc : '—'}
                                  {sc > 0 && diff < 0 ? ' ★' : ''}
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                    </tbody>
                    <tfoot className="border-t-2 border-slate-700 font-extrabold text-white">
                      <tr>
                        <td className="py-2.5 text-left pl-2">Total</td>
                        <td className="py-2.5">{totalCourseDistance}ft</td>
                        <td className="py-2.5">{totalCoursePar}</td>
                        {liveStandings.map((st) => (
                          <td key={st.player.id} className="py-2.5">
                            {st.totalStrokes || 0} ({formatRelativePar(st.relPar)})
                          </td>
                        ))}
                      </tr>
                    </tfoot>
                  </table>
                </div>

                <div className="flex flex-col sm:flex-row gap-2.5 pt-2">
                  <button
                    onClick={() => handleSaveRoundClick(false)}
                    className="keep-white flex-1 py-3 px-4 rounded-xl bg-[#FF2E93] text-white text-sm font-extrabold neon-border-pink"
                  >
                    💾 Log Round to History
                  </button>
                  <button
                    onClick={() => handleSaveRoundClick(true)}
                    className="flex-1 py-3 px-4 rounded-xl bg-[#39FF14] text-slate-950 text-sm font-extrabold neon-border-lime"
                  >
                    {webhookSyncStatus === 'syncing' ? 'Syncing...' : '☁️ Save & Sync Google Sheet'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // VIEW 3: COURSES & BAG FLIGHT LAB
    // ============================================================================
    function CoursesAndBagView({
      courses,
      setCourses,
      bag,
      setBag,
      history,
      roster,
      onStartRoundAtCourse,
      initialSelectedDiscId,
      initialBagOwnerFilter = 'jeffery'
    }) {
      const [bagOwnerFilter, setBagOwnerFilter] = useState(initialBagOwnerFilter);
      const [selectedDiscId, setSelectedDiscId] = useState(initialSelectedDiscId || 'innova-it');
      const [simWind, setSimWind] = useState('calm');
      const [simRelease, setSimRelease] = useState('flat');
      const [packGear, setPackGear] = useState(INITIAL_PACK_GEAR);
      const [selectedCourseKey, setSelectedCourseKey] = useState(courses[0]?.key || 'sarko');
      const [courseWindPreview, setCourseWindPreview] = useState('calm');

      useEffect(() => {
        if (initialBagOwnerFilter) setBagOwnerFilter(initialBagOwnerFilter);
      }, [initialBagOwnerFilter]);

      useEffect(() => {
        if (initialSelectedDiscId && bag.some((d) => d.id === initialSelectedDiscId)) {
          setSelectedDiscId(initialSelectedDiscId);
        }
      }, [initialSelectedDiscId, bag]);

      const jefferyDiscs = bag.filter((d) => d.ownerId !== 'jack');
      const jackDiscs = bag.filter((d) => d.ownerId === 'jack');
      const visibleBag = bagOwnerFilter === 'jeffery' ? jefferyDiscs : bagOwnerFilter === 'jack' ? jackDiscs : bag;
      const selectedDisc = bag.find((d) => d.id === selectedDiscId) || visibleBag[0] || bag[0];
      const flightSvg = selectedDisc ? computeFlightPathSvg(selectedDisc, simWind, simRelease) : null;
      const activeCourse = courses.find((c) => c.key === selectedCourseKey) || courses[0];

      const speedTiers = [
        { tier: 'SPD 7-11', label: 'SPD 7–11', sub: 'Fairway & Distance' },
        { tier: 'SPD 5', label: 'SPD 5', sub: 'Midrange Lineup' },
        { tier: 'SPD 2-4', label: 'SPD 2–4', sub: 'Putters & Approach' }
      ];

      const stabilityColumns = [
        { slot: 'Overstable', title: '⬅️ OVERSTABLE (LEFT)', sub: 'Fade Left (RHBH) · Headwind' },
        { slot: 'Neutral', title: '⬆️ NEUTRAL (STRAIGHT)', sub: 'Point & Shoot · Wooded Tunnel' },
        { slot: 'Understable', title: '➡️ UNDERSTABLE (RIGHT)', sub: 'Turn Right (RHBH) · Tailwind' }
      ];

      return (
        <div className="space-y-6">
          {/* Bag Owner Switcher Header */}
          <div className="neon-card rounded-2xl border border-slate-800 p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div>
              <div className="text-xs sm:text-sm font-extrabold uppercase tracking-wider accent-cyan text-[#00F0FF]">
                Jeffery Bray: 9-Disc Innova Adventure Pack · Jack: 3-Disc Discraft Lineup
              </div>
              <h2 className="text-xl sm:text-2xl font-extrabold text-white">Bag Data & 3×3 Flight Matrix</h2>
            </div>
            <div className="flex flex-wrap gap-2">
              <button
                onClick={() => { setBagOwnerFilter('jeffery'); if (jefferyDiscs[0]) setSelectedDiscId(jefferyDiscs[0].id); }}
                className={`px-4 py-2 rounded-xl text-sm font-extrabold ${
                  bagOwnerFilter === 'jeffery' ? 'keep-white bg-[#FF2E93] text-white' : 'sub-control text-slate-300'
                }`}
              >
                Jeffery's Innova Bag ({jefferyDiscs.length})
              </button>
              <button
                onClick={() => { setBagOwnerFilter('jack'); if (jackDiscs[0]) setSelectedDiscId(jackDiscs[0].id); }}
                className={`px-4 py-2 rounded-xl text-sm font-extrabold ${
                  bagOwnerFilter === 'jack' ? 'bg-[#00F0FF] text-slate-950' : 'sub-control text-slate-300'
                }`}
              >
                Jack's Discraft Bag ({jackDiscs.length})
              </button>
              <button
                onClick={() => setBagOwnerFilter('all')}
                className={`px-4 py-2 rounded-xl text-sm font-extrabold ${
                  bagOwnerFilter === 'all' ? 'bg-[#39FF14] text-slate-950' : 'sub-control text-slate-300'
                }`}
              >
                Combined ({bag.length})
              </button>
            </div>
          </div>

          {/* Adventure Pack Gear Loadout Strip */}
          <div className="neon-card rounded-2xl border border-slate-800 p-4 sm:p-5 flex flex-wrap items-center justify-between gap-3">
            <span className="text-sm font-extrabold text-white">🎒 Pink/Blue Adventure Pack Loadout Checklist:</span>
            <div className="flex flex-wrap gap-2">
              {packGear.map((item) => (
                <button
                  key={item.id}
                  onClick={() => setPackGear((prev) => prev.map((g) => (g.id === item.id ? { ...g, packed: !g.packed } : g)))}
                  className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-extrabold border ${
                    item.packed ? 'sub-control text-white border-[#00F0FF]' : 'sub-tile text-slate-400 border-slate-700'
                  }`}
                >
                  {item.packed ? '☑ ' : '☐ '} {item.name}
                </button>
              ))}
            </div>
          </div>

          {/* 2-Column Interactive Flight Lab: 3x3 Matrix + SVG Flight Path Simulator */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            {/* LEFT 7 COLS: 3x3 Slot Coverage Matrix */}
            <div className="lg:col-span-7 neon-card rounded-2xl border border-slate-800 p-4 sm:p-5 space-y-4">
              <div>
                <h3 className="font-extrabold text-lg text-white">
                  {bagOwnerFilter === 'jeffery'
                    ? "Jeffery's 3×3 Innova Slot Coverage Matrix"
                    : bagOwnerFilter === 'jack'
                    ? "Jack's Discraft Slot Coverage Matrix"
                    : 'Combined Card 3×3 Slot Coverage Matrix'}
                </h3>
                <p className="text-xs sm:text-sm text-slate-400">Tap any disc card below to simulate its RHBH flight curve →</p>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="border-b border-slate-800">
                      <th className="p-2.5 text-xs sm:text-sm font-extrabold text-slate-400 w-28">Speed Tier</th>
                      {stabilityColumns.map((col) => (
                        <th key={col.slot} className="p-2.5">
                          <div className="text-xs sm:text-sm font-extrabold text-white">{col.title}</div>
                          <div className="text-xs text-slate-400">{col.sub}</div>
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {speedTiers.map((row) => (
                      <tr key={row.tier}>
                        <td className="p-2.5 align-top">
                          <div className="text-sm font-extrabold text-white">{row.label}</div>
                          <div className="text-xs text-slate-400">{row.sub}</div>
                        </td>
                        {stabilityColumns.map((col) => {
                          const cellDiscs = visibleBag.filter((d) => d.speedTier === row.tier && d.stabilitySlot === col.slot);
                          return (
                            <td key={col.slot} className="p-2.5 align-top space-y-2">
                              {cellDiscs.map((d) => {
                                const isSelected = selectedDisc?.id === d.id;
                                return (
                                  <button
                                    key={d.id}
                                    onClick={() => setSelectedDiscId(d.id)}
                                    className={`w-full text-left p-3 rounded-xl border-2 transition-all ${
                                      isSelected
                                        ? 'matrix-selected keep-white bg-[#131930] text-white border-[#FF2E93]'
                                        : 'sub-control text-white border-slate-700 hover:border-[#00F0FF]'
                                    }`}
                                  >
                                    <div className="flex items-center justify-between gap-1">
                                      <span className={`font-extrabold text-sm sm:text-base ${isSelected ? 'keep-white text-white' : ''}`}>
                                        {d.name}
                                      </span>
                                      <span className={`font-mono-tabular text-xs font-bold ${isSelected ? 'keep-white text-white/90' : 'text-slate-400'}`}>
                                        {d.speed}|{d.glide}|{d.turn}|{d.fade}
                                      </span>
                                    </div>
                                    <div className={`text-xs truncate mt-0.5 font-semibold ${isSelected ? 'keep-white text-white/80' : 'text-slate-400'}`}>
                                      {d.weightGrams ? `${d.weightGrams}g ` : ''}{d.plastic}
                                    </div>
                                  </button>
                                );
                              })}
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* RIGHT 5 COLS: Selected Mold Deep-Dive & Glowing RHBH Flight Path Simulator */}
            {selectedDisc && flightSvg && (
              <div className="lg:col-span-5 neon-card rounded-2xl border border-slate-800 p-4 sm:p-5 space-y-4">
                <div>
                  <span className="text-xs font-extrabold uppercase accent-pink text-[#FF2E93]">
                    {selectedDisc.ownerId === 'jack' ? "Jack's Bag" : "Jeffery's Bag"} · {selectedDisc.brand} · {selectedDisc.slotCategory}
                  </span>
                  <h3 className="text-xl font-extrabold text-white mt-0.5">
                    {selectedDisc.brand} {selectedDisc.name} — [{selectedDisc.speed} | {selectedDisc.glide} | {selectedDisc.turn} | {selectedDisc.fade}]
                  </h3>
                  <p className="text-xs sm:text-sm font-bold text-slate-400 mt-0.5">
                    {selectedDisc.plastic} {selectedDisc.weightGrams ? `· ${selectedDisc.weightGrams}g` : ''} · {selectedDisc.colorStamp}
                  </p>
                </div>

                {/* Wind & Release Angle Simulator Controls */}
                <div className="sub-tile p-3.5 rounded-xl border border-slate-800 space-y-2.5">
                  <div className="flex items-center justify-between text-xs sm:text-sm font-extrabold text-white">
                    <span>RHBH Flight Simulator</span>
                    <span className="accent-cyan text-[#00F0FF]">
                      Range: {selectedDisc.idealMinFeet}–{selectedDisc.idealMaxFeet} ft (Est. {flightSvg.estimatedFeet} ft)
                    </span>
                  </div>
                  <div className="grid grid-cols-3 gap-1.5">
                    {['calm', 'headwind', 'tailwind'].map((w) => (
                      <button
                        key={w}
                        onClick={() => setSimWind(w)}
                        className={`py-2 rounded-lg text-xs sm:text-sm font-extrabold capitalize ${
                          simWind === w ? 'bg-[#00F0FF] text-slate-950' : 'sub-control text-slate-400'
                        }`}
                      >
                        {w}
                      </button>
                    ))}
                  </div>
                  <div className="grid grid-cols-3 gap-1.5">
                    {['hyzer', 'flat', 'anhyzer'].map((rel) => (
                      <button
                        key={rel}
                        onClick={() => setSimRelease(rel)}
                        className={`py-2 rounded-lg text-xs sm:text-sm font-extrabold capitalize ${
                          simRelease === rel ? 'keep-white bg-[#FF2E93] text-white' : 'sub-control text-slate-400'
                        }`}
                      >
                        {rel}
                      </button>
                    ))}
                  </div>
                </div>

                {/* SVG Flight Path Radar */}
                <div className="bg-[#080B14] rounded-2xl p-3 border border-slate-800 flex justify-center">
                  <svg viewBox="0 0 260 320" className="w-full max-w-[260px] h-auto">
                    {[
                      { ft: 350, y: 55 },
                      { ft: 275, y: 110 },
                      { ft: 200, y: 165 },
                      { ft: 125, y: 220 }
                    ].map((grid) => (
                      <g key={grid.ft}>
                        <line x1="20" y1={grid.y} x2="240" y2={grid.y} stroke="#1E293B" strokeDasharray="4 4" />
                        <text x="24" y={grid.y - 4} fill="#94A3B8" fontSize="10" fontWeight="bold">{grid.ft} ft</text>
                      </g>
                    ))}
                    <line x1="130" y1="20" x2="130" y2="300" stroke="#334155" strokeDasharray="3 3" />
                    <path d={flightSvg.pathD} fill="none" stroke={selectedDisc.colorHex || '#00F0FF'} strokeWidth="4" strokeLinecap="round" />
                    <circle cx={flightSvg.endX} cy={flightSvg.endY} r="6" fill={selectedDisc.colorHex || '#00F0FF'} />
                    <rect x="110" y="292" width="40" height="8" rx="4" fill="#94A3B8" />
                    <text x="130" y="313" textAnchor="middle" fill="#CBD5E1" fontSize="10" fontWeight="bold">TEE PAD (RHBH)</text>
                  </svg>
                </div>

                <div className="space-y-2.5 text-xs sm:text-sm">
                  <div className="sub-tile p-3.5 rounded-xl border border-slate-800">
                    <strong className="block font-extrabold text-white mb-1">Mold & Flight Profile:</strong>
                    <span className="text-slate-300 leading-relaxed">{selectedDisc.moldAndFlight}</span>
                  </div>
                  <div className="sub-tile p-3.5 rounded-xl border border-slate-800">
                    <strong className="block font-extrabold text-white mb-1">Course Strategy:</strong>
                    <span className="text-slate-300 leading-relaxed">{selectedDisc.courseStrategy}</span>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Course Gameplan & Hole-by-Hole Disc Pulls */}
          <div className="neon-card rounded-2xl border border-slate-800 p-5 space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 className="text-lg sm:text-xl font-extrabold text-white">
                  Course Gameplan & Hole-by-Hole Disc Pulls ({activeCourse.name})
                </h3>
                <p className="text-xs sm:text-sm text-slate-400">See which mold Jeffery and Jack should pull on every hole</p>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <select
                  value={selectedCourseKey}
                  onChange={(e) => setSelectedCourseKey(e.target.value)}
                  className="sub-control h-10 px-3.5 rounded-xl border border-slate-700 text-xs sm:text-sm font-extrabold text-white"
                >
                  {courses.map((c) => (
                    <option key={c.key} value={c.key}>{c.name} ({c.totalHoles}H)</option>
                  ))}
                </select>
                {['calm', 'headwind', 'tailwind'].map((w) => (
                  <button
                    key={w}
                    onClick={() => setCourseWindPreview(w)}
                    className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-extrabold capitalize ${
                      courseWindPreview === w ? 'keep-white bg-[#FF2E93] text-white' : 'sub-control text-slate-400'
                    }`}
                  >
                    {w} Plan
                  </button>
                ))}
                <button
                  onClick={() => onStartRoundAtCourse(activeCourse.key)}
                  className="px-4 py-2 rounded-xl bg-[#39FF14] text-slate-950 text-xs sm:text-sm font-extrabold"
                >
                  Tee Off Here →
                </button>
              </div>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm">
                <thead className="border-b border-slate-800 text-slate-400">
                  <tr>
                    <th className="py-2.5">Hole</th>
                    <th className="py-2.5">Par</th>
                    <th className="py-2.5">Distance</th>
                    <th className="py-2.5">Jeffery's Innova Pull ({courseWindPreview})</th>
                    <th className="py-2.5">Jack's Discraft Pull</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800 font-bold text-white">
                  {activeCourse.holes.map((h) => {
                    const jeffRec = recommendDiscForScenario(h.distance, courseWindPreview, jefferyDiscs);
                    const jackRec = recommendJackDisc(h.distance, bag);
                    return (
                      <tr key={h.number}>
                        <td className="py-2.5">Hole #{h.number}</td>
                        <td className="py-2.5">Par {h.par}</td>
                        <td className="py-2.5 font-mono-tabular">{h.distance} ft</td>
                        <td className="py-2.5 accent-pink text-[#FF2E93]">
                          {jeffRec.primary ? `${jeffRec.primary.weightGrams || ''}g ${jeffRec.primary.name}` : '—'}
                        </td>
                        <td className="py-2.5 accent-cyan text-[#00F0FF]">
                          {jackRec ? `${jackRec.weightGrams || ''}g ${jackRec.name}` : '—'}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

          windCondition: round.windCondition || 'calm',
          duration: round.duration,
          holes: round.holes,
          players: round.players,
          roundTranscript: round.roundTranscript || round.notes,
          bag
        });

          await navigator.clipboard.writeText(dossier);
          setCopiedRoundDossierId(round.id);
          setTimeout(() => setCopiedRoundDossierId(null), 3000);
